/* ============================================================
   每月智慧複習 Monthly Smart Review
   - 完全 rule-based，不呼叫任何 AI／付費 API
   - 只讀現有資料：BOOK_LESSONS（vocab/vocab2/grammar/hw/topics）
     ＋ ST.bkSeen（開課紀錄）＋ ST.wb（生詞本收藏）＋ ST.srs（單字複習）
   - 不寫回 Firebase、不新增 collection：每次進入即時計算（computed view）
   ============================================================ */
/* 每區上限（資料不足就自然少於上限，不硬湊） */
const MR_CAP={ focus:4, vocab:20, vocabPer:5, gram:6, gramPer:2, quick:5 };
const MR_W={ unread:100, started:80, favored:50, hasGram:40, starred:25, dueWord:15, done:20, recent:-30 };

function mrLessons(ym){ return BOOK_LESSONS.filter(b=>(b.date||'').indexOf(ym)===0); }
function mrVocabOf(b){ return (b.vocab||[]).concat(b.vocab2||[]); }
function mrKey(s){ return String(s||'').toLowerCase().replace(/\s+/g,' ').trim(); }
/* 文法主題正規化：去掉編號、標點與空白，讓「Unit 53 動名詞」與「動名詞」歸為同一題 */
function mrGramKey(s){
  return String(s||'').toLowerCase()
    .replace(/unit\s*\d+/g,'').replace(/[（(].*?[)）]/g,'')
    .replace(/[^a-z一-鿿]+/g,'').trim();
}

/* 一堂課的學習狀態：未閱讀 / 已開始未完成 / 已完成。
   沒有專屬完成機制，改用「單字覆蓋率」推導：這課的字有多少已進生詞本或已排入單字卡複習。 */
function mrStatus(b){
  const seen=Number((ST.bkSeen||{})[b.id])||0;
  const vs=mrVocabOf(b);
  const touched=vs.filter(t=>wbOn(t.w)||((ST.srs||{})[wbKey(t.w)]||(ST.srs||{})[String(t.w||'').trim()])).length;
  const cov=vs.length? touched/vs.length : (seen?1:0);
  if(!seen) return {k:'unread', label:'尚未閱讀', seen:0, cov:cov};
  if(cov<0.5) return {k:'started', label:'已開始，尚未完成', seen:seen, cov:cov};
  return {k:'done', label:'已完成', seen:seen, cov:cov};
}

function mrScore(b){
  const st=mrStatus(b), vs=mrVocabOf(b);
  let s=0;
  if(st.k==='unread') s+=MR_W.unread;
  else if(st.k==='started') s+=MR_W.started;
  else s+=MR_W.done;
  if(vs.some(t=>wbOn(t.w))) s+=MR_W.favored;
  if((b.grammar||[]).length) s+=MR_W.hasGram;
  if(vs.some(t=>t.star)) s+=MR_W.starred;
  const due=vs.filter(t=>isDue(t.w)).length;
  if(due) s+=Math.min(MR_W.dueWord*due, 45);
  /* 最近 7 天內開過就降權，把版面讓給比較久沒碰的課 */
  if(st.seen && (Date.now()-st.seen) < 7*864e5) s+=MR_W.recent;
  return {score:s, st:st};
}

/* 單字挑選：跨全月去重，依重要度排序後取 10–20 個 */
function mrPickVocab(ls){
  const seen={}, out=[];
  ls.forEach(b=>{
    const w=mrScore(b);
    mrVocabOf(b).forEach(t=>{
      const k=mrKey(t.w); if(!k) return;
      if(seen[k]){ seen[k].hits++; return; }              // 重複出現：累計次數，不重複顯示
      const e={t:t, src:b, hits:1, s:0};
      if(wbOn(t.w)) e.s+=100;                             // 收藏過
      if(isDue(t.w)) e.s+=60;                             // 單字卡今天到期
      if(t.star) e.s+=50;                                 // 課程標記為重點
      if(w.st.k==='unread') e.s+=20; else if(w.st.k==='started') e.s+=12;
      seen[k]=e; out.push(e);
    });
  });
  out.forEach(e=>{ if(e.hits>1) e.s+=30*(e.hits-1); });   // 多堂課重複出現＝本月核心字
  out.sort((a,b)=>b.s-a.s);
  return mrSpread(out, e=>e.src.id, MR_CAP.vocabPer, Math.min(out.length,MR_CAP.vocab));
}

/* 分散取樣：先讓每堂課最多貢獻 per 個，額滿再回頭補滿名額。
   否則同分時排序會整批落在同一堂課，複習清單就變成「某一課的節錄」而不是整月重點。 */
function mrSpread(sorted, keyOf, per, limit){
  const cnt={}, first=[], rest=[];
  sorted.forEach(e=>{
    const k=keyOf(e); cnt[k]=(cnt[k]||0)+1;
    (cnt[k]<=per?first:rest).push(e);
  });
  return first.concat(rest).slice(0,limit);
}

/* 文法／句型：跨全月依正規化標題去重，取 3–6 個 */
function mrPickGram(ls){
  const seen={}, out=[];
  ls.forEach(b=>{
    const w=mrScore(b);
    (b.grammar||[]).forEach(g=>{
      const k=mrGramKey(g.title); if(!k) return;
      if(seen[k]){ seen[k].hits++; return; }
      const e={g:g, src:b, hits:1, s:(w.st.k==='unread'?60:w.st.k==='started'?40:10)};
      if((g.exs||[]).length) e.s+=10;
      seen[k]=e; out.push(e);
    });
  });
  out.forEach(e=>{ if(e.hits>1) e.s+=40*(e.hits-1); });
  out.sort((a,b)=>b.s-a.s);
  return mrSpread(out, e=>e.src.id, MR_CAP.gramPer, MR_CAP.gram);
}

/* 整份複習內容（純計算，不落地） */
function mrBuild(ym){
  const ls=mrLessons(ym);
  if(!ls.length) return null;
  const scored=ls.map(b=>{ const w=mrScore(b); return {b:b, score:w.score, st:w.st}; })
                 .sort((a,b)=>b.score-a.score||((a.b.date||'')<(b.b.date||'')?-1:1));
  /* 優先補強：只收未閱讀／未完成的課；全部已完成時退回收藏最多的幾課 */
  let focus=scored.filter(x=>x.st.k!=='done').slice(0,MR_CAP.focus);
  if(!focus.length) focus=scored.filter(x=>mrVocabOf(x.b).some(t=>wbOn(t.w))).slice(0,2);
  const focusIds=new Set(focus.map(x=>x.b.id));
  const quick=scored.filter(x=>!focusIds.has(x.b.id)).slice(0,MR_CAP.quick);
  return {
    ym:ym, lessons:ls, scored:scored, focus:focus, quick:quick,
    vocab:mrPickVocab(ls), gram:mrPickGram(ls),
    nUnread:scored.filter(x=>x.st.k==='unread').length,
    nStarted:scored.filter(x=>x.st.k==='started').length
  };
}

/* 每堂補強課只抽 2–3 個核心字，不展開整課單字表 */
function mrCoreWords(b,n){
  return mrVocabOf(b).map(t=>{
    let s=0; if(wbOn(t.w)) s+=100; if(isDue(t.w)) s+=60; if(t.star) s+=50;
    return {t:t,s:s};
  }).sort((a,b)=>b.s-a.s).slice(0,n||3).map(x=>x.t);

/* Active Recall：從本次 MR 已選內容產生 6 題，deterministic */
function mrBuildChallenge(r){
  const qs=[];
  const v=r.vocab, g=r.gram;
  const stableSort=(arr,key)=>arr.slice().sort((a,b)=>(key(a)<key(b)?-1:key(a)>key(b)?1:0));
  const sv=stableSort(v, e=>e.t.w.toLowerCase());
  const sg=stableSort(g, e=>e.g.title.toLowerCase());
  // Q1: 中文→英文 (top priority vocab)
  if(sv.length>=1){ const t=sv[0].t;
    qs.push({type:'cn2en',prompt:t.cn||'',answer:t.w,audio:t.w,
      rule:t.pos?(t.pos+' — '+t.w):t.w}); }
  // Q2: 英文→中文
  if(sv.length>=3){ const t=sv[2].t;
    qs.push({type:'en2cn',prompt:t.w,answer:t.cn||'',audio:t.w,
      rule:t.ex?t.ex:''}); }
  // Q3: 選正確句子 (from grammar)
  if(sg.length>=1){ const ge=sg[0], gx=ge.g;
    const exs=gx.exs||[];
    if(exs.length){ const ex=exs[0];
      const wrong1=ex.en.replace(/\b(is|are|was|were|am)\s+/i,'').replace(/\bing\b/,'ed');
      const wrong2=ex.en.replace(/\bto\s+(\w+)/,(m,v)=>'to '+v+'ing');
      const opts=[ex.en, wrong1!==ex.en?wrong1:(ex.en+' always'), wrong2!==ex.en?wrong2:(ex.en.replace(/\./,'?'))];
      qs.push({type:'pick',prompt:'Which sentence is correct?',opts:opts,correctIdx:0,
        rule:gx.pat||gx.title, hi:ex.hi||''}); }
    else qs.push({type:'recall',prompt:gx.title+'：'+(gx.pat||''),answer:gx.pat||gx.title,rule:gx.title}); }
  // Q4: 填空 (vocab in sentence)
  if(sv.length>=5){ const t=sv[4].t;
    if(t.ex){ const blank=t.ex.replace(new RegExp(t.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),'______');
      if(blank!==t.ex) qs.push({type:'fill',prompt:blank,answer:t.w,audio:t.ex,
        rule:t.cn||''}); } }
  // Q5: 句型回想 (grammar)
  if(sg.length>=2){ const ge=sg[1], gx=ge.g;
    qs.push({type:'recall',prompt:gx.title+'？',answer:gx.pat||gx.title,
      rule:(gx.exs||[])[0]?gx.exs[0].en:'',audio:(gx.exs||[])[0]?gx.exs[0].en:''}); }
  // Q6: 英文→中文 (another vocab)
  if(sv.length>=7){ const t=sv[6].t;
    qs.push({type:'en2cn',prompt:t.w,answer:t.cn||'',audio:t.w,
      rule:t.ex?t.ex:''}); }
  // Fallbacks if < 6
  if(qs.length<6 && sv.length>=2){ const t=sv[1].t;
    qs.push({type:'cn2en',prompt:t.cn||'',answer:t.w,audio:t.w,rule:t.w}); }
  return qs.slice(0,6);
}
function mrChHTML(qs){
  if(mrChIdx>=qs.length) return '<div class="mrch-done">🎉 本月挑戰完成！</div>';
  const q=qs[mrChIdx], n=mrChIdx+1, total=qs.length;
  let h='<div class="mrch-progress">'+ n+' / '+total+'</div>';
  const typeLabel={cn2en:'中文 → 英文',en2cn:'英文 → 中文',pick:'選正確句子',fill:'填空',recall:'句型回想'};
  h+='<div class="mrch-type">'+(typeLabel[q.type]||q.type)+'</div>';
  if(q.type==='pick'){
    h+='<div class="mrch-q">'+esc(q.prompt)+'</div>';
    if(!mrChShow){
      h+='<div class="mrch-opts">'+q.opts.map((o,i)=>
        '<button class="mrch-opt" onclick="mrChPick('+i+','+q.correctIdx+')">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>'
      ).join('')+'</div>';
    } else {
      h+='<div class="mrch-opts">'+q.opts.map((o,i)=>{
        const cls=i===q.correctIdx?'correct':'wrong';
        return '<div class="mrch-opt '+cls+'">'+String.fromCharCode(65+i)+'. '+esc(o)+'</div>';
      }).join('')+'</div>';
      h+='<div class="mrch-ans"><div class="mrch-rule">'+esc(q.rule)+'</div></div>';
    }
  } else if(q.type==='fill'){
    h+='<div class="mrch-q">'+esc(q.prompt)+'</div>';
    if(!mrChShow) h+='<button class="mrch-reveal" onclick="mrChReveal()">顯示答案</button>';
    else h+='<div class="mrch-ans"><b>'+esc(q.answer)+'</b>'+(q.audio?' '+spk(q.audio):'')
      +'<div class="mrch-rule cnx">'+esc(q.rule)+'</div></div>';
  } else if(q.type==='cn2en'){
    h+='<div class="mrch-q">「'+esc(q.prompt)+'」<br>英文怎麼說？</div>';
    if(!mrChShow) h+='<button class="mrch-reveal" onclick="mrChReveal()">顯示答案</button>';
    else h+='<div class="mrch-ans"><b>'+esc(q.answer)+'</b>'+(q.audio?' '+spk(q.audio):'')+'</div>';
  } else if(q.type==='en2cn'){
    h+='<div class="mrch-q">'+esc(q.prompt)+(q.audio?' '+spk(q.audio):'')+'<br>你記得意思嗎？</div>';
    if(!mrChShow) h+='<button class="mrch-reveal" onclick="mrChReveal()">顯示答案</button>';
    else h+='<div class="mrch-ans"><b class="cnx">'+esc(q.answer)+'</b>'
      +(q.rule?'<div class="mrch-rule">'+esc(q.rule)+'</div>':'')+'</div>';
  } else {
    h+='<div class="mrch-q">'+esc(q.prompt)+'</div>';
    if(!mrChShow) h+='<button class="mrch-reveal" onclick="mrChReveal()">顯示答案</button>';
    else h+='<div class="mrch-ans"><b>'+esc(q.answer)+'</b>'
      +(q.rule?'<div class="mrch-rule">'+esc(q.rule)+'</div>':'')+'</div>';
  }
  if(mrChShow) h+='<div class="mrch-nav"><button class="mrch-btn" onclick="mrChNext()">下一題 →</button></div>';
  return h;
}

  if(/xhslink|xiaohongshu|xhscdn/i.test(url+' '+txt)) src='小紅書';
  else if(/youtu\.?be/i.test(url)) src='YouTube';
  else if(/douyin/i.test(url)) src='抖音';
  else if(/tiktok/i.test(url)) src='TikTok';
  else if(/instagram/i.test(url)) src='Instagram';
  else if(/bilibili|b23\.tv/i.test(url)) src='Bilibili';
  const lines=String(txt).split(/[\r\n]+/).map(s=>s.trim()).filter(Boolean)
    .filter(s=>!/^https?:\/\//.test(s))
    .filter(s=>!/复制后|複製後|打开|打開|查看笔记|查看筆記|发布了|發布了/.test(s));
  const title=(lines.find(s=>!/实景学|實景學|地道英语|地道英語/.test(s))||lines[0]||'')
    .replace(/^【/,'').replace(/】$/,'');
  return {title, src, url};
}

/* 解析前先把已填的欄位收進草稿，重繪後不會不見 */
function rwCapture(){
  const g=id=>{const el=document.getElementById(id);return el?el.value:'';};
  rwDraft=Object.assign({},rwDraft||{},{
    paste:g('rwf-paste'), ti:g('rwf-ti'), tiSrc:g('rwf-tisrc'), url:g('rwf-url'), country:g('rwf-country'),
    cat:g('rwf-cat'), level:g('rwf-lv'), min:g('rwf-min'), point:g('rwf-point'),
    vocabTxt:g('rwf-vocab'), quotesTxt:g('rwf-quotes'), ctx:g('rwf-ctx'), usage:g('rwf-usage'), cmpTxt:g('rwf-cmp'), spq:g('rwf-spq')
  });
}
function rwParse(){
  rwCapture();
  const txt=(rwDraft&&rwDraft.paste)||'';
  if(!txt.trim()){ showToast('請先貼上分享內容','貼上影片的分享文字再按解析'); return; }
  const p=rwParseShare(txt);
  rwDraft.tiSrc=p.title; rwDraft.ti=rwS2T(p.title); rwDraft.src=p.src; rwDraft.url=p.url;
  RENDER.real();
  showToast('已解析','標題、來源與連結已帶入，其他欄位請自行補充');
}
function rwSave(){
  rwCapture();
  const d=rwDraft||{};
  const ti=(d.ti||'').trim();
  if(!ti){ showToast('請輸入標題','實景教材需要一個繁體中文標題'); return; }
  const id=rwEditId||('rw'+Date.now().toString(36));
  const prev=(ST.rw||{})[id]||{};
  const vocab=(d.vocabTxt||'').split('\n').map(s=>s.trim()).filter(Boolean).map(line=>{
    const p=line.split(/\s*[|｜]\s*/);
    return {w:p[0]||'', ipa:p[1]||'', pos:p[2]||'', cn:p[3]||'', ex:p[4]||'', exCn:p[5]||''};
  }).filter(v=>v.w);
  const cmp=(d.cmpTxt||'').split('\n').map(s=>s.trim()).filter(Boolean).map(line=>{
    const p=line.split(/\s*[|｜]\s*/); return {w:p[0]||'', d:p[1]||''};
  }).filter(c=>c.w);
  const quotes=(d.quotesTxt||'').split('\n').map(s=>s.trim()).filter(Boolean).map(line=>{
    const p=line.split(/\s*[|｜]\s*/); return {en:p[0]||'', cn:p[1]||''};
  }).filter(q=>q.en);
  ST.rw=ST.rw||{};
  ST.rw[id]={ id, created:prev.created||Date.now(), t:Date.now(),
    videoType:prev.videoType||'external',
    ti, tiSrc:(d.tiSrc||'').trim(),
    src:(d.src!=null&&d.src!==''?d.src:prev.src)||'',   /* sourceType 只留資料層，UI 不顯示 */
    url:(d.url||'').trim(), country:(d.country||'').trim(),
    cat:d.cat||'生活', level:(d.level||'').trim(), min:(d.min||'').trim(),
    point:(d.point||'').trim(), ctx:(d.ctx||'').trim(), usage:(d.usage||'').trim(),
    cmp, quotes, spq:(d.spq||'').trim(), vocab };
  save();
  rwFormOn=false; rwDraft=null; rwEditId=null;
  rwOpen=id; sbAutoCollapse(); RENDER.real(); window.scrollTo(0,0);
  showToast('已儲存','實景教材已更新');
}

           +'<span class="cnx">'+esc(t.cn||'')+'</span></span>').join('')+'</div></div>':'')
       +(g1?'<div class="mrf-sec"><b>核心句型</b>'
         +'<div class="mrf-g">'+esc(g1.title)+(g1.pat?'<div class="mrf-pat">'+esc(g1.pat)+'</div>':'')
         +((g1.exs||[]).length?'<div class="mrf-ex"><span class="sent" data-t="'+esc(g1.exs[0].en)+'" onclick="saySent(this)">'+bkHi(g1.exs[0].en,g1.exs[0].hi)+'</span> '+spk(g1.exs[0].en)
           +'<div class="mrf-excn cnx">'+esc(g1.exs[0].cn||'')+'</div></div>':'')
         +'</div></div>':'')
       +'<button class="mrf-go" onclick="bkGo(\''+b.id+'\')">回原課程複習 →</button>'

  if(r.vocab.length){
    h+='<div class="mr-sec">II. 本月重要單字（'+r.vocab.length+'）</div>'
     +'<div class="bkvd card"><div class="bkvtab" role="list">'
     +r.vocab.map(e=>wordRow(e.t,e.src.titleCn)).join('')

  if(r.gram.length){
    h+='<div class="mr-sec">III. 本月文法與句型（'+r.gram.length+'）</div>';
    h+='<div class="mrgrambox">'+r.gram.map(e=>{

       +'<div class="mrg-src">來自：'+esc(e.src.titleCn)+'</div>'

  /* IV. 快速回顧 */
  if(r.quick.length){

     +'<div class="mrquick">'+r.quick.map(x=>{

      }).join('')+'</div>';
  }

  /* V. 本月挑戰 / Active Recall */
  if(chQs.length){
    h+='<div class="mr-sec">V. 本月挑戰<span style="font-weight:400;font-size:var(--font-meta);color:var(--ink2);margin-left:8px">'+chQs.length+' 題 · 約 7 分鐘</span></div>'
     +'<div class="mrch" id="mrch-area">'+mrChHTML(chQs)+'</div>';
  }
  return h;
}
/* 搜尋：找出關鍵字出現在哪幾課的哪些段落 */
function bkWhere(b,s){
  const has=arr=>arr.some(x=>String(x||'').toLowerCase().indexOf(s)>=0);
  const w=[];
  if(has([b.title,b.titleCn,b.topics,b.date,bkDate(b.date)])) w.push('課程標題');
  if(has((b.hw||[]).flatMap(q=>[q.wrong,q.fix,q.ok,q.cn,q.pat,q.note]))) w.push('作業複習');
  if(has((b.vocab||[]).flatMap(t=>[t.w,t.cn,t.ex,t.exCn]))) w.push('單字表');
  if(has((b.vocab2||[]).flatMap(t=>[t.w,t.cn,t.ex,t.exCn]))) w.push('補充單字');
  if(has((b.vocabReview||[]).flatMap(t=>[t.w,t.cn]))) w.push('前次已學');
  if(has((b.colloc||[]).flatMap(c=>[c.p,c.cn,c.def,c.defCn])
      .concat((b.phrases||[]).flatMap(p=>[p.p,p.cn,p.ex,p.exCn])))) w.push('片語與搭配詞');
  if(has((b.grammar||[]).flatMap(g=>[g.title,g.pat,g.patLabel].concat(g.pts||[],(g.exs||[]).flatMap(e=>[e.en,e.cn]))))) w.push('句型文法');
  (b.reading||[]).forEach(r=>{
    if(has([r.title,r.titleCn]
        .concat((r.paras||[]).flatMap(p=>[p.en,p.cn]))
        .concat((r.questions||[]).flatMap(q=>[q.q,q.qCn,q.a,q.aCn]))
        .concat(r.sumEn||[],r.sumCn||[]))) w.push(r.bar||('閱讀文章：'+r.title));
  });
  if(has((b.cmp||[]).flatMap(c=>[c.u,c.cn,c.sc,c.ex,c.exCn]))) w.push('比較表');
  if(has((b.extra||[]).flatMap(x=>[x.title].concat((x.exs||[]).flatMap(e=>[e.en,e.cn]))))) w.push('補充例句');
  if(has((b.extraVocab||[]).flatMap(x=>[x.k,x.en,x.cn]))) w.push('補充字彙與句型');
  if(has((b.discussion||[]).flatMap(d=>[d.q,d.qCn,d.a,d.aCn]))) w.push('課堂討論');
  if(has((b.summary||[]).flatMap(x=>[x.k,x.v]))) w.push('快速總結');
  return w;
}

/* 課本朗讀（整段／全文共用）：一句一句念、念到哪句反黃到哪句；
   按下去的按鈕變紅色「⏹ 停止」，再按一次或點空白處就停。
   Web Speech 的 onend 在 iOS/Chrome 不一定會觸發，所以每句都有看門狗，時間到就自己往下念。 */
let bkSeq=null;
function bkStop(){
  if(bkSeq&&bkSeq.wd) clearTimeout(bkSeq.wd);
  bkSeq=null;
  if('speechSynthesis' in window) speechSynthesis.cancel();
  document.querySelectorAll('.sent.reading').forEach(x=>x.classList.remove('reading'));
  document.querySelectorAll('.spk.stopbtn').forEach(b=>{ b.classList.remove('stopbtn','on'); if(b.dataset.lbl) b.textContent=b.dataset.lbl; });
}
function bkRun(btn,sents){
  if(bkSeq&&bkSeq.btn===btn){ bkStop(); return; }
  stopReadAll(); bkStop();
  if(!sents.length) return;
  btn.dataset.lbl=btn.textContent; btn.textContent='⏹ 停止朗讀'; btn.classList.add('on','stopbtn');
  bkSeq={i:0,list:sents,btn:btn};
  bkStep();
}
function bkStep(){
  const seq=bkSeq; if(!seq) return;
  document.querySelectorAll('.sent.reading').forEach(x=>x.classList.remove('reading'));
  if(seq.i>=seq.list.length){ bkStop(); return; }
  const el=seq.list[seq.i]; el.classList.add('reading');
  el.scrollIntoView({block:'center',behavior:'smooth'});
  let moved=false;
  const next=()=>{ if(moved||bkSeq!==seq) return; moved=true; if(seq.wd) clearTimeout(seq.wd); seq.i++; bkStep(); };
  const words=String(el.dataset.t||'').split(/\s+/).filter(Boolean).length;
  setTimeout(()=>{
    if(bkSeq!==seq) return;
    say(el.dataset.t,null,next);
    seq.wd=setTimeout(next, Math.max(1800, words*430/(ST.rate||1))+2600);
  },80);
}
function bkReadPara(btn){
  const para=btn.closest('.para'); if(!para) return;
  bkRun(btn,[...para.querySelectorAll('.sent')]);
}
function bkReadAll(btn){
  const card=btn.closest('.card'); if(!card) return;
  bkRun(btn,[...card.querySelectorAll('.sent')]);
}

function togHintBox(btn){

    let sib=el.nextElementSibling;
    while(sib){ if(sib.classList&&sib.classList.contains('hint')){ hint=sib; break; } sib=sib.nextElementSibling; }

  hint.style.display=show?'block':'none';

/* 文法重點的 ✅／❌ 自動上色（到左括號或行尾為止） */
function bkMark(s){
  return esc(s)
    .replace(/❌\s*([^（(]*)/g,'<span class="wrong">❌ $1</span>')
    .replace(/✅\s*([^（(]*)/g,'<span class="right">✅ $1</span>');
}
/* 文法重點條列：英文例句後面的（中文翻譯…）跟著全站中譯開關隱藏／顯示 */
function bkPt(p){
  const m=String(p).match(/^([✅❌⚠️️\s]*)([A-Za-z][\s\S]*?[.!?])\s*([（(][\s\S]*)$/);
  if(m) return bkMark(m[1]+m[2])+' <span class="cnx">'+esc(m[3])+'</span>';
  return bkMark(p);
}
/* 故事插圖說明：「…：A → B → C」改成帶編號的步驟流程膠囊，跟上方圓形圖示一一對映 */
function bkStepCap(cap){
  const m=String(cap||'').match(/^(.*?)[:：]\s*(.*)$/);
  if(m){
    const steps=m[2].split(/\s*(?:→|➔|->|、|,)\s*/).map(x=>x.trim().replace(/[。．.，,]+$/,'')).filter(Boolean);
    if(steps.length>=3){
      return '<figcaption><div style="margin-bottom:6px">'+esc(m[1].trim())+'</div>'
       +'<div class="steps">'+steps.map((s,i)=>'<span class="stp">'+(i+1)+'. '+esc(s)+'</span>'
         +(i<steps.length-1?'<span class="sarr">➔</span>':'')).join('')+'</div></figcaption>';
    }
  }
  return '<figcaption>'+esc(cap)+'</figcaption>';
}
/* 動詞三態（lend – lent – lent）：原形加粗深色、不規則變化形上橘色；
   重音音節（spe-ci-fi-CA-tion 的大寫音節寫法）：紅色加粗底線，直觀看出重音位置 */
function bkForms(html){
  return String(html).split(/(<[^>]+>)/g).map(seg=>{
    if(seg.charAt(0)==='<') return seg;
    /* 先標重音（音節連字號沒有空格），再標三態（分隔號一定前後有空格或用 en dash），
       兩個規則才不會互吃：spe-ci-fi-CA-tion 不是三態，lend – lent – lent 不是音節 */
    return seg
      .replace(/\b((?:[a-z]+-)+)([A-Z]{2,})((?:-[a-z]+)*)/g,
        '$1<span class="stressy">$2</span>$3')
      .replace(/\b([A-Za-z]+)(\s*[–—]\s*|\s+-\s+)([a-z]+)(\s*[–—]\s*|\s+-\s+)([a-z]+)\b/g,
        '<b>$1</b>$2<span class="vform">$3</span>$4<span class="vform">$5</span>');
  }).join('');
}
/* 片語／句型裡的通用變數（something / someone / 人 / 事）改成淺灰膠囊，凸顯固定骨架 */
function bkVars(s){
  return esc(s).replace(/\b(something|someone|somebody|anything|anyone|sth|sb)\b/gi,'<span class="varb">$1</span>')
    .replace(/(人|事情|事|某人|某事)/g,'<span class="varb">$1</span>');
}
/* 填空練習：把「答案：X」裡的答案字，在英文句子中換成可見的空格膠囊（答案仍留在中文欄）。
   只對 cn 以「答案：」開頭的項目生效，其他補充字彙表照舊顯示。 */
function bkFillBlanks(en,cn){
  const m=String(cn).match(/^答案[：:]\s*([^（(]*)/);
  if(!m) return null;
  const tokens=m[1].split('/').map(s=>s.trim()).filter(Boolean).sort((a,b)=>b.length-a.length);
  if(!tokens.length) return null;
  const MARK='B';
  let out=String(en), n=0;
  tokens.forEach(tok=>{
    const e=tok.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const re=new RegExp('(^|[^A-Za-z0-9])('+e+')(?![A-Za-z0-9])','i');
    if(re.test(out)){ out=out.replace(re,'$1'+MARK); n++; }
  });
  if(!n) return null;
  return out.split(MARK).map(esc).join('<span class="bkblank">____</span>');
}

   +'<div class="bar"><span class="magbadge c1">📅 '+bkDate(b.date)+'</span>'

      x+='<div class="bkcn cnx">中文：'+esc(q.cn)+'</div>'

     +'<div class="muted cnx" style="font-weight:var(--fw-emph);margin:6px 0 8px">'+esc(r.titleCn)+'</div>'

  /* 補充例句（0811 型，有才顯示） */
  if((b.extra||[]).length){

  /* 「不說 ×××」的錯誤示範不給發音也不可點唸（不讓學員聽錯誤說法），只標紅 */
  const sumTxt=s=>brSent(mkWrong(s)).split(/(<[^>]+>)/g).map(seg=>{
    if(seg.charAt(0)==='<') return seg;
    return seg.replace(/[A-Za-z][A-Za-z0-9'’\-]*(?:[ ,–\-]+[A-Za-z0-9'’\-]+){1,}[.!?]*/g,
      (m,off,str)=>{
        const before=str.slice(Math.max(0,off-14),off);
        if(/不能說|不說|不能寫成|不可說|別說|[✗✘×]/.test(before)) return '<b class="wrong">'+m+'</b>';
        return '<b class="sent" data-t="'+m+'" onclick="saySent(this)">'+m+'</b>'+spk(m);
      });
  }).join('');
  if((b.summary||[]).length) h+='<div class="bkbar">'+esc(b.summaryTitle||'VI. 快速總結 Quick Summary')+'</div>'
   +'<div class="card" style="padding:10px">'

   + b.summary.map(s=>'<tr><td style="font-weight:700">'+esc(s.k)+'</td><td>'+bkForms(sumTxt(s.v))+'</td></tr>').join('')
   +'</table></div></div>';

  h+='<div class="card" style="text-align:center"><button class="btn" onclick="bkClose()">完成，回列表</button></div>';
  return h;
}

const LESSONS=((window.LISTEN||{}).notes||[])
  .concat((window.LISTEN||{}).scenes||[])
  .concat((window.LISTEN||{}).lessons||[]);

let lsOpen=null, ytPlayer=null, ytQ=[], loopA=null, loopB=null, loopTimer=null, curRate=1;

function ytLoad(cb){
  if(window.YT&&window.YT.Player){cb();return;}
  ytQ.push(cb);
  if(!$('yt-api')){
    const s=document.createElement('script');
    s.id='yt-api'; s.src='https://www.youtube.com/iframe_api';
    s.onerror=()=>{ ytQ.splice(0).forEach(f=>f(true)); };
    document.head.appendChild(s);
  }
}
window.onYouTubeIframeAPIReady=function(){ ytQ.splice(0).forEach(f=>f()); };

function plainIframe(divId,vid){
  const d=$(divId); if(!d) return;
  d.innerHTML='<iframe src="https://www.youtube-nocookie.com/embed/'+vid+'?rel=0&playsinline=1" '
    +'title="YouTube video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture" '
    +'allowfullscreen style="width:100%;height:100%;border:0"></iframe>';
}
function mountPlayer(divId,vid){
  destroyPlayer(); curRate=1;
  ytLoad(failed=>{
    if(failed||!window.YT||!YT.Player){ plainIframe(divId,vid); return; }
    try{
      ytPlayer=new YT.Player(divId,{
        videoId:vid,
        playerVars:{rel:0,modestbranding:1,playsinline:1,cc_load_policy:1},
        events:{onError:()=>plainIframe(divId,vid)}
      });
    }catch(e){ plainIframe(divId,vid); }
  });
}
function destroyPlayer(){
  stopLoop(); stopSync(); loopA=loopB=null;
  if(typeof auStop==='function') auStop();   /* 離開課程時把 TTS 也停掉 */
  if(ytPlayer&&ytPlayer.destroy){ try{ytPlayer.destroy();}catch(e){} }
  ytPlayer=null;
}
function pReady(){ return ytPlayer&&ytPlayer.getCurrentTime; }
function setRateY(r){
  curRate=r;
  if(ytPlayer&&ytPlayer.setPlaybackRate) ytPlayer.setPlaybackRate(r);
  document.querySelectorAll('.rbtn').forEach(b=>b.classList.toggle('on',parseFloat(b.dataset.r)===r));
}
function fmt(t){ t=Math.max(0,Math.floor(t||0)); return Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); }
function markA(){ if(!pReady())return; loopA=ytPlayer.getCurrentTime(); if(loopB!=null&&loopB<=loopA)loopB=null; showLoop(); }
function markB(){ if(!pReady())return; loopB=ytPlayer.getCurrentTime(); if(loopA==null)loopA=0; if(loopB<=loopA)loopB=loopA+2; showLoop(); startLoop(); }
function clearLoop(){ loopA=loopB=null; stopLoop(); showLoop(); }
function startLoop(){
  stopLoop();
  if(loopA==null||loopB==null||!pReady()) return;
  ytPlayer.seekTo(loopA,true);
  if(ytPlayer.playVideo) ytPlayer.playVideo();
  loopTimer=setInterval(()=>{
    if(!pReady()||loopB==null){ stopLoop(); return; }
    if(ytPlayer.getCurrentTime()>=loopB) ytPlayer.seekTo(loopA,true);
  },250);
}
function stopLoop(){ if(loopTimer){clearInterval(loopTimer);loopTimer=null;} }
function showLoop(){
  const el=$('loop-info'); if(!el) return;
  el.textContent = (loopA==null&&loopB==null) ? '尚未設定循環區間'
    : 'A ' + (loopA==null?'—':fmt(loopA)) + ' → B ' + (loopB==null?'—':fmt(loopB)) + (loopTimer?'（循環中）':'');
}
window.setRateY=setRateY; window.markA=markA; window.markB=markB; window.clearLoop=clearLoop; window.startLoop=startLoop;

function playerControls(){
  return '<div class="row" style="margin-top:9px">'
   +'<span class="muted" style="font-size:var(--font-meta);font-weight:700">速度</span>'
   +[0.5,0.75,1].map(r=>'<button class="spk rbtn'+(r===1?' on':'')+'" data-r="'+r+'" onclick="setRateY('+r+')">'+r+'x</button>').join('')
   +'<button class="spk" onclick="markA()">設 A 點</button>'
   +'<button class="spk" onclick="markB()">設 B 點並循環</button>'
   +'<button class="spk" onclick="clearLoop()">取消循環</button>'
   +'</div><div class="muted" id="loop-info" style="margin-top:5px;font-size:var(--font-meta)">尚未設定循環區間</div>';
}
function playerBox(divId){
  return '<div class="ytwrap"><div id="'+divId+'"></div></div>'+playerControls();
}

/* ---------- 純語音課（無影片）：用 TTS 逐句播放／跟讀 ----------
   這些課的素材是本站依課堂筆記單字自製的對話，沒有影片，
   所以「播放器」就是語音合成：整段連播、或念一句停一下讓學習者跟著念。 */
let auLines=[], auIdx=-1, auOn=false, auShadow=false, auRate=1, auTimer=null, auWatch=null, auKeep=null, auSpMap={};
let auSpeakers=[];
function auVoiceList(){
  if(!('speechSynthesis' in window)) return [];
  return speechSynthesis.getVoices().filter(v=>/^en(-|_)/i.test(v.lang))
    .sort((a,b)=>(a.lang>b.lang?1:a.lang<b.lang?-1:0)||a.name.localeCompare(b.name));
}
function auPickedVoice(slot){
  const name=localStorage.getItem('b2_voice_'+slot);
  const vs=auVoiceList();
  return (name&&vs.find(v=>v.name===name))||null;
}
function auApplyVoices(){
  auSpMap={};
  if(auSpeakers.length>=1) auSpMap[auSpeakers[0]]=auPickedVoice('a')||VOICE;
  if(auSpeakers.length>=2) auSpMap[auSpeakers[1]]=auPickedVoice('b')||VOICE2||VOICE;
}
/* 口音一目瞭然：依語音的地區代碼加上對應國旗 */
function auFlag(lang){
  const l=String(lang||'').toLowerCase();
  return l.indexOf('en-us')>=0||l.indexOf('en_us')>=0?'🇺🇸':
         l.indexOf('en-gb')>=0||l.indexOf('en_gb')>=0?'🇬🇧':
         l.indexOf('en-au')>=0||l.indexOf('en_au')>=0?'🇦🇺':
         l.indexOf('en-ca')>=0||l.indexOf('en_ca')>=0?'🇨🇦':
         l.indexOf('en-in')>=0||l.indexOf('en_in')>=0?'🇮🇳':
         l.indexOf('en-ie')>=0||l.indexOf('en_ie')>=0?'🇮🇪':
         l.indexOf('en-nz')>=0||l.indexOf('en_nz')>=0?'🇳🇿':
         l.indexOf('en-za')>=0||l.indexOf('en_za')>=0?'🇿🇦':'🌐';
}
function auFillVoices(){
  const vs=auVoiceList();
  ['a','b'].forEach((slot,i)=>{
    const sel=$('au-v'+slot); if(!sel) return;
    const cur=(auSpMap[auSpeakers[i]]||{}).name||'';
    sel.innerHTML=vs.map(v=>'<option value="'+esc(v.name)+'"'+(v.name===cur?' selected':'')+'>'+auFlag(v.lang)+' '+esc(v.name.replace(/^Microsoft |^Google /,''))+(/en[-_]us/i.test(v.lang)?'':' ('+esc(v.lang)+')')+'</option>').join('');
    if(!vs.length) sel.innerHTML='<option>（此裝置沒有英文語音）</option>';
  });
  const wrap=$('au-vrow'); if(wrap&&auSpeakers.length<2) wrap.style.display='none';
  ['a','b'].forEach((slot,i)=>{ const lb=$('au-vl'+slot); if(lb&&auSpeakers[i]) lb.textContent=auSpeakers[i]; });
}
function auSetVoice(slot,name){
  localStorage.setItem('b2_voice_'+slot,name);
  auApplyVoices(); auTestVoice(slot);
}
function auTestVoice(slot){
  const i=slot==='a'?0:1;
  const v=auSpMap[auSpeakers[i]]||VOICE;
  const line=auLines.find(l=>l.sp===auSpeakers[i]);
  if('speechSynthesis' in window) speechSynthesis.cancel();
  say(line?line.en:'Hi, this is my voice. Nice to meet you.', auRate, null, v);
}
window.auSetVoice=auSetVoice; window.auTestVoice=auTestVoice;

   錄音只存在記憶體（換一課就清掉），不會上傳任何地方。 */

function recPaint(){
  document.querySelectorAll('.recb').forEach(b=>{
    const i=+b.id.slice(4);
    b.classList.toggle('recording',recIdx===i);
    b.textContent=recIdx===i?'⏹':'🎙️';
  });
  Object.keys(recUrls).forEach(i=>{ const p=$('recp-'+i); if(p) p.style.display=''; });
}
async function recTog(i,ev){
  if(ev) ev.stopPropagation();
  if(recIdx===i){ try{recMedia.stop();}catch(e){} return; }   // 再按一次＝停止並存檔
  recFinish();
  if(!navigator.mediaDevices||!window.MediaRecorder){ alert('這個瀏覽器不支援錄音功能。'); return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    if('speechSynthesis' in window) speechSynthesis.cancel();   // 錄音時先安靜
    recChunks=[]; recIdx=i;
    recMedia=new MediaRecorder(stream);
    recMedia.ondataavailable=e=>{ if(e.data&&e.data.size) recChunks.push(e.data); };
    recMedia.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop());
      const at=recIdx; recIdx=null;
      if(recChunks.length){
        if(recUrls[at]) URL.revokeObjectURL(recUrls[at]);
        recUrls[at]=URL.createObjectURL(new Blob(recChunks,{type:recMedia.mimeType||'audio/webm'}));
      }
      recPaint();
    };
    recMedia.start(); recPaint();
  }catch(e){ recIdx=null; alert('無法使用麥克風（請允許麥克風權限）：'+e.message); }
}
function recPlay(i,ev){
  if(ev) ev.stopPropagation();
  if(!recUrls[i]) return;
  if('speechSynthesis' in window) speechSynthesis.cancel();
  if(recAudio){ try{recAudio.pause();}catch(e){} }
  recAudio=new Audio(recUrls[i]); recAudio.play();
}
function recFinish(){ if(recIdx!=null&&recMedia){ try{recMedia.stop();}catch(e){} } }
function recReset(){
  recFinish();
  Object.values(recUrls).forEach(u=>{ try{URL.revokeObjectURL(u);}catch(e){} });
  recUrls={};
}

function auSet(lines){

function auClearHi(){ document.querySelectorAll('#sublist .sline').forEach(el=>el.classList.remove('cur')); }
function auHi(i){
  auClearHi();
  const el=$('sl-'+i);
  if(el){ el.classList.add('cur'); el.scrollIntoView({block:'center',behavior:'smooth'}); }
  const total=auLines.length||1;
  const pt=$('au-prog-txt'); if(pt) pt.textContent='句 '+(i+1)+' / '+total;
  const pf=$('au-prog-fill'); if(pf) pf.style.width=Math.round((i+1)*100/total)+'%';
}
function auBtns(){
  const p=$('au-play'), s=$('au-shadow');
  if(p){ p.textContent = (auOn&&!auShadow) ? '⏸' : '▶'; p.classList.toggle('playing',auOn&&!auShadow); p.classList.toggle('shadowing',auOn&&auShadow); }
  const mp=$('au-mode-play'); if(mp) mp.classList.toggle('on',!auShadow||(!auOn));
  if(s){ s.classList.toggle('on',auOn&&auShadow); }
}
function auStop(){
  auOn=false; auShadow=false; auIdx=-1;
  if(auTimer){ clearTimeout(auTimer); auTimer=null; }
  if(auWatch){ clearTimeout(auWatch); auWatch=null; }
  if(auKeep){ clearInterval(auKeep); auKeep=null; }
  if('speechSynthesis' in window) speechSynthesis.cancel();
  auClearHi(); auBtns();
  const total=auLines.length||1;
  const pt=$('au-prog-txt'); if(pt) pt.textContent='句 0 / '+total;
  const pf=$('au-prog-fill'); if(pf) pf.style.width='0';
}
function auNext(){
  if(!auOn) return;
  auIdx++;
  if(auIdx>=auLines.length){ auStop(); return; }
  auHi(auIdx);
  const txt=String(auLines[auIdx].en||'');
  const words=txt.split(/\s+/).filter(Boolean).length;
  let moved=false;
  const step=()=>{
    if(moved||!auOn) return;
    moved=true;
    if(auWatch){ clearTimeout(auWatch); auWatch=null; }
    /* 跟讀模式：留一段和原句長度差不多的空白，讓學習者跟著念完再接下一句 */
    const gap = auShadow ? Math.max(1400, words*400/auRate) : 400;
    auTimer=setTimeout(auNext, gap);
  };
  const spVoice=auSpMap[auLines[auIdx].sp]||null;
  say(txt, auRate, step, spVoice);
  /* 看門狗：Web Speech 的 onend 並不可靠——語音還沒載入、句子太長、
     或 Chrome 已知的長時間朗讀中斷，都可能永遠不觸發，整段就會卡在同一句。
     用「字數推估的時長」當上限，時間到了沒收到 onend 就自己往下走。 */
  auWatch=setTimeout(step, Math.max(1800, words*430/auRate) + 2600);
}
function auPlay(shadow){
  const wasOn=auOn, wasShadow=auShadow;
  auStop();
  if(wasOn && wasShadow===!!shadow) return;   /* 同一顆再按一次＝停止 */
  auOn=true; auShadow=!!shadow; auIdx=-1;
  /* Chrome 連續朗讀超過約 15 秒會自己停住，定期 resume 一下把它推回去 */
  if('speechSynthesis' in window){
    auKeep=setInterval(()=>{
      if(!auOn){ clearInterval(auKeep); auKeep=null; return; }
      if(speechSynthesis.speaking && !speechSynthesis.paused) speechSynthesis.resume();
    },8000);
  }
  auBtns(); auNext();
}
function auFrom(i){ auStop(); auOn=true; auShadow=false; auIdx=i-1; auBtns(); auNext(); }
function auSetRate(r){
  auRate=r;
  document.querySelectorAll('.rbtn').forEach(b=>b.classList.toggle('on',parseFloat(b.dataset.r)===r));
}

  if(!lsOpen) return;
  const err=$('lsub-err');
  const fail=m=>{ if(err){err.textContent=m;err.style.display='block';} };
  const lines=parseSubs(($('lsub-txt')||{}).value);
  if(!lines.length) return fail('請至少貼一行，格式：00:07 英文句子 | 中文翻譯（時間與中文可省略）。');

/* 逐字稿解析：一行一句，格式「00:07 English sentence | 中文翻譯」
   時間與中文都可以省略；沒寫時間的行會接在上一行後三秒 */
function parseSubs(text){
  const out=[];
  String(text||'').split(/\r?\n/).forEach(line=>{
    let l=line.trim(); if(!l) return;
    l=l.replace(/^\[|\]$/g,'');
    let t=null;
    const m=l.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?[\s\]]*[-–]?\s*/);
    if(m){ t = m[3] ? (+m[1]*3600 + +m[2]*60 + +m[3]) : (+m[1]*60 + +m[2]); l=l.slice(m[0].length); }
    const parts=l.split(/\s*[|｜]\s*/);
    const en=(parts[0]||'').trim(); if(!en) return;
    if(t==null) t = out.length ? out[out.length-1].t+3 : 0;
    out.push({t:t, en:en, cn:(parts[1]||'').trim()});
  });
  return out;
}

/* ---------- 全站滑動手勢（手機／平板）----------
   右滑＝回列表（等於按返回箭頭）
   左滑＝下一項（下一篇文章 / 下一個文法單元 / 下一課聽力 / 下一張單字卡翻開→評分）
   在列表頁、首頁、正在打字或操作影片時不觸發。 */
let swX=null,swY=null;
document.addEventListener('touchstart',e=>{
  swX=null;
  if(e.touches.length!==1) return;
  if(e.target.closest('textarea,input,.ytwrap,select')) return;
  /* 必須在某個詳細頁或卡片模式裡才能滑 */
  const inDetail = rdOpen || CURG || lsOpen || myVid || bkOpen || vQueue.length;
  if(!inDetail) return;
  swX=e.touches[0].clientX; swY=e.touches[0].clientY;
},{passive:true});
document.addEventListener('touchend',e=>{
  if(swX==null) return;
  const t=e.changedTouches[0];
  const dx=t.clientX-swX, dy=t.clientY-swY; swX=null;
  if(Math.abs(dx)<70 || Math.abs(dy)>60 || Math.abs(dx)<Math.abs(dy)*1.5) return;
  if(dx>0) swipeBack();    // 右滑＝返回
  else     swipeNext();    // 左滑＝下一項
},{passive:true});

function swipeBack(){
  if(TAB==='read'   && rdOpen)  { rdClose(); return; }
  if(TAB==='book'   && bkOpen)  { bkClose(); return; }
  if(TAB==='gram'   && CURG)    { gClose();  return; }
  if(TAB==='listen' && myVid)   { closeMyVid(); return; }
  if(TAB==='listen' && lsOpen)  { lsClose(); return; }
  if(TAB==='vocab'  && vQueue.length) { vQuit(); return; }
}

function swipeNext(){
  /* 文章 → 下一篇 */
  if(TAB==='read' && rdOpen){
    const list=ALL_ARTS.filter(a=>inBand(a.level));
    if(!list.length) return;
    const i=list.findIndex(a=>a.id===rdOpen.id);
    rdOpenArt(list[(i+1)%list.length].id);
    window.scrollTo(0,0);
    return;
  }
  /* 課本 → 下一課 */
  if(TAB==='book' && bkOpen){
    if(BOOK_LESSONS.length<2) return;
    const i=BOOK_LESSONS.findIndex(x=>x.id===bkOpen.id);
    bkGo(BOOK_LESSONS[(i+1)%BOOK_LESSONS.length].id);
    return;
  }
  /* 文法 → 下一個單元 */
  if(TAB==='gram' && CURG){
    const i=ALL_GRAM.findIndex(g=>g.id===CURG.id);
    if(i<0) return;
    gOpen(ALL_GRAM[(i+1)%ALL_GRAM.length].id);
    return;
  }
  /* 單字卡 → 翻開（還沒翻時）或跳過（已翻時直接下一張，等於按「記得」） */
  if(TAB==='vocab' && vQueue.length){
    if(!vFlip){ vDoFlip(); }
    else { vGrade(3); }
    return;
  }
  /* 聽力 → 下一課 */
  if(TAB==='listen'){
    if(myVid){
      if(!MYVIDS.length) return;
      const i=MYVIDS.findIndex(x=>x.id===myVid);
      openMyVid(MYVIDS[(i+1)%MYVIDS.length].id);
    }else if(lsOpen){
      const list=LESSONS.filter(l=>inBand(l.level));
      if(!list.length) return;
      const i=list.findIndex(l=>l.id===lsOpen.id);
      lsGo(list[(i+1)%list.length].id);
    }
  }
}
