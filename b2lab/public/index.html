/* ---------- 純語音課（無影片）：用 TTS 逐句播放／跟讀 ----------
   這些課的素材是本站依課堂筆記單字自製的對話，沒有影片，
   所以「播放器」就是語音合成：整段連播、或念一句停一下讓學習者跟著念。 */
let auLines=[], auIdx=-1, auOn=false, auShadow=false, auRate=1, auTimer=null, auWatch=null, auKeep=null, auSpMap={};
function auSet(lines){
  auStop(); auLines=lines||[];
  const speakers=[...new Set(auLines.map(l=>l.sp).filter(Boolean))];
  auSpMap={};
  if(speakers.length>=2){ auSpMap[speakers[0]]=VOICE; auSpMap[speakers[1]]=VOICE2||VOICE; }
}
function auClearHi(){ document.querySelectorAll('#sublist .sline').forEach(el=>el.classList.remove('cur')); }
function auHi(i){
  auClearHi();
  const el=$('sl-'+i);
  if(el){ el.classList.add('cur'); el.scrollIntoView({block:'center',behavior:'smooth'}); }
}
function auBtns(){
  const p=$('au-play'), s=$('au-shadow');
  if(p){ p.textContent = (auOn&&!auShadow) ? '⏸ 停止播放' : '▶️ 播放全部'; p.classList.toggle('playing',auOn&&!auShadow); }
  if(s){ s.textContent = (auOn&&auShadow)  ? '⏸ 停止跟讀' : '🔁 逐句跟讀'; s.classList.toggle('shadowing',auOn&&auShadow); }
}
function auStop(){
  auOn=false; auShadow=false; auIdx=-1;
  if(auTimer){ clearTimeout(auTimer); auTimer=null; }
  if(auWatch){ clearTimeout(auWatch); auWatch=null; }
  if(auKeep){ clearInterval(auKeep); auKeep=null; }
  if('speechSynthesis' in window) speechSynthesis.cancel();
  auClearHi(); auBtns();
}
function auNext(){
  if(!auOn) return;
  auIdx++;
  if(auIdx>=auLines.length){ auStop(); return; }
  auHi(auIdx);
  const txt=String(auLines[auIdx].en||'');
  const words=txt.split(/\s+/).filter(Boolean).length;
  let moved=false;
  const step=()=>{
    if(moved||!auOn) return;
    moved=true;
    if(auWatch){ clearTimeout(auWatch); auWatch=null; }
    /* 跟讀模式：留一段和原句長度差不多的空白，讓學習者跟著念完再接下一句 */
    const gap = auShadow ? Math.max(1400, words*400/auRate) : 400;
    auTimer=setTimeout(auNext, gap);
  };
  const spVoice=auSpMap[auLines[auIdx].sp]||null;
  say(txt, auRate, step, spVoice);
  /* 看門狗：Web Speech 的 onend 並不可靠——語音還沒載入、句子太長、
     或 Chrome 已知的長時間朗讀中斷，都可能永遠不觸發，整段就會卡在同一句。
     用「字數推估的時長」當上限，時間到了沒收到 onend 就自己往下走。 */
  auWatch=setTimeout(step, Math.max(1800, words*430/auRate) + 2600);
}
function auPlay(shadow){
  const wasOn=auOn, wasShadow=auShadow;
  auStop();
  if(wasOn && wasShadow===!!shadow) return;   /* 同一顆再按一次＝停止 */
  auOn=true; auShadow=!!shadow; auIdx=-1;
  /* Chrome 連續朗讀超過約 15 秒會自己停住，定期 resume 一下把它推回去 */
  if('speechSynthesis' in window){
    auKeep=setInterval(()=>{
      if(!auOn){ clearInterval(auKeep); auKeep=null; return; }
      if(speechSynthesis.speaking && !speechSynthesis.paused) speechSynthesis.resume();
    },8000);
  }
  auBtns(); auNext();
}
function auFrom(i){ auStop(); auOn=true; auShadow=false; auIdx=i-1; auBtns(); auNext(); }
function auSetRate(r){
  auRate=r;
  document.querySelectorAll('.rbtn').forEach(b=>b.classList.toggle('on',parseFloat(b.dataset.r)===r));
}
window.auPlay=auPlay; window.auStop=auStop; window.auFrom=auFrom; window.auSetRate=auSetRate;

   +'<button class="spk" onclick="auStop()">⏹ 停止</button>'

let myVid=null;
function ytId(s){
  s=String(s||'').trim();
  if(/^[\w-]{11}$/.test(s)) return s;
  const m=s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
  return m?m[1]:null;
}
/* ---------- 內建聽力課的補充逐字稿（學習者自己貼的；存 Firestore b2lab_lesson_subs，兩人共用） ---------- */
let LSUBS={}, lsubUnsub=null;
try{ LSUBS=JSON.parse(localStorage.getItem('b2lab_lsubs')||'{}')||{}; }catch(e){ LSUBS={}; }
function lsubCol(){ return db ? db.collection('b2lab_lesson_subs') : null; }
function lsubSubscribe(){
  const c=lsubCol(); if(!c||lsubUnsub) return;
  lsubUnsub=c.onSnapshot(snap=>{
    snap.docs.forEach(d=>{ const x=d.data(); if(x&&(x.lines||[]).length) LSUBS[d.id]=x.lines; });
    try{ localStorage.setItem('b2lab_lsubs',JSON.stringify(LSUBS)); }catch(e){}
    if(TAB==='listen'&&lsOpen) RENDER.listen();
  },()=>{});
}
function lessonSubs(l){ const x=l&&LSUBS[l.id]; return (x&&x.length)?x:null; }
function saveLessonSubs(){
  if(!lsOpen) return;
  const err=$('lsub-err');
  const fail=m=>{ if(err){err.textContent=m;err.style.display='block';} };
  const lines=parseSubs(($('lsub-txt')||{}).value);
  if(!lines.length) return fail('請至少貼一行，格式：00:07 英文句子 | 中文翻譯（時間與中文可省略）。');
  if(err) err.style.display='none';
  LSUBS[lsOpen.id]=lines;
  try{ localStorage.setItem('b2lab_lsubs',JSON.stringify(LSUBS)); }catch(e){}
  const c=lsubCol();
  if(c) c.doc(lsOpen.id).set({lines:lines,addedBy:PROFILE,updatedAt:Date.now()},{merge:true}).catch(()=>{});
  RENDER.listen();
}
window.saveLessonSubs=saveLessonSubs;

/* 逐字稿解析：一行一句，格式「00:07 English sentence | 中文翻譯」
   時間與中文都可以省略；沒寫時間的行會接在上一行後三秒 */
function parseSubs(text){
  const out=[];
  String(text||'').split(/\r?\n/).forEach(line=>{
    let l=line.trim(); if(!l) return;
    l=l.replace(/^\[|\]$/g,'');
    let t=null;
    const m=l.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?[\s\]]*[-–]?\s*/);
    if(m){ t = m[3] ? (+m[1]*3600 + +m[2]*60 + +m[3]) : (+m[1]*60 + +m[2]); l=l.slice(m[0].length); }
    const parts=l.split(/\s*[|｜]\s*/);
    const en=(parts[0]||'').trim(); if(!en) return;
    if(t==null) t = out.length ? out[out.length-1].t+3 : 0;
    out.push({t:t, en:en, cn:(parts[1]||'').trim()});
  });
  return out;
}

function addMyVid(){
  const err=$('myvid-err');
  const fail=m=>{ if(err){err.textContent=m;err.style.display='block';} };
  const id=ytId(($('myurl')||{}).value);
  if(!id) return fail('看不出這是 YouTube 連結，請貼完整網址（含 watch?v=…）。');
  const lines=parseSubs(($('mysubs')||{}).value);
  if(!lines.length) return fail('請至少貼一行逐字稿。');
  if(err) err.style.display='none';
  const v={id:id, title:(($('mytitle')||{}).value||'').trim()||'我的影片',
           lines:lines, addedAt:today(), addedBy:PROFILE, updatedAt:Date.now()};
  vidPut(v).then(()=>{
    const i=MYVIDS.findIndex(x=>x.id===id);
    if(i>=0) MYVIDS[i]=v; else MYVIDS.unshift(v);
    openMyVid(id);
  });
}

function curLines(){
  if(myVid){ const v=curVidObj(); return v?(v.lines||[]):null; }
  if(lsOpen) return lessonSubs(lsOpen);
  return null;
}
function seekLine(i){
  const L=curLines(); if(!L||!L[i]) return;
  if(pReady()){ ytPlayer.seekTo(L[i].t,true); if(ytPlayer.playVideo) ytPlayer.playVideo(); }
  setCurLine(i,false);
}
window.seekLine=seekLine;
function setCurLine(i,scroll){
  if(i===curLine) return;
  const prev=$('sl-'+curLine); if(prev) prev.classList.remove('cur');
  curLine=i;
  const el=$('sl-'+i); if(!el) return;
  el.classList.add('cur');
  if(scroll!==false) el.scrollIntoView({block:'center',behavior:'smooth'});
}
function jumpCur(){ const el=$('sl-'+curLine); if(el) el.scrollIntoView({block:'center',behavior:'smooth'}); }
window.jumpCur=jumpCur;
function startSync(){
  stopSync();
  syncTimer=setInterval(()=>{
    const L=curLines();
    if(!L||!pReady()){ return; }
    const t=ytPlayer.getCurrentTime();
    let idx=-1;
    for(let k=0;k<L.length;k++){ if(L[k].t<=t+0.25) idx=k; else break; }
    if(idx>=0) setCurLine(idx,true);
  },400);
}
function stopSync(){ if(syncTimer){clearInterval(syncTimer);syncTimer=null;} }

/* ---------- 全站滑動手勢（手機／平板）----------
   右滑＝回列表（等於按返回箭頭）
   左滑＝下一項（下一篇文章 / 下一個文法單元 / 下一課聽力 / 下一張單字卡翻開→評分）
   在列表頁、首頁、正在打字或操作影片時不觸發。 */
let swX=null,swY=null;
document.addEventListener('touchstart',e=>{
  swX=null;
  if(e.touches.length!==1) return;
  if(e.target.closest('textarea,input,.ytwrap,select')) return;
  /* 必須在某個詳細頁或卡片模式裡才能滑 */
  const inDetail = rdOpen || CURG || lsOpen || myVid || bkOpen || vQueue.length;
  if(!inDetail) return;
  swX=e.touches[0].clientX; swY=e.touches[0].clientY;
},{passive:true});
document.addEventListener('touchend',e=>{
  if(swX==null) return;
  const t=e.changedTouches[0];
  const dx=t.clientX-swX, dy=t.clientY-swY; swX=null;
  if(Math.abs(dx)<70 || Math.abs(dy)>60 || Math.abs(dx)<Math.abs(dy)*1.5) return;
  if(dx>0) swipeBack();    // 右滑＝返回
  else     swipeNext();    // 左滑＝下一項
},{passive:true});

function swipeBack(){
  if(TAB==='read'   && rdOpen)  { rdClose(); return; }
  if(TAB==='book'   && bkOpen)  { bkClose(); return; }
  if(TAB==='gram'   && CURG)    { gClose();  return; }
  if(TAB==='listen' && myVid)   { closeMyVid(); return; }
  if(TAB==='listen' && lsOpen)  { lsClose(); return; }
  if(TAB==='vocab'  && vQueue.length) { vQuit(); return; }
}

function swipeNext(){
  /* 文章 → 下一篇 */
  if(TAB==='read' && rdOpen){
    const list=ALL_ARTS.filter(a=>inBand(a.level));
    if(!list.length) return;
    const i=list.findIndex(a=>a.id===rdOpen.id);
    rdOpenArt(list[(i+1)%list.length].id);
    window.scrollTo(0,0);
    return;
  }
  /* 課本 → 下一課 */
  if(TAB==='book' && bkOpen){
    if(BOOK_LESSONS.length<2) return;
    const i=BOOK_LESSONS.findIndex(x=>x.id===bkOpen.id);
    bkGo(BOOK_LESSONS[(i+1)%BOOK_LESSONS.length].id);
    return;
  }
  /* 文法 → 下一個單元 */
  if(TAB==='gram' && CURG){
    const i=ALL_GRAM.findIndex(g=>g.id===CURG.id);
    if(i<0) return;
    gOpen(ALL_GRAM[(i+1)%ALL_GRAM.length].id);
    return;
  }
  /* 單字卡 → 翻開（還沒翻時）或跳過（已翻時直接下一張，等於按「記得」） */
  if(TAB==='vocab' && vQueue.length){
    if(!vFlip){ vDoFlip(); }
    else { vGrade(3); }
    return;
  }
  /* 聽力 → 下一課 */
  if(TAB==='listen'){
    if(myVid){
      if(!MYVIDS.length) return;
      const i=MYVIDS.findIndex(x=>x.id===myVid);
      openMyVid(MYVIDS[(i+1)%MYVIDS.length].id);
    }else if(lsOpen){
      const list=LESSONS.filter(l=>inBand(l.level));
      if(!list.length) return;
      const i=list.findIndex(l=>l.id===lsOpen.id);
      lsGo(list[(i+1)%list.length].id);
    }
  }
}
