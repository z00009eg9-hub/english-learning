<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta name="theme-color" content="#e8813a">
<title>B2 Read — 閱讀 · 單字 · 文法</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="B2 Read">
<meta name="description" content="閱讀、單字間隔複習與文法教材，從 B1 推進到 B2。每日自動更新一篇文章與一個文法單元。">
<style>
:root{
  --bg:#faf7f3; --card:#ffffff; --ink:#26211c; --ink2:#6b6259; --line:#e8e0d6;
  --accent:#e8813a; --accent2:#c9631f; --accent-soft:#fdf0e5;
  --a2:#d98324; --b1:#3f9e64; --b1p:#3b82c4; --b2:#8b5cf6;
  --ok:#2f9e5f; --bad:#d9534f;
  --shadow:0 2px 10px rgba(60,45,30,.07);
  --r:14px;
  --fs:1.15;   /* 全站字級倍率，可在「進度 → 設定」調整 */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.75; font-size:calc(16px * var(--fs));
  padding-bottom:62px;
}
/* ---------- 安裝成 App ---------- */
.install{
  background:linear-gradient(135deg,#3b82c4,#2b5f92);color:#fff;border:0;border-radius:14px;
  padding:14px 16px;margin-bottom:14px;box-shadow:0 3px 12px rgba(40,80,130,.28);width:100%;
  text-align:left;font:inherit;cursor:pointer;display:block
}
.install b{font-size:calc(16px * var(--fs));font-weight:800;display:block}
.install span{font-size:calc(13px * var(--fs));opacity:.95;display:block;margin-top:4px}
.xlink{
  display:block;text-decoration:none;background:linear-gradient(135deg,#159AA6,#0E6E78);color:#fff;
  border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:0 3px 12px rgba(20,120,130,.26)
}
.xlink b{font-size:calc(16px * var(--fs));font-weight:800;display:block}
.xlink span{font-size:calc(13px * var(--fs));opacity:.95;display:block;margin-top:4px}
/* ---------- 兩站搭配 ---------- */
.pair{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:720px){ .pair{grid-template-columns:1fr 1fr} }
.pairbox{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.pairbox .ph{color:#fff;font-weight:800;font-size:calc(15px * var(--fs));padding:8px 12px}
.pairbox ul{margin:9px 0 10px;padding-left:22px;flex:1}
.pairbox li{font-size:calc(14px * var(--fs));line-height:1.75;margin-bottom:3px}
.pairbox .xlink{margin:0 10px 10px}
a{color:var(--accent2)}
/* ---------- header（刻意不套用 --fs，保持精簡，把空間留給內容） ---------- */
header{
  background:linear-gradient(135deg,#f0964f,#d9691f); color:#fff;
  padding:8px 12px; position:sticky; top:0; z-index:50;
  box-shadow:0 2px 10px rgba(160,90,30,.22);
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
}
header .brand{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-right:auto;
  background:none;border:0;color:#fff;font:inherit;cursor:pointer;padding:2px 0;text-align:left
}
header .brand h1{margin:0;font-size:16.5px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
header .brand:active{opacity:.75}
header .lv{font-size:9.5px;padding:1.5px 5px;border-radius:5px}
header .prof{display:flex;background:rgba(255,255,255,.18);border-radius:20px;padding:2px;border:1px solid rgba(255,255,255,.3)}
header .prof button{
  border:0;background:none;color:rgba(255,255,255,.85);font:inherit;font-size:11.5px;padding:3px 9px;
  border-radius:18px;cursor:pointer;white-space:nowrap
}
header .prof button.on{background:#fff;color:var(--accent2);font-weight:700}
header #sync-badge{font-size:14px;line-height:1;opacity:.9;display:none}
header .hdlink{
  font-size:11.5px;font-weight:800;text-decoration:none;color:#fff;white-space:nowrap;
  background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.45);
  border-radius:20px;padding:4px 10px
}
header .hdlink:active{background:rgba(255,255,255,.34)}
/* ---------- tabs（同樣固定尺寸） ---------- */
nav{
  position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
  display:flex;z-index:60;padding-bottom:env(safe-area-inset-bottom)
}
nav button{
  flex:1;border:0;background:none;padding:5px 2px 4px;font:inherit;font-size:10px;color:var(--ink2);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.35
}
nav button i{font-style:normal;font-size:18px;line-height:1}
nav button.on{color:var(--accent2);font-weight:700}
/* 今日分頁的小日曆圖示：顯示「今天」實際日期，而不是 📅 emoji 內建的固定日期 */
.dayico{display:inline-flex;flex-direction:column;align-items:center;justify-content:flex-start;
  width:19px;height:19px;border:1.5px solid currentColor;border-radius:4px;overflow:hidden;font-style:normal}
.dayico .m{display:block;width:100%;background:currentColor;color:#fff;font-size:6px;font-weight:800;
  line-height:6px;padding:1px 0;letter-spacing:.5px;text-align:center}
.dayico .d{display:block;font-size:11px;font-weight:800;line-height:12px;text-align:center}
/* ---------- layout ---------- */
main{max-width:860px;margin:0 auto;padding:16px 14px 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
h2.sec{font-size:calc(16px * var(--fs));margin:0 0 10px;display:flex;align-items:center;gap:7px}
.muted{color:var(--ink2);font-size:calc(13px * var(--fs))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chip{
  border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 13px;font-size:calc(13px * var(--fs));
  cursor:pointer;color:var(--ink2);font-family:inherit
}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn{
  border:0;border-radius:10px;background:var(--accent);color:#fff;padding:10px 16px;font:inherit;
  font-size:calc(14px * var(--fs));font-weight:600;cursor:pointer
}
.btn.ghost{background:#fff;color:var(--accent2);border:1.5px solid var(--accent)}
.btn.gray{background:#efeae3;color:var(--ink2)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:default}
.lv{font-size:calc(10.5px * var(--fs));font-weight:800;padding:2px 7px;border-radius:6px;color:#fff;letter-spacing:.4px;white-space:nowrap}
.lv.A2{background:var(--a2)} .lv.B1{background:var(--b1)} .lv.B1P{background:var(--b1p)} .lv.B2{background:var(--b2)}
.spk{
  border:1px solid var(--line);background:#fff;border-radius:8px;cursor:pointer;
  font-size:calc(14px * var(--fs));padding:3px 8px;color:var(--accent2);line-height:1.4
}
.spk:active{background:var(--accent-soft)}
/* ---------- article / unit list ---------- */
.item{
  background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:12px;
  padding:12px 14px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow);
  position:relative;overflow:hidden
}
.item:active{background:var(--accent-soft)}
/* 右上角紅色 NEW 緞帶（今日新內容用） */
.item.new::after{
  content:"NEW";position:absolute;top:13px;right:-32px;width:118px;
  transform:rotate(45deg);text-align:center;letter-spacing:1.5px;
  background:linear-gradient(135deg,#f2494a,#d21f1f);color:#fff;
  font-size:calc(10.5px * var(--fs));font-weight:800;line-height:1.7;
  box-shadow:0 2px 6px rgba(190,25,25,.35)
}
.item.new .t{padding-right:34px}
.item .t{font-weight:700;font-size:calc(15.5px * var(--fs));margin-bottom:2px}
.item .tc{font-size:calc(13px * var(--fs));color:var(--ink2)}
.item .meta{font-size:calc(11.5px * var(--fs));color:var(--ink2);margin-top:7px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.item .done{color:var(--ok);font-weight:700}
/* ---------- reading view ---------- */
.para{margin:0 0 16px}
.para .en{font-size:calc(17px * var(--fs));line-height:1.95}
/* 逐句朗讀：每句後面的小喇叭 */
.para .sent{border-radius:6px;padding:1px 0}
.para .sent.reading{background:#fff2d9;box-shadow:0 0 0 3px #fff2d9}
.para .ssp{border:0;background:none;cursor:pointer;font-size:.72em;padding:0 2px;margin:0 4px 0 1px;
  vertical-align:middle;opacity:.4;line-height:1}
.para .ssp:hover,.para .ssp:active{opacity:1}
.para .cn{font-size:calc(14px * var(--fs));color:var(--ink2);background:var(--accent-soft);border-radius:9px;padding:8px 11px;margin-top:7px;display:none}
.para.showcn .cn{display:block}
.para .pbar{margin-top:5px;display:flex;gap:6px}
w{cursor:pointer;border-radius:3px}
w.hi{background:#fff2d9;box-shadow:inset 0 -2px 0 #f0b04e;font-weight:600}
w:active{background:#ffe0b8}
.gloss{
  position:fixed;left:10px;right:10px;bottom:78px;background:#fff;border:1px solid var(--line);
  border-radius:14px;box-shadow:0 8px 28px rgba(60,40,20,.22);padding:14px 15px;z-index:70;max-width:520px;
  margin:0 auto;display:none
}
.gloss.on{display:block}
.gloss .gw{font-size:calc(20px * var(--fs));font-weight:800;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.gloss .gi{font-size:calc(12.5px * var(--fs));color:var(--ink2);font-family:ui-monospace,monospace}
.gloss .gc{font-size:calc(16px * var(--fs));color:var(--accent2);font-weight:700;margin-top:3px}
.gloss .gd{font-size:calc(13.5px * var(--fs));color:var(--ink2);margin-top:6px}
.gloss .gx{font-size:calc(13.5px * var(--fs));margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.gloss .gx b{font-weight:600}
.gloss .close{position:absolute;top:8px;right:11px;border:0;background:none;font-size:calc(20px * var(--fs));color:var(--ink2);cursor:pointer}
/* ---------- tables ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:calc(13.5px * var(--fs));min-width:340px}
th{background:var(--accent);color:#fff;padding:8px 10px;text-align:left;font-weight:700;font-size:calc(13px * var(--fs))}
td{border:1px solid var(--line);padding:8px 10px;vertical-align:top}
tr:nth-child(even) td{background:#fdfbf8}
/* ---------- quiz ---------- */
.q{border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:11px;background:#fff}
.q .qt{font-weight:600;margin-bottom:9px;font-size:calc(15px * var(--fs))}
.opt{
  display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:9px;
  padding:9px 12px;margin-bottom:7px;font:inherit;font-size:calc(14.5px * var(--fs));cursor:pointer;color:var(--ink)
}
.opt:active{background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:#eefaf1;font-weight:600}
.opt.wrong{border-color:var(--bad);background:#fdeeee}
.expl{font-size:calc(13px * var(--fs));background:#f6f2ec;border-radius:9px;padding:9px 11px;margin-top:4px;display:none}
.expl.on{display:block}
.score{font-size:calc(15px * var(--fs));font-weight:700;padding:11px;background:var(--accent-soft);border-radius:11px;text-align:center}
/* ---------- flashcard ---------- */
.fc{
  background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 18px rgba(60,45,30,.1);
  padding:26px 18px;text-align:center;min-height:230px;display:flex;flex-direction:column;justify-content:center;gap:6px
}
.fc .fw{font-size:calc(34px * var(--fs));font-weight:800;letter-spacing:.5px;word-break:break-word}
.fc .fi{font-family:ui-monospace,monospace;color:var(--ink2);font-size:calc(14px * var(--fs))}
.fc .fp{font-size:calc(12px * var(--fs));color:var(--accent2);font-weight:700}
.fc .fcn{font-size:calc(23px * var(--fs));font-weight:700;color:var(--accent2);margin-top:6px}
.fc .fd{font-size:calc(14px * var(--fs));color:var(--ink2);margin-top:4px}
.fc .fx{font-size:calc(14.5px * var(--fs));margin-top:12px;border-top:1px dashed var(--line);padding-top:11px;text-align:left}
.fc .fx .cn{color:var(--ink2);font-size:calc(13px * var(--fs))}
.fc .fsrc{font-size:calc(11px * var(--fs));color:var(--ink2);margin-top:9px}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}
.grade button{border:0;border-radius:10px;padding:11px 3px;font:inherit;font-size:calc(13px * var(--fs));font-weight:700;color:#fff;cursor:pointer}
.g1{background:#d9534f}.g2{background:#e8913a}.g3{background:#4a9e6a}.g4{background:#3b82c4}
.grade small{display:block;font-size:calc(10px * var(--fs));font-weight:400;opacity:.9}
.pbwrap{background:#efeae3;border-radius:20px;height:9px;overflow:hidden;margin:8px 0}
.pbfill{background:linear-gradient(90deg,#f0964f,#d9691f);height:100%;width:0;transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:9px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 8px;text-align:center}
.stat b{display:block;font-size:calc(23px * var(--fs));color:var(--accent2);line-height:1.2}
.stat span{font-size:calc(11.5px * var(--fs));color:var(--ink2)}
/* ---------- 每日打卡日曆 ---------- */
.calhd{display:flex;align-items:center;justify-content:space-between;margin:4px 0 10px}
.calhd .m{font-weight:800;font-size:calc(15px * var(--fs))}
.calnav{background:#fff;border:1px solid var(--line);border-radius:9px;width:32px;height:32px;
  font-size:16px;color:var(--ink);cursor:pointer;line-height:1}
.calnav:disabled{opacity:.35;cursor:default}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.calgrid .wd{text-align:center;font-size:calc(11px * var(--fs));color:var(--ink2);padding-bottom:2px}
.cell{aspect-ratio:1;border-radius:9px;border:1px solid var(--line);background:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:calc(12px * var(--fs));color:var(--ink2);position:relative}
.cell.empty{border:0;background:transparent}
.cell.done{background:linear-gradient(135deg,#f7bd76,#ef9a4f);border-color:#e8813a;color:#fff;font-weight:700}
.cell.done .dot{font-size:calc(11px * var(--fs));line-height:1}
.cell.today{outline:2px solid var(--accent2);outline-offset:1px}
.cell.future{opacity:.4}
.callegend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;font-size:calc(12px * var(--fs));color:var(--ink2)}
.callegend i{display:inline-block;width:14px;height:14px;border-radius:5px;vertical-align:-2px;margin-right:5px}
/* ---------- grammar ---------- */
.gsec{margin-bottom:16px}
.gsec h3{font-size:calc(15px * var(--fs));margin:0 0 7px;color:var(--accent2);border-left:3px solid var(--accent);padding-left:8px}
.gsec ul{margin:6px 0;padding-left:20px;font-size:calc(14.5px * var(--fs))}
.gsec ul li{margin-bottom:4px}
.ex{background:#fdfbf8;border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:7px 0}
.ex .een{font-size:calc(15px * var(--fs));font-weight:600;display:flex;gap:8px;align-items:flex-start}
.ex .ecn{font-size:calc(13.5px * var(--fs));color:var(--ink2)}
.ex .enote{font-size:calc(12px * var(--fs));color:var(--accent2);margin-top:3px}
.trap{background:#fff6f5;border:1px solid #f3d5d2;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:calc(14px * var(--fs))}
.trap .bad{color:var(--bad)} .trap .good{color:var(--ok);font-weight:600}
.trap .why{font-size:calc(12.5px * var(--fs));color:var(--ink2);margin-top:4px}
.upg{background:#f4f0fb;border:1px solid #e0d6f5;border-radius:12px;padding:14px 15px;margin-bottom:12px}
.upg .u1{font-size:calc(15.5px * var(--fs));color:#6b6259;font-weight:600}
.upg .u2{font-size:calc(18px * var(--fs));font-weight:800;margin-top:8px;display:flex;gap:8px;align-items:flex-start;line-height:1.6;color:#2b2438}
.upg .un{font-size:calc(15px * var(--fs));color:#5b4a86;margin-top:9px;font-weight:600;line-height:1.75;background:#fff;border-radius:9px;padding:9px 11px}
/* 每組升級用不同顏色，方便一眼區分 */
.upg.c0{background:#f4f0fb;border-color:#e0d6f5}         .upg.c0 .un{color:#5b4a86}
.upg.c1{background:#e9f6f1;border-color:#cfe9df}         .upg.c1 .un{color:#1f6b57}
.upg.c2{background:#fdf2e5;border-color:#f4ddc1}         .upg.c2 .un{color:#9a5a1c}
.upg.c3{background:#eaf2fb;border-color:#cfe0f2}         .upg.c3 .un{color:#2b5f92}
/* ---------- 影片播放器（16:9 自適應） ---------- */
.ytwrap{position:relative;width:100%;padding-top:56.25%;background:#000;border-radius:12px;overflow:hidden;margin-top:11px}
/* 影片黏在上方：往下捲字幕時影片仍一直看得到（一頁檢視，參照 Speak Up） */
.vidpin{position:sticky;top:var(--hdh,52px);z-index:40;background:var(--bg);padding:6px 0 8px;margin-bottom:4px}
.vidpin .ytwrap{margin-top:0;padding-top:0;height:min(32vh,52vw);max-width:100%}
.ytwrap>div,.ytwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.spk.rbtn.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
/* ---------- 雜誌版面（仿常春藤內頁） ---------- */
.mag{display:grid;grid-template-columns:1fr;gap:14px;align-items:start;margin-bottom:14px}
.mag2{display:grid;grid-template-columns:1fr;gap:14px;align-items:start;margin-bottom:14px}
@media(min-width:860px){
  .mag{grid-template-columns:1.4fr 1fr}
  .mag2{grid-template-columns:1fr 1fr}
  /* 右欄比左欄長太多時改成單欄，單字片語用雙欄流排，避免左下出現大片空白 */
  .mag.stack{grid-template-columns:1fr}
  .mag.stack .wpbody.flow{column-count:2;column-gap:20px}
  .mag.stack .wpbody.flow .wpitem{break-inside:avoid;-webkit-column-break-inside:avoid}
  /* 右欄沒有內容就不要留一整欄空白 */
  .mag.solo{grid-template-columns:1fr}
  /* 內文比右欄長很多時，右欄跟著捲動，空白就變成「單字一直看得到」 */
  .mag.pin>div:last-child{position:sticky;top:58px}
}
.magttl{
  background:linear-gradient(135deg,#fff4e2,#ffe3c2);border:2.5px solid #2b2118;border-radius:16px;
  padding:14px 16px;box-shadow:5px 5px 0 #2b2118;margin-bottom:14px
}
.magttl h2{
  margin:0;font-size:calc(25px * var(--fs));font-weight:900;line-height:1.2;letter-spacing:.5px;
  color:#1f1a14;text-transform:uppercase
}
.magttl .cn{font-size:calc(18px * var(--fs));font-weight:900;color:#c0392b;margin-top:4px}
.magttl .set{font-size:calc(14px * var(--fs));font-style:italic;color:#5b4a3a;margin-top:7px}
.magttl .bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:9px}
.magbadge{
  font-size:calc(11.5px * var(--fs));font-weight:800;background:#2b2118;color:#fff;
  border-radius:6px;padding:2px 8px
}
/* ---------- 文章插圖／圖表 ---------- */
.artbox{margin:0 0 14px;background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:10px;overflow:hidden}
.artbox svg{display:block;width:100%;height:auto;border-radius:9px}
.artbox figcaption{
  font-size:calc(13px * var(--fs));color:var(--ink2);line-height:1.7;margin-top:9px;
  padding:8px 10px;background:#fdfbf8;border-radius:8px;border-left:3px solid var(--accent)
}
/* 內文重點字：橘色加粗＋上標編號 */
w.tgt{color:#c0561a;font-weight:800}
sup.tno{color:#c0392b;font-weight:900;font-size:.66em;padding-left:1px}
/* 右欄 Words & Phrases */
.wpbox{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.wphead{
  background:#2b7a78;color:#fff;padding:8px 13px;font-size:calc(14.5px * var(--fs));font-weight:800;
  display:flex;justify-content:space-between;align-items:center;gap:8px
}
.wphead .zh{font-size:calc(12.5px * var(--fs));opacity:.92;font-weight:700}
.wpbody{padding:11px 13px}
.wpitem{border-bottom:1px dashed var(--line);padding:9px 0}
.wpitem:last-child{border-bottom:0}
.wpline{font-size:calc(16px * var(--fs));font-weight:800;color:#1f1a14;display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.wpline .n{color:#c0392b;font-weight:900}
.wpline .ipa{font-family:ui-monospace,monospace;font-size:calc(12.5px * var(--fs));color:var(--ink2);font-weight:400}
.wpline .pos{font-size:calc(12.5px * var(--fs));color:#2b7a78;font-weight:800;font-style:italic}
.wpitem .zh{font-size:calc(15px * var(--fs));font-weight:700;color:var(--accent2);margin-top:2px}
.wpitem .def{font-size:calc(13.5px * var(--fs));color:var(--ink2);margin-top:3px}
.wpitem .exs{font-size:calc(14.5px * var(--fs));margin-top:5px;background:#fdfbf8;border-radius:8px;padding:7px 9px}
.wpitem .exs .excn{font-size:calc(13px * var(--fs));color:var(--ink2);margin-top:4px}
.extra{display:flex;flex-wrap:wrap;gap:6px}
.extra span{
  font-size:calc(13px * var(--fs));background:#f2f7f7;border:1px solid #cfe3e2;border-radius:20px;
  padding:3px 10px;cursor:pointer
}
/* You Can Do This */
.ycd{border-bottom:1px dashed var(--line);padding:10px 0}
.ycd:last-child{border-bottom:0}
.ycd .q{border:0;padding:0;margin:0;background:none;font-size:calc(15.5px * var(--fs));line-height:1.85}
.ycd .blank{font-weight:900;color:#c0392b}
.opt3{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle;align-items:center}
.opt3 .par,.opt3 .sl{color:#8a7f72;font-weight:800}
.opt3 button{
  border:1.5px solid var(--line);background:#fff;border-radius:8px;font:inherit;
  font-size:calc(14px * var(--fs));padding:2px 9px;cursor:pointer;color:var(--ink)
}
.opt3 button.right{border-color:var(--ok);background:#eefaf1;font-weight:800;color:#1f8a4c}
.opt3 button.wrong{border-color:var(--bad);background:#fdeeee;color:var(--bad)}
.ycdcn{font-size:calc(13.5px * var(--fs));color:var(--ink2);margin-top:4px;display:none}
.ycdcn.on{display:block}
/* ---------- 逐字稿（時間軸同步） ---------- */
.sline{border-left:3px solid transparent;border-radius:9px;padding:7px 9px;margin-bottom:5px}
.sline.cur{background:#fff2d9;border-left-color:var(--accent)}
.srow{display:flex;gap:8px;align-items:flex-start}
.stime{
  border:1px solid var(--line);background:#fff;border-radius:7px;font:inherit;
  font-size:calc(11.5px * var(--fs));font-family:ui-monospace,monospace;color:var(--accent2);
  padding:2px 6px;cursor:pointer;flex-shrink:0;margin-top:2px
}
.sline.cur .stime{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.sen{flex:1;font-size:calc(16px * var(--fs));line-height:1.7;cursor:pointer}
.scn{font-size:calc(14px * var(--fs));color:var(--ink2);margin-top:3px;padding-left:52px}
#sublist.noen .sen{visibility:hidden}
#sublist.nocn .scn{display:none}
/* ---------- 文法重點深入說明 ---------- */
.focus{background:#fff8f1;border:1.5px solid #f2d3b3;border-radius:14px;padding:16px;margin-bottom:14px}
.focus h3{margin:0 0 4px;font-size:calc(19px * var(--fs));font-weight:800;color:var(--accent2);letter-spacing:.2px}
.focus .fml{
  font-size:calc(17px * var(--fs));font-weight:800;background:#fff;border:1.5px dashed var(--accent);border-radius:10px;
  padding:11px 13px;margin:11px 0;line-height:1.65;color:#8a3f08
}
.focus ol{margin:10px 0 4px;padding-left:22px}
.focus ol li{font-size:calc(16px * var(--fs));font-weight:600;line-height:1.85;margin-bottom:10px;color:#33291f}
.focus .sub{font-size:calc(14.5px * var(--fs));font-weight:800;color:var(--accent2);margin:14px 0 6px;letter-spacing:.3px}
.focus .gobtn{margin-top:12px}
.back{border:0;background:none;color:var(--accent2);font:inherit;font-size:calc(14px * var(--fs));font-weight:600;cursor:pointer;padding:4px 0;margin-bottom:6px}
.hint{font-size:calc(12.5px * var(--fs));color:var(--ink2);background:#fff;border:1px dashed var(--line);border-radius:10px;padding:9px 11px;margin-bottom:12px}
@media(max-width:420px){ .fc .fw{font-size:calc(28px * var(--fs))} .para .en{font-size:calc(16px * var(--fs))} }
</style>
</head>
<body>

<header>

<main>

  <button id="t-prog" onclick="go('prog')"><i>📊</i>進度</button>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="data-notes.js"></script>
<script src="data-reading.js"></script>
<script src="data-grammar.js"></script>
<script src="data-focus.js"></script>
<script src="data-a2.js"></script>
<script src="data-art.js"></script>
<script src="data-listen.js"></script>
<script src="data-daily.js"></script>
<script>
/* ============================================================
   0. 基礎工具
   ============================================================ */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const lvCls = l => l==='B1+'?'B1P':(l==='B2'?'B2':(l==='A2'?'A2':'B1'));

/* ---------- 學習者 Profile（各自獨立進度，與課堂筆記站同一套） ---------- */
const PROFILES={anita:'Anita',tom:'Tom'};
// 每位學習者的程度區間：Tom 從 A2 起步、Anita 往 B2 推進
const BANDS={anita:['B1','B1+','B2'], tom:['A2','B1','B1+']};
const GOALS={anita:'從 B1 穩穩推到 B2', tom:'從 A2 穩穩推到 B1+'};
const band = () => BANDS[PROFILE]||BANDS.anita;
const inBand = l => band().indexOf(l)>=0;
let PROFILE=localStorage.getItem('b2lab_profile')||'anita';
if(!PROFILES[PROFILE]) PROFILE='anita';
const skey = () => 'b2lab.v1.'+PROFILE;
const blank = () => ({srs:{}, artDone:{}, gramDone:{}, newPerDay:12, dayNew:{}, streak:0, lastDay:null, rate:0.9, fs:1.15, listenDone:{}, vnotes:{}, updatedAt:0});

/* ---------- 本機儲存 ---------- */
let ST=blank();
function loadLocal(){
  ST=blank();
  try{
    let raw=localStorage.getItem(skey());
    // 從舊的單一鍵值搬家（雲端同步上線前的紀錄，一律歸給 anita）
    if(!raw && PROFILE==='anita'){
      const old=localStorage.getItem('b2lab.v1');
      if(old){ raw=old; localStorage.setItem(skey(),old); localStorage.removeItem('b2lab.v1'); }
    }
    if(raw) ST=Object.assign(ST,JSON.parse(raw));
  }catch(e){}
}
function saveLocal(){ try{ localStorage.setItem(skey(),JSON.stringify(ST)); }catch(e){} }
function save(){ ST.updatedAt=Date.now(); saveLocal(); cloudPush(); }
// 用「當地日期」而不是 UTC，否則台灣早上八點前會被算成前一天
function dstr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const today = () => dstr(new Date());
function touchStreak(){
  const d=today();
  if(ST.lastDay===d) return;
  const y=dstr(new Date(Date.now()-86400000));
  ST.streak = (ST.lastDay===y) ? (ST.streak||0)+1 : 1;
  ST.lastDay=d; save();
}

/* ---------- Firebase 雲端同步 ---------- */
const FB_CONFIG={
  apiKey:"AIzaSyAfFkztYpTnl_-Ieo6bONZAfN5w7l5GalE",
  authDomain:"english-b2-lab.firebaseapp.com",
  projectId:"english-b2-lab",
  appId:"1:874043554423:web:6cd62a35d0b388950b2472"
};
let db=null, cloudUnsub=null, pushTimer=null;
try{ if(window.firebase&&firebase.initializeApp){ firebase.initializeApp(FB_CONFIG); db=firebase.firestore(); } }catch(e){ db=null; }
function cloudDoc(){ return db ? db.collection('b2lab_progress').doc(PROFILE) : null; }
function cloudBadge(on){ const el=$('sync-badge'); if(el) el.style.display=on?'inline-block':'none'; }
function cloudPush(){
  if(!db) return;
  if(pushTimer) clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>{
    const d=cloudDoc(); if(!d) return;
    d.set(ST,{merge:true}).then(()=>cloudBadge(true)).catch(()=>cloudBadge(false));
  },1200);
}
/* 兩邊的單字複習紀錄逐字合併，取比較新的那一筆，避免換裝置時覆蓋掉進度 */
function mergeState(remote){
  const out=Object.assign({},ST,remote);
  out.srs=Object.assign({},ST.srs||{});
  Object.keys(remote.srs||{}).forEach(w=>{
    const a=(ST.srs||{})[w], b=remote.srs[w];
    out.srs[w] = (!a || (b.seen||'')>=(a.seen||'')) ? b : a;
  });
  out.artDone=Object.assign({},remote.artDone||{},ST.artDone||{});
  out.gramDone=Object.assign({},remote.gramDone||{},ST.gramDone||{});
  out.dayNew=Object.assign({},remote.dayNew||{},ST.dayNew||{});
  out.listenDone=Object.assign({},remote.listenDone||{},ST.listenDone||{});
  out.vnotes=Object.assign({},remote.vnotes||{},ST.vnotes||{});
  out.streak=Math.max(ST.streak||0,remote.streak||0);
  return out;
}
function cloudPull(done){
  const d=cloudDoc(); if(!d){ done&&done(); return; }
  d.get().then(s=>{
    if(s.exists){ ST=mergeState(s.data()||{}); saveLocal(); cloudBadge(true); }
    else cloudBadge(true);
    done&&done();
  }).catch(()=>{ cloudBadge(false); done&&done(); });
}
function cloudSubscribe(){
  if(!db) return;
  if(cloudUnsub){ cloudUnsub(); cloudUnsub=null; }
  const d=cloudDoc(); if(!d) return;
  const mine=PROFILE;
  cloudUnsub=d.onSnapshot(s=>{
    if(PROFILE!==mine || !s.exists) return;
    const r=s.data()||{};
    if((r.updatedAt||0)<=(ST.updatedAt||0)) return;   // 自己剛推上去的不用理
    ST=mergeState(r); saveLocal(); cloudBadge(true);
    if(!vQueue.length && !(TAB==='listen' && (lsOpen||myVid))) RENDER[TAB] && RENDER[TAB]();   // 單字卡複習中不打斷
  },()=>cloudBadge(false));
}
function setProfile(p){
  if(!PROFILES[p]||p===PROFILE) return;
  if(window.speechSynthesis) speechSynthesis.cancel();
  if(cloudUnsub){ cloudUnsub(); cloudUnsub=null; }
  PROFILE=p; localStorage.setItem('b2lab_profile',p);
  vQueue=[]; vIdx=0; vFlip=false; rdOpen=null; CURG=null; QSTATE={};
  if(!inBand(rdFilter.level)) rdFilter.level='all';   // 舊的程度篩選可能不在新區間裡
  updateProfileUI();
  loadLocal();
  applyFs();
  cloudPull(()=>{ touchStreak(); RENDER[TAB] && RENDER[TAB](); cloudSubscribe(); vidSubscribe(); });
  RENDER[TAB] && RENDER[TAB]();
}
function updateProfileUI(){
  ['anita','tom'].forEach(p=>{ const b=$('prof-'+p); if(b) b.classList.toggle('on',PROFILE===p); });
  const el=$('hd-levels');
  if(el) el.innerHTML=band().map(l=>'<span class="lv '+lvCls(l)+'">'+l+'</span>').join('');
  const t=$('hd-title'); if(t) t.textContent=GOALS[PROFILE]||'';
}
window.setProfile=setProfile;

/* ---------- 語音朗讀 (TTS) ---------- */
let VOICE=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>/^en(-|_)/i.test(v.lang));
  if(!vs.length) return;
  VOICE = vs.find(v=>/en-US/i.test(v.lang)&&/natural|google|samantha|aria|zira/i.test(v.name))
       || vs.find(v=>/en-US/i.test(v.lang)) || vs[0];
}
pickVoice();
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged=pickVoice;
function say(text,rate,onend){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(String(text).replace(/\s+/g,' ').trim());
  u.lang='en-US'; u.rate = rate || ST.rate || 0.9;
  if(VOICE) u.voice=VOICE;
  if(onend){ u.onend=onend; u.onerror=onend; }
  speechSynthesis.speak(u);
}
window.say=say;
/* 朗讀單一句子，並在朗讀時把那一句高亮起來 */
function saySent(btn){
  document.querySelectorAll('.para .sent.reading').forEach(el=>el.classList.remove('reading'));
  const sent=btn.closest('.sent'); if(sent) sent.classList.add('reading');
  say(btn.dataset.t, null, ()=>{ if(sent) sent.classList.remove('reading'); });
}
window.saySent=saySent;
function spk(text,label){
  return '<button class="spk" onclick="say(this.dataset.t);event.stopPropagation()" data-t="'+esc(text)+'">🔊'+(label?' '+label:'')+'</button>';
}
/* 把一段文字切成一句一句（保留句尾標點） */
function splitSentences(text){
  const s=String(text||'').trim();
  const m=s.match(/[^.!?]+[.!?]+["'”’)\]]*\s*|[^.!?]+$/g);
  return m ? m.map(x=>x.trim()).filter(Boolean) : (s?[s]:[]);
}

/* ============================================================
   1. 字彙總表 (glossary) — 供文章點字查詢
   ============================================================ */
const GLOSS={};
function addGloss(k,obj){
  const key=String(k).toLowerCase().trim();
  if(!key) return;
  if(!GLOSS[key]) GLOSS[key]=obj;
}
(NOTES.vocab||[]).forEach(v=>addGloss(v.w,{w:v.w,ipa:v.ipa,pos:v.pos,cn:v.cn,def:v.def,exEn:v.exEn,exCn:v.exCn,src:(NOTES.sources||{})[v.w]||''}));
(NOTES.kw||[]).forEach(k=>{
  const e=(k.exs||[])[0]||{};
  addGloss(k.w,{w:k.w,ipa:k.ipa,pos:'',cn:(k.tag||'').split('·')[0].trim(),def:'',exEn:e.en,exCn:e.cn,src:'課堂片語'});
});
(READING||[]).forEach(a=>(a.target||[]).forEach(t=>addGloss(t.w,{w:t.w,ipa:t.ipa,pos:t.pos,cn:t.cn,def:t.def,exEn:t.ex,exCn:t.exCn||'',src:'閱讀：'+a.title})));

// 簡易還原詞形，讓 studies / studied / studying 都查得到
function lookup(raw){
  const w=String(raw).toLowerCase().replace(/[^a-z'-]/g,'');
  if(!w) return null;
  const tries=[w];
  if(w.endsWith("'s")) tries.push(w.slice(0,-2));
  if(w.endsWith('ies')) tries.push(w.slice(0,-3)+'y');
  if(w.endsWith('es')) tries.push(w.slice(0,-2),w.slice(0,-1));
  if(w.endsWith('s')) tries.push(w.slice(0,-1));
  if(w.endsWith('ed')) tries.push(w.slice(0,-2),w.slice(0,-1),w.slice(0,-2)+'e');
  if(w.endsWith('ing')) tries.push(w.slice(0,-3),w.slice(0,-3)+'e');
  if(w.endsWith('ily')) tries.push(w.slice(0,-3)+'y');
  if(w.endsWith('ly')) tries.push(w.slice(0,-2));
  if(w.endsWith('er')) tries.push(w.slice(0,-2),w.slice(0,-1));
  if(w.endsWith('est')) tries.push(w.slice(0,-3));
  if(/(.)\1(ed|ing)$/.test(w)) tries.push(w.replace(/(.)\1(ed|ing)$/,'$1'));
  for(const t of tries) if(GLOSS[t]) return GLOSS[t];
  return null;
}
function showGloss(raw){
  const g=lookup(raw);
  const body=$('glossBody');
  if(!g){
    body.innerHTML='<div class="gw">'+esc(raw)+' '+spk(raw)+'</div><div class="gd">這個字還沒有在字庫裡。可以先聽發音，或到「單字卡」分頁瀏覽課堂單字。</div>';
  }else{
    body.innerHTML=
      '<div class="gw">'+esc(g.w)+' '+spk(g.w)+(g.pos?' <span class="fp" style="font-size:calc(12px * var(--fs))">'+esc(g.pos)+'</span>':'')+'</div>'
      +(g.ipa?'<div class="gi">'+esc(g.ipa)+'</div>':'')
      +(g.cn?'<div class="gc">'+esc(g.cn)+'</div>':'')
      +(g.def?'<div class="gd">'+esc(g.def)+'</div>':'')
      +(g.exEn?'<div class="gx"><b>'+esc(g.exEn)+'</b> '+spk(g.exEn)+(g.exCn?'<div class="muted">'+esc(g.exCn)+'</div>':'')+'</div>':'')
      +(g.src?'<div class="muted" style="margin-top:7px;font-size:calc(11.5px * var(--fs))">來源：'+esc(g.src)+'</div>':'');
  }
  $('gloss').classList.add('on');
}
function hideGloss(){ $('gloss').classList.remove('on'); }
window.showGloss=showGloss; window.hideGloss=hideGloss;

// 把英文段落切成可點擊的單字
function tokenize(text,hiSet){
  return String(text).replace(/[A-Za-z][A-Za-z'’\-]*/g, m=>{
    const bare=m.toLowerCase().replace(/[^a-z'’-]/g,'');
    const hi = hiSet && (hiSet.has(bare) || hiSet.has(bare.replace(/s$/,''))) ? ' class="hi"' : '';
    return '<w'+hi+' onclick="showGloss(this.textContent)">'+esc(m)+'</w>';
  });
}

/* ============================================================
   2. 分頁切換
   ============================================================ */
let TAB='daily';
const RENDER={};
function go(t){
  TAB=t;
  ['daily','read','listen','vocab','gram','prog'].forEach(k=>{
    $('v-'+k).hidden = (k!==t);
    $('t-'+k).classList.toggle('on',k===t);
  });
  if(t!=='listen') destroyPlayer();
  hideGloss();
  window.scrollTo(0,0);
  RENDER[t] && RENDER[t]();
}
window.go=go;

/* ============================================================
   3. 閱讀分頁
   ============================================================ */
// 課堂筆記文章 → 統一格式
const NOTE_ARTS=(NOTES.articles||[]).map((a,i)=>{
  // 從 source（例「Based on 20260806 lesson notes」）取出上課日期，格式化成 YYYY-MM-DD
  const dates=((a.source||'').match(/\d{8}/g)||[]).map(d=>d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6,8));
  return {
    id:'n'+String(i+1).padStart(2,'0'),
    level:'B1', topic:'課堂筆記', words:(a.paras||[]).reduce((n,p)=>n+p.en.split(/\s+/).length,0),
    title:a.title, titleCn:a.titleCn, focus:'', intro:'', source:a.source,
    date:dates.join(' / '),
    paras:a.paras||[], questions:a.questions||[], target:[], upgrade:[],
    hi:(a.highlightWords||[]), kind:'note'
  };
});
const A2_ARTS=(((window.A2||{}).articles)||[]).map(a=>Object.assign({},a,{kind:'orig',hi:(a.target||[]).map(t=>t.w)}));
const A2_GRAM=(((window.A2||{}).grammar)||[]);

// A2 的重點字也要進字庫

/* 兩欄高度差太多就自動改版：內文全寬 + 單字片語雙欄流排 */
function rebalanceMag(){
  const mag=document.querySelector('#v-read .mag');
  if(!mag||!mag.children[1]) return;
  const R0=mag.children[1].getBoundingClientRect().height;
  if(R0<20){ mag.classList.add('solo'); return; }      // 右欄沒內容 → 不要留空欄
  if(innerWidth<860) return;
  const L=mag.children[0].getBoundingClientRect().height;
  const R=R0;
  if(R>L*1.2||R-L>250){                                // 右欄太長 → 全寬＋雙欄流排
    mag.classList.add('stack');
    const body=mag.children[1].querySelector('.wpbody');
    if(body) body.classList.add('flow');
  }else if(L>R*1.2){                                   // 內文太長 → 右欄跟著捲動
    mag.classList.add('pin');
  }
}

const reEsc = s => String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

/* 文章插圖／圖表（來自 data-art.js，全部是本站自己畫的 SVG） */

/* 內文重點字：橘色加粗＋上標編號（只標第一次出現），其餘字照樣可點查 */
function magTokenize(text,tmap,used){
  if(!tmap||!tmap.keys.length) return tokenize(text,null);
  const re=new RegExp('\\b('+tmap.keys.map(reEsc).join('|')+')(s|es|ed|ing|d)?\\b','ig');
  let out='',last=0,m;
  while((m=re.exec(text))){
    const key=m[1].toLowerCase();
    const n=tmap.num[key];
    if(!n||used.has(key)) continue;
    used.add(key);
    out+=tokenize(text.slice(last,m.index),null);
    out+='<b>'+tokenize(m[0],null).replace(/<w/g,'<w class="tgt"')+'<sup class="tno">'+n+'</sup></b>';
    last=m.index+m[0].length;
  }
  return out+tokenize(text.slice(last),null);
}

/* 補充詞彙：文章裡出現、又在課堂字庫裡、但不是本篇重點字的字 */
function extraWords(a,tgtSet){
  const seen=new Set(), out=[];
  const text=a.paras.map(p=>p.en).join(' ');
  (text.match(/[A-Za-z][A-Za-z'-]*/g)||[]).forEach(raw=>{
    if(out.length>=10) return;
    const g=lookup(raw); if(!g) return;
    const k=g.w.toLowerCase();
    if(seen.has(k)||tgtSet.has(k)) return;
    if(g.w.length<5) return;             // 太簡單的字不列
    seen.add(k); out.push(g);
  });
  return out;
}

/* You Can Do This：用文章自己的句子挖空，選項取自本篇其他重點字 */
function buildYCD(a,tgIn){
  const tg=(tgIn||a.target||[]).filter(t=>/^[A-Za-z][A-Za-z' -]*$/.test(t.w));
  if(tg.length<3) return [];
  const sents=[];
  a.paras.forEach(p=>String(p.en).split(/(?<=[.!?])\s+/).forEach(s=>{ if(s.trim()) sents.push(s.trim()); }));
  const out=[];
  for(const t of tg){
    if(out.length>=3) break;
    const re=new RegExp('\\b'+reEsc(t.w)+'(s|es|ed|ing|d)?\\b','i');
    const s=sents.find(x=>re.test(x));
    if(!s) continue;
    const form=(s.match(re)||[])[0];
    const others=tg.filter(x=>x.w!==t.w && x.pos===t.pos);
    const pool=(others.length>=2?others:tg.filter(x=>x.w!==t.w)).slice(0,2);
    if(pool.length<2) continue;
    const opts=[t.w,pool[0].w,pool[1].w].sort();
    out.push({sent:s.replace(re,'\u0000'), form:form, ans:t.w, opts:opts, cn:t.cn, i:out.length});
  }
  return out;
}
function ycdHTML(items){
  if(!items.length) return '';
  return '<div class="wpbox"><div class="wphead">▼ You Can Do This<span class="zh">英文試金石</span></div>'
   +'<div class="wpbody"><div class="hint" style="margin-bottom:8px">選出最適當的字完成句子。</div>'
   + items.map((it,i)=>{
       const parts=it.sent.split('\u0000');
       return '<div class="ycd"><div class="q">'+(i+1)+'. '+esc(parts[0])
        +'<span class="opt3" id="y-'+i+'"><span class="par">(</span>'
        + it.opts.map((o,j)=>'<button onclick="ycdPick('+i+','+j+')" data-w="'+esc(o)+'">'+esc(o)+'</button>').join('<span class="sl">/</span>')
        +'<span class="par">)</span></span>'+esc(parts[1]||'')+'</div>'
        +'<div class="ycdcn" id="ycn-'+i+'">✔ '+esc(it.ans)+'（'+esc(it.cn)+'）→ '+esc(it.sent.replace('\u0000',it.form))+'</div></div>';
     }).join('')
   +'</div></div>';
}
let YCD=[];
function ycdPick(i,j){
  const box=$('y-'+i); if(!box||box.dataset.done) return;
  box.dataset.done='1';
  const it=YCD[i];
  [...box.querySelectorAll('button')].forEach(b=>{
    if(b.dataset.w===it.ans) b.classList.add('right');
    else if(b===box.querySelectorAll('button')[j]) b.classList.add('wrong');
    b.disabled=true;
  });
  const cn=$('ycn-'+i); if(cn) cn.classList.add('on');
  say(it.sent.replace('\u0000',it.form));
}

function readerHTML(a){
  // 課堂筆記文章沒有 target，就用它的 highlightWords 去字庫組出單字片語欄
  let tg=a.target||[];
  if(!tg.length&&(a.hi||[]).length){
    const seen=new Set();
    tg=(a.hi||[]).map(w=>{
      const g=lookup(w); if(!g) return null;
      const k=g.w.toLowerCase(); if(seen.has(k)) return null; seen.add(k);
      return {w:g.w,ipa:g.ipa||'',pos:g.pos||'',cn:g.cn||'',def:g.def||'',ex:g.exEn||''};
    }).filter(Boolean);
  }
  // 編號照內文出現的順序排（跟雜誌一樣 1、2、3…），沒出現在內文的排到後面
  const tmap={keys:tg.map(t=>t.w).sort((x,y)=>y.length-x.length), num:{}};
  if(tg.length){
    const full=a.paras.map(p=>p.en).join('\n');
    const re=new RegExp('\\b('+tmap.keys.map(reEsc).join('|')+')(s|es|ed|ing|d)?\\b','ig');
    const order=[], seenK=new Set(); let mm;
    while((mm=re.exec(full))){
      const k=mm[1].toLowerCase();
      if(!seenK.has(k)){ seenK.add(k); order.push(k); }
    }
    tg=tg.slice().sort((x,y)=>{
      const ix=order.indexOf(x.w.toLowerCase()), iy=order.indexOf(y.w.toLowerCase());
      return (ix<0?9999:ix)-(iy<0?9999:iy);
    });
  }
  tg.forEach((t,i)=>{ tmap.num[t.w.toLowerCase()]=i+1; });
  const tgtSet=new Set(tg.map(t=>t.w.toLowerCase()));
  const used=new Set();
  YCD=buildYCD(a,tg);
  const extras=extraWords(a,tgtSet);

  let h='<button class="back" onclick="rdClose()">← 回文章列表</button>'
   +'<div class="magttl">'
   +'<h2>'+esc(a.title)+'</h2>'
   +'<div class="cn">'+esc(a.titleCn)+'</div>'
   +(a.intro?'<div class="set">'+esc(a.intro)+'</div>':'')
   +'<div class="bar"><span class="lv '+lvCls(a.level)+'">'+esc(a.level)+'</span>'
   +'<span class="magbadge">🏷 '+esc(a.topic)+'</span>'
   +'<span class="magbadge">📝 '+a.words+' words</span>'
   +(a.date?'<span class="magbadge">📅 '+esc(a.date)+'</span>':'')
   +(a.focus?'<span class="magbadge">📐 '+esc(a.focus)+'</span>':'')
   +'</div>'
   +(a.source?'<div class="set" style="font-style:normal;font-size:calc(12.5px * var(--fs))">'+esc(a.source)
      +(a.sourceUrl?' · <a href="'+esc(a.sourceUrl)+'" target="_blank" rel="noopener">↗ 看新聞原文</a>':'')+'</div>':'')
   +'</div>'
   + artHTML(a.id);

  h+='<div class="mag">';

  /* 左欄：內文 */
  h+='<div><div class="card">'
   +'<div class="row" style="margin-bottom:11px">'
   +'<button class="btn ghost" onclick="cnAll(1)">顯示全部中譯</button>'
   +'<button class="btn gray" onclick="cnAll(0)">隱藏中譯</button>'
   +'<button class="btn ghost" onclick="readAll()">🔊 朗讀全文</button></div>'
   +'<div id="paras">'+a.paras.map((p,i)=>{
      const enHtml=splitSentences(p.en).map(s=>
        '<span class="sent">'+magTokenize(s,tmap,used)
        +'<button class="ssp" title="朗讀這一句" onclick="saySent(this);event.stopPropagation()" data-t="'+esc(s)+'">🔊</button></span>'
      ).join(' ');
      return '<div class="para" id="p'+i+'"><div class="en">'+enHtml+'</div>'
     +'<div class="pbar">'+spk(p.en,'整段')+'<button class="spk" onclick="togCn('+i+')">中譯</button></div>'
     +'<div class="cn">'+esc(p.cn)+'</div></div>';
    }).join('')
   +'</div>'
   +'<div class="muted" style="margin-top:6px;font-size:calc(12.5px * var(--fs))">💡 <b style="color:#c0561a">橘色加粗＋編號</b>的字對應右邊的單字片語；點文章裡<b>任何一個字</b>都能查中文；每句尾端的 🔊 可單獨<b>朗讀那一句</b>，整段用下方「整段」。</div>'
   +'</div></div>';

  /* 右欄：Words & Phrases + 補充詞彙 + You Can Do This */
  h+='<div>';
  if(tg.length){
    h+='<div class="wpbox"><div class="wphead">▼ Words &amp; Phrases<span class="zh">單字片語</span></div><div class="wpbody">'
     + tg.map((t,i)=>'<div class="wpitem">'
       +'<div class="wpline"><span class="n">'+(i+1)+'.</span> <w onclick="showGloss(\''+esc(t.w).replace(/'/g,"\\'")+'\')">'+esc(t.w)+'</w> '
       +spk(t.w)+(t.ipa?'<span class="ipa">'+esc(t.ipa)+'</span>':'')+(t.pos?'<span class="pos">'+esc(t.pos)+'</span>':'')+'</div>'
       +'<div class="zh">'+esc(t.cn)+'</div>'
       +(t.def?'<div class="def">'+esc(t.def)+'</div>':'')
       +(t.ex?'<div class="exs">'+esc(t.ex)+' '+spk(t.ex)+(t.exCn?'<div class="excn">'+esc(t.exCn)+'</div>':'')+'</div>':'')
       +'</div>').join('')
     +'</div></div>';
  }
  h+='</div></div>';

  /* 補充詞彙與試金石改成全寬並排：右欄比左欄長很多時，左下才不會出現大片空白 */
  const blocks=[];
  if(extras.length){
    blocks.push('<div class="wpbox"><div class="wphead">▼ Extra Words &amp; Phrases<span class="zh">補充詞彙</span></div>'
     +'<div class="wpbody"><div class="extra">'
     + extras.map(g=>'<span onclick="event.stopPropagation();showGloss(\''+esc(g.w).replace(/'/g,"\\'")+'\')">'+esc(g.w)+' · '+esc(g.cn||'')+'</span>').join('')
     +'</div><div class="muted" style="margin-top:7px;font-size:calc(12px * var(--fs))">這些字出現在本文，也在你的課堂字庫裡。點一下看完整解釋。</div></div></div>');
  }
  const y=ycdHTML(YCD); if(y) blocks.push(y);
  if(blocks.length) h+='<div class="mag2">'+blocks.join('')+'</div>';

  h+=focusHTML(a.id);
  if((a.upgrade||[]).length){
    const lo=a.upFrom||'B1', hi=a.upTo||'B2';
    h+='<div class="card"><h2 class="sec">⬆️ '+lo+' → '+hi+' 句型升級</h2>'
     + a.upgrade.map((u,i)=>'<div class="upg c'+(i%4)+'"><div class="u1">'+lo+'：'+esc(u.b1)+'</div>'
       +'<div class="u2">'+hi+'：'+esc(u.b2)+' '+spk(u.b2)+'</div>'
       +'<div class="un">💡 '+esc(u.note)+'</div></div>').join('')
     +'</div>';
  }
  if((a.questions||[]).length){
    h+='<div class="card"><h2 class="sec">✅ 閱讀理解測驗</h2><div id="quizBox">'+quizHTML(a.questions,'art')+'</div>'
     +'<div id="quizScore"></div></div>';
  }
  h+='<div class="card" style="text-align:center"><button class="btn" onclick="rdClose()">完成，回列表</button></div>';
  return h;
}

let QSTATE={};
function quizHTML(qs,ns){
  return qs.map((q,i)=>
    '<div class="q"><div class="qt">'+(i+1)+'. '+esc(q.q)+' '+spk(q.q)+'</div>'
    + q.opts.map((o,j)=>'<button class="opt" id="o-'+ns+'-'+i+'-'+j+'" onclick="pick(\''+ns+'\','+i+','+j+','+q.ans+')">'+esc(o)+'</button>').join('')
    + '<div class="expl" id="e-'+ns+'-'+i+'">'+(q.ans!=null?'✔ 正解：'+esc(q.opts[q.ans])+'<br>':'')+esc(q.expl||'')+'</div></div>').join('');

/* 三種測驗共用：art=文章、gram=文法單元、listen=聽力課 */
function qsOf(ns){ return ns==='art' ? (rdOpen&&rdOpen.questions)||[] : ns==='listen' ? (lsOpen&&lsOpen.questions)||[] : (CURG&&CURG.quiz)||[]; }
function scoreBoxId(ns){ return ns==='art'?'quizScore':ns==='listen'?'lsquizScore':'gquizScore'; }
function pick(ns,i,j,ans){
  const key=ns+'-'+i;
  if(QSTATE[key]!=null) return;
  QSTATE[key]=(j===ans);
  const nOpts=qsOf(ns)[i].opts.length;
  for(let k=0;k<nOpts;k++){
    const b=$('o-'+ns+'-'+i+'-'+k); if(!b) continue;
    if(k===ans) b.classList.add('right');
    else if(k===j) b.classList.add('wrong');
    b.disabled=true;
  }
  $('e-'+ns+'-'+i).classList.add('on');
  const qs=qsOf(ns);
  const done=qs.filter((_,x)=>QSTATE[ns+'-'+x]!=null).length;
  if(done===qs.length){
    const c=qs.filter((_,x)=>QSTATE[ns+'-'+x]===true).length;
    const box=$(scoreBoxId(ns));
    if(box) box.innerHTML='<div class="score">'+(c===qs.length?'🎉 全對！':'成績')+' '+c+' / '+qs.length+'（'+Math.round(c/qs.length*100)+'%）</div>';
    if(ns==='art'&&rdOpen){ ST.artDone[rdOpen.id]={correct:c,total:qs.length,date:today()}; save(); }
    if(ns==='gram'&&CURG){ ST.gramDone[CURG.id]={correct:c,total:qs.length,date:today()}; save(); }
    if(ns==='listen'&&lsOpen){ if(!ST.listenDone)ST.listenDone={}; ST.listenDone[lsOpen.id]={correct:c,total:qs.length,date:today()}; save(); }
  }

const CATS={daily:'日常生活',workplace:'職場',health:'健康身體',learning:'學習',food:'食物'};
const VOCAB=(NOTES.vocab||[]).filter(v=>v&&v.w);
function srs(w){ return ST.srs[w] || null; }
function isDue(w){ const s=srs(w); return s && s.due<=today(); }
function isNew(w){ return !srs(w); }
function buildQueue(cat){
  const pool=VOCAB.filter(v=>cat==='all'||v.cat===cat);
  const due=pool.filter(v=>isDue(v.w));
  const fresh=pool.filter(v=>isNew(v.w));
  const d=today();
  const usedNew=(ST.dayNew[d]||0);
  const allow=Math.max(0,(ST.newPerDay||12)-usedNew);
  return {due, fresh:fresh.slice(0,allow), freshTotal:fresh.length, allow};
}
function grade(w,g){
  // g: 1 忘記 / 2 有點難 / 3 記得 / 4 很簡單
  let s=srs(w)||{ease:2.5,int:0,reps:0,lapse:0};
  const wasNew=!srs(w);
  if(g===1){ s.lapse++; s.reps=0; s.int=0; s.ease=Math.max(1.3,s.ease-0.2); }
  else{
    s.reps++;
    if(g===2){ s.ease=Math.max(1.3,s.ease-0.15); s.int = s.reps===1?1:Math.max(1,Math.round(s.int*1.2)); }
    else if(g===3){ s.int = s.reps===1?1:(s.reps===2?3:Math.round(s.int*s.ease)); }
    else { s.ease=Math.min(3.0,s.ease+0.1); s.int = s.reps===1?3:(s.reps===2?6:Math.round(s.int*s.ease*1.25)); }
  }
  s.int=Math.min(s.int,365);
  const days = g===1 ? 0 : s.int;
  s.due=dstr(new Date(Date.now()+days*86400000));
  s.seen=today();
  ST.srs[w]=s;
  if(wasNew){ const d=today(); ST.dayNew[d]=(ST.dayNew[d]||0)+1; }
  save();
}

let vBrowseOn=false;
function vSet(c){ vCat=c; RENDER.vocab(); }
function vNewLimit(n){ ST.newPerDay=n; save(); RENDER.vocab(); }
function vStart(){
  const q=buildQueue(vCat);
  vQueue=q.due.concat(q.fresh);
  // 洗牌（不使用固定順序，避免每次都同一批先出現）
  for(let i=vQueue.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=vQueue[i]; vQueue[i]=vQueue[j]; vQueue[j]=t; }
  vIdx=0; vFlip=false; vSession={done:0,again:0}; RENDER.vocab();
}
function vDoFlip(){ vFlip=true; RENDER.vocab(); }
function vGrade(g){
  const item=vQueue[vIdx];
  grade(item.w,g);
  vSession.done++;
  if(g===1){ vSession.again++; vQueue.push(item); }   // 忘記的字這輪結束前再出現一次
  vIdx++; vFlip=false;
  if(vIdx>=vQueue.length){
    const done=vSession.done, again=vSession.again;
    vQueue=[];
    RENDER.vocab();
    $('v-vocab').insertAdjacentHTML('afterbegin',
      '<div class="card" style="text-align:center"><div class="score">🎉 完成這一輪！複習 '+done+' 次，其中 '+again+' 次按了「忘記」</div>'
      +'<div class="muted" style="margin-top:8px">明天回來時，系統會自動挑出到期的字。</div></div>');
  }else RENDER.vocab();
}
function vQuit(){ vQueue=[]; vIdx=0; vFlip=false; RENDER.vocab(); }
function vBrowse(){ vBrowseOn=!vBrowseOn; RENDER.vocab(); }

  Object.keys(ST.dayNew||{}).forEach(d=>{ if((ST.dayNew[d]||0)>0) s.add(d); });
  Object.values(ST.srs||{}).forEach(x=>{ if(x&&x.seen) s.add(x.seen); });

  return s;
}

  const set=studyDaySet();
  const t=today();
  const pad2=n=>String(n).padStart(2,'0');
  const key=dn=>cy+'-'+pad2(cm+1)+'-'+pad2(dn);
  const startWd=new Date(cy,cm,1).getDay();      // 0=週日
  const days=new Date(cy,cm+1,0).getDate();
  const wd=['日','一','二','三','四','五','六'];
  let studied=0;
  for(let i=1;i<=days;i++){ const ds=key(i); if(set.has(ds)&&ds<=t) studied++; }
  const atCurrent=(cy>now.getFullYear())||(cy===now.getFullYear()&&cm>=now.getMonth());
  let h='<div class="card"><h2 class="sec">🗓 每日打卡</h2>'
   +'<div class="hint">完成當天的文章、文法或單字複習，那一天就會亮起來。目前連續打卡 <b>'+(ST.streak||1)+'</b> 天。</div>'
   +'<div class="calhd"><button class="calnav" onclick="calShift(-1)">‹</button>'
   +'<div class="m">'+cy+' 年 '+(cm+1)+' 月 · 本月打卡 '+studied+' 天</div>'
   +'<button class="calnav" onclick="calShift(1)"'+(atCurrent?' disabled':'')+'>›</button></div>'
   +'<div class="calgrid">'+wd.map(w=>'<div class="wd">'+w+'</div>').join('');
  for(let i=0;i<startWd;i++) h+='<div class="cell empty"></div>';
  for(let i=1;i<=days;i++){
    const ds=key(i); let cls='cell'; const done=set.has(ds);
    if(done) cls+=' done';
    if(ds===t) cls+=' today'; else if(ds>t) cls+=' future';
    h+='<div class="'+cls+'">'+i+(done?'<span class="dot">✓</span>':'')+'</div>';
  }
  h+='</div>'
   +'<div class="callegend">'
   +'<span><i style="background:linear-gradient(135deg,#f7bd76,#ef9a4f)"></i>有完成</span>'
   +'<span><i style="background:#fff;border:1px solid var(--line)"></i>沒打卡</span>'
   +'<span><i style="background:#fff;border:2px solid var(--accent2)"></i>今天</span>'
   +'</div></div>';
  return h;
}

function markB(){ if(!pReady())return; loopB=ytPlayer.getCurrentTime(); if(loopA==null)loopA=0; if(loopB<=loopA)loopB=loopA+2; showLoop(); startLoop(); }
function clearLoop(){ loopA=loopB=null; stopLoop(); showLoop(); }
function startLoop(){
  stopLoop();
  if(loopA==null||loopB==null||!pReady()) return;
  ytPlayer.seekTo(loopA,true);
  if(ytPlayer.playVideo) ytPlayer.playVideo();
  loopTimer=setInterval(()=>{
    if(!pReady()||loopB==null){ stopLoop(); return; }
    if(ytPlayer.getCurrentTime()>=loopB) ytPlayer.seekTo(loopA,true);
  },250);
}
function stopLoop(){ if(loopTimer){clearInterval(loopTimer);loopTimer=null;} }
function showLoop(){
  const el=$('loop-info'); if(!el) return;
  el.textContent = (loopA==null&&loopB==null) ? '尚未設定循環區間'
    : 'A ' + (loopA==null?'—':fmt(loopA)) + ' → B ' + (loopB==null?'—':fmt(loopB)) + (loopTimer?'（循環中）':'');
}

/* 逐字稿解析：一行一句，格式「00:07 English sentence | 中文翻譯」
   時間與中文都可以省略；沒寫時間的行會接在上一行後三秒 */
function parseSubs(text){
  const out=[];
  String(text||'').split(/\r?\n/).forEach(line=>{
    let l=line.trim(); if(!l) return;
    l=l.replace(/^\[|\]$/g,'');
    let t=null;
    const m=l.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?[\s\]]*[-–]?\s*/);
    if(m){ t = m[3] ? (+m[1]*3600 + +m[2]*60 + +m[3]) : (+m[1]*60 + +m[2]); l=l.slice(m[0].length); }
    const parts=l.split(/\s*[|｜]\s*/);
    const en=(parts[0]||'').trim(); if(!en) return;
    if(t==null) t = out.length ? out[out.length-1].t+3 : 0;
    out.push({t:t, en:en, cn:(parts[1]||'').trim()});
  });
  return out;
}

      +'<span>📝 '+((v.lines||[]).length)+' 句字幕</span>'

   +'<input id="myurl" placeholder="YouTube 網址，例如 https://www.youtube.com/watch?v=…" '

   +'<input id="mytitle" placeholder="影片標題（自己看得懂就好）" '
   +'style="width:100%;margin-top:7px;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:calc(14px * var(--fs))">'
   +'<textarea id="mysubs" rows="6" placeholder="00:07 And the first thing that I always do… | 我做的第一件事…&#10;00:12 is I cook myself good food. | 就是給自己做頓好吃的。&#10;&#10;時間和中文都可以省略，一行一句就好。" '
   +'style="width:100%;margin-top:7px;padding:10px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:calc(14px * var(--fs));resize:vertical"></textarea>'

function addMyVid(){
  const err=$('myvid-err');
  const fail=m=>{ if(err){err.textContent=m;err.style.display='block';} };
  const id=ytId(($('myurl')||{}).value);
  if(!id) return fail('看不出這是 YouTube 連結，請貼完整網址（含 watch?v=…）。');
  const lines=parseSubs(($('mysubs')||{}).value);
  if(!lines.length) return fail('請至少貼一行逐字稿。');
  if(err) err.style.display='none';
  const v={id:id, title:(($('mytitle')||{}).value||'').trim()||'我的影片',
           lines:lines, addedAt:today(), addedBy:PROFILE, updatedAt:Date.now()};
  vidPut(v).then(()=>{
    const i=MYVIDS.findIndex(x=>x.id===id);
    if(i>=0) MYVIDS[i]=v; else MYVIDS.unshift(v);
    openMyVid(id);
  });
}
window.addMyVid=addMyVid;

function openMyVid(id){
  myVid=id; lsOpen=null; curLine=-1;
  RENDER.listen();
  window.scrollTo(0,0);
}
function closeMyVid(){ destroyPlayer(); myVid=null; RENDER.listen(); }
window.openMyVid=openMyVid; window.closeMyVid=closeMyVid;

function applySubToggles(){
  const box=$('sublist'); if(!box) return;
  box.classList.toggle('noen',!showEn);
  box.classList.toggle('nocn',!showCn);
  const a=$('tg-en'); if(a) a.textContent = showEn?'👁 英文：顯示':'👁 英文：隱藏';
  const b=$('tg-cn'); if(b) b.textContent = showCn?'🈶 中譯：顯示':'🈶 中譯：隱藏';
}
function tgEn(){ showEn=!showEn; applySubToggles(); }
function tgCn(){ showCn=!showCn; applySubToggles(); }
window.tgEn=tgEn; window.tgCn=tgCn;

function curVidObj(){ return MYVIDS.find(x=>x.id===myVid)||null; }
function seekLine(i){
  const v=curVidObj(); if(!v||!v.lines[i]) return;
  if(pReady()){ ytPlayer.seekTo(v.lines[i].t,true); if(ytPlayer.playVideo) ytPlayer.playVideo(); }
  setCurLine(i,false);
}
window.seekLine=seekLine;
function setCurLine(i,scroll){
  if(i===curLine) return;
  const prev=$('sl-'+curLine); if(prev) prev.classList.remove('cur');
  curLine=i;
  const el=$('sl-'+i); if(!el) return;
  el.classList.add('cur');
  if(scroll!==false) el.scrollIntoView({block:'center',behavior:'smooth'});
}
function jumpCur(){ const el=$('sl-'+curLine); if(el) el.scrollIntoView({block:'center',behavior:'smooth'}); }
window.jumpCur=jumpCur;
function startSync(){
  stopSync();
  syncTimer=setInterval(()=>{
    const v=curVidObj();
    if(!v||!pReady()){ return; }
    const t=ytPlayer.getCurrentTime();
    let idx=-1;
    for(let k=0;k<v.lines.length;k++){ if(v.lines[k].t<=t+0.25) idx=k; else break; }
    if(idx>=0) setCurLine(idx,true);
  },400);
}
function stopSync(){ if(syncTimer){clearInterval(syncTimer);syncTimer=null;} }

let noteTimer=null;
function saveNote(){
  const ta=$('vnote'); if(!ta||!myVid) return;
  if(!ST.vnotes) ST.vnotes={};
  ST.vnotes[myVid]=ta.value;
  if(noteTimer) clearTimeout(noteTimer);
  noteTimer=setTimeout(()=>save(),700);
}
window.saveNote=saveNote;

let INSTALL_EVT=null;
const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) ||
                    (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); INSTALL_EVT=e;
  if(RENDER[TAB]) RENDER[TAB]();
});
window.addEventListener('appinstalled',()=>{ INSTALL_EVT=null; if(RENDER[TAB]) RENDER[TAB](); });

function installCard(){
  return '';                                       // 依使用者要求，不再顯示安裝提示
  if(standalone()) return '';                     // 已經是 app 開啟，不用再顯示
  if(INSTALL_EVT){
    return '<button class="install" onclick="doInstall()"><b>📲 安裝成 App</b>'
      +'<span>點一下就會加到手機主畫面，之後像一般 app 一樣全螢幕開啟，離線也能讀</span></button>';
  }
  if(isIOS()){
    return '<button class="install" onclick="iosHelp()"><b>📲 加到主畫面變成 App</b>'
      +'<span>iPhone / iPad：點下方工具列的「分享」→ 往下找「加入主畫面」→ 加入。點這裡看圖示說明</span></button>';
  }
  return '<button class="install" onclick="otherHelp()"><b>📲 安裝成 App</b>'
    +'<span>Android Chrome：右上角選單 →「安裝應用程式」或「加到主畫面」。點這裡看說明</span></button>';
}
async function doInstall(){
  if(!INSTALL_EVT) return;
  INSTALL_EVT.prompt();
  try{ await INSTALL_EVT.userChoice; }catch(e){}
  INSTALL_EVT=null; if(RENDER[TAB]) RENDER[TAB]();
}
function iosHelp(){
  alert('iPhone / iPad 安裝步驟：\n\n'
   +'1. 確認你是用 Safari 開這個網站（Chrome 不行）\n'
   +'2. 點畫面最下方正中間的「分享」圖示（方形加上一個往上的箭頭）\n'
   +'3. 選單往下滑，找到「加入主畫面」\n'
   +'4. 右上角按「新增」\n\n'
   +'完成後主畫面會出現橘色的 B2 LAB 圖示，點開就是全螢幕，沒有網路也能讀已看過的內容。');
}
function otherHelp(){
  alert('安裝步驟：\n\n'
   +'Android Chrome：右上角三個點的選單 →「安裝應用程式」或「加到主畫面」\n\n'
   +'電腦版 Chrome / Edge：網址列右邊會有一個「安裝」圖示（螢幕加箭頭），點它就可以\n\n'
   +'如果都找不到，通常是瀏覽器版本較舊，直接用瀏覽器書籤也一樣能用。');
}
window.doInstall=doInstall; window.iosHelp=iosHelp; window.otherHelp=otherHelp;
