.bkvcard .pos{color:#2b7a78;font-weight:var(--fw-body);font-style:italic;font-size:var(--font-secondary)}
.bkvcard .cnw{color:var(--accent2);font-weight:var(--fw-emph);font-size:var(--font-body);margin-top:2px}
/* 課本表格：表頭一律一行、音標與片語/中文欄不在奇怪的地方斷行（表格改用橫向捲動） */
#v-book th{white-space:nowrap}
#v-book td.nw{white-space:nowrap}
/* 課本的句子中譯跟著右上角全站 🈶 中譯開關 */
#v-book .cnx{display:none}
body.cnall #v-book .cnx{display:block!important}
body.cnall #v-book th.cnx,body.cnall #v-book td.cnx{display:table-cell!important}
body.cnall #v-book span.cnx{display:inline!important}
/* ---------- desktop sidebar ---------- */
#sidebar{display:none}
#sidebar .sb-label{display:inline}
@media(min-width:769px){
  :root{--sb-w:220px}
  #sidebar{
    display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:var(--sb-w);
    background:var(--card);border-right:1px solid rgba(217,186,145,.2);z-index:45;padding-top:50px;
    overflow-y:auto;transition:width .3s cubic-bezier(.4,0,.2,1)
  }
  #sidebar .sb-brand{display:none}
  /* streak */
  #sidebar .sb-streak{
    display:flex;align-items:center;gap:8px;padding:12px 16px;font-size:13px;font-weight:700;
    color:var(--accent2);border-bottom:1px solid rgba(217,186,145,.15);background:transparent;
    overflow:hidden;white-space:nowrap
  }
  #sidebar .sb-streak .streak-icon{
    width:40px;height:40px;border-radius:50%;background:#FFF7ED;
    display:flex;align-items:center;justify-content:center;flex-shrink:0
  }
  #sidebar .sb-streak .streak-icon svg{width:20px;height:20px;color:#ea580c;fill:#ea580c}
  #sidebar .sb-streak .streak-text{overflow:hidden}
  #sidebar .sb-streak .streak-text small{display:block;font-size:11px;color:#9CA3AF;font-weight:500}
  #sidebar .sb-streak .streak-text strong{display:block;font-size:13px;color:#ea580c}
  #sidebar.collapsed .sb-streak .streak-text{width:0;opacity:0}
  /* nav */
  #sidebar .sb-nav{flex:1;padding:8px;overflow-y:auto;min-height:0}
  #sidebar .sb-nav button{
    display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:12px;
    font:inherit;font-size:14px;color:#6B7280;cursor:pointer;border-radius:12px;text-align:left;
    transition:background .15s,color .15s;appearance:none;-webkit-appearance:none;
    position:relative;overflow:hidden;white-space:nowrap
  }
  #sidebar .sb-nav button .sb-icon{width:20px;height:20px;flex-shrink:0;color:#6B7280}
  #sidebar .sb-nav button:hover{background:rgba(245,158,11,.08);color:#92400e}
  #sidebar .sb-nav button:hover .sb-icon{color:#92400e}
  #sidebar .sb-nav button.on{background:rgba(245,158,11,.12);color:#92400e;font-weight:700}
  #sidebar .sb-nav button.on .sb-icon{color:#b45309}
  #sidebar .sb-nav button:not(.on) .sb-icon{opacity:.6}
  #sidebar .sb-label{transition:opacity .2s,width .2s}
  #sidebar.collapsed .sb-label{opacity:0;width:0;overflow:hidden}
  /* tooltip on collapsed hover */
  #sidebar .sb-nav button .sb-tip{
    position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:8px;
    background:#1F2937;color:#fff;font-size:12px;font-weight:500;padding:4px 10px;border-radius:6px;
    white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:99;
    box-shadow:0 4px 12px rgba(0,0,0,.15)
  }
  #sidebar:not(.collapsed) .sb-tip{display:none}
  #sidebar.collapsed .sb-nav button:hover .sb-tip{opacity:1}
  /* toggle button */
  #sidebar .sb-toggle{
    padding:8px;border-top:1px solid rgba(217,186,145,.15)
  }
  #sidebar .sb-toggle button{
    display:flex;align-items:center;justify-content:center;width:100%;border:0;background:none;
    padding:8px;border-radius:8px;color:#9CA3AF;cursor:pointer;transition:background .15s,color .15s;
    appearance:none;-webkit-appearance:none
  }
  #sidebar .sb-toggle button:hover{background:rgba(245,158,11,.08);color:#92400e}
  #sidebar .sb-toggle button svg{width:20px;height:20px;transition:transform .3s}
  #sidebar.collapsed .sb-toggle button svg{transform:rotate(180deg)}
  nav{display:none!important}
  header{z-index:60}
  main{margin-left:var(--sb-w);transition:margin-left .3s cubic-bezier(.4,0,.2,1)}
  body.sb-col{--sb-w:64px}
  body{padding-bottom:20px}
}
/* streak badge in header (mobile) */
.hd-streak{font-size:11.5px;font-weight:800;color:#fff;background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:3px 9px;white-space:nowrap}
/* tag chips on cards */
.tag-chip{display:inline-block;font-size:var(--font-meta);font-weight:700;
  background:#f2f7f7;border:1px solid #d5e5e4;border-radius:14px;padding:2px 10px;color:#2b6b69;white-space:nowrap}
.tag-chip.gram{background:#fdf0e5;border-color:#ecd3bb;color:#8a4a12}
@media(max-width:1024px){ .tag-chip.gram{white-space:normal;overflow-wrap:anywhere;line-height:1.5;max-width:100%} }
.tag-chip.topic{background:#f0ecfb;border-color:#d6cef0;color:#5b4a86}
/* status badge on cards */
.status-badge{position:absolute;top:8px;right:10px;font-size:var(--font-meta);font-weight:var(--fw-title);
  border-radius:10px;padding:2px 8px;white-space:nowrap}
.status-badge.done{background:#eefaf1;border:1px solid #c4e5ce;color:#1f7a46}
.status-badge.prog{background:#fff7ee;border:1px solid #ecd3bb;color:var(--accent2)}
.status-badge.todo{background:#f1ede6;border:1px solid #e2dbd0;color:#8a7f72}
/* segmented control */
.seg-ctrl{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg-ctrl button{border:0;background:var(--card);padding:7px 14px;font:inherit;font-size:calc(13px * var(--fs));
  cursor:pointer;color:var(--ink2);font-weight:600;border-right:1px solid var(--line);transition:background .12s,color .12s}
.seg-ctrl button:last-child{border-right:0}
.seg-ctrl button.on{background:var(--accent);color:#fff;font-weight:700}
.seg-ctrl button:active{opacity:.85}
/* compact filter dropdown */
.filter-sel{border:1.5px solid var(--line);border-radius:10px;padding:7px 12px;font:inherit;
  font-size:calc(13px * var(--fs));color:var(--ink2);background:var(--card);cursor:pointer;margin-bottom:12px}
/* audio player bar */
.au-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.au-bar .au-main{
  display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;
  background:var(--accent);color:#fff;border:0;font-size:18px;cursor:pointer;flex-shrink:0;
  box-shadow:0 2px 8px rgba(200,100,30,.3);transition:transform .12s}
.au-bar .au-main:active{transform:scale(.92)}
.au-bar .au-main.playing{background:#2b7a78;animation:auPulse 1.6s ease-in-out infinite}
.au-bar .au-main.shadowing{background:#2b7a78;animation:auBreathe 2s ease-in-out infinite}
.au-prog-wrap{flex:1;min-width:80px;display:flex;flex-direction:column;gap:3px}
.au-prog-info{font-size:var(--font-meta);color:var(--ink2);font-weight:700;display:flex;justify-content:space-between}
.au-prog-bar{height:5px;background:#efe8dd;border-radius:4px;overflow:hidden}
.au-prog-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#d9691f);border-radius:4px;transition:width .3s;width:0}
.au-mode{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.au-mode button{border:0;background:var(--card);padding:5px 10px;font:inherit;font-size:var(--font-meta);
  cursor:pointer;color:var(--ink2);font-weight:600;border-right:1px solid var(--line)}
.au-mode button:last-child{border-right:0}
.au-mode button.on{background:var(--accent);color:#fff}
/* completion toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--card);border:1.5px solid var(--ok);border-radius:14px;padding:14px 18px;
  box-shadow:0 8px 28px rgba(30,80,50,.2);z-index:80;max-width:380px;width:calc(100% - 32px);
  text-align:center;opacity:0;transition:transform .35s ease,opacity .35s ease;pointer-events:none}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:auto}
.toast .tt{font-size:calc(16px * var(--fs));font-weight:800;color:var(--ok);margin-bottom:6px}
.toast .tb{font-size:calc(13px * var(--fs));color:var(--ink2);margin-bottom:10px}
.toast .ta{display:flex;gap:8px;justify-content:center}
@media(min-width:769px){.toast{bottom:30px}}
/* 課本日曆與搜尋 */
#bk-q,#rd-q{width:100%;margin:4px 0 12px;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;
  font:inherit;font-size:calc(14px * var(--fs))}
#v-book .cell .dot{font-size:11px;line-height:1}
#v-book .cell.done{cursor:pointer}
/* 理解問題：答案可隱藏自我測驗 */
.hideans .bkans{display:none}
/* 課本字級改由 :root 的 --font-* token 統一（原本這裡有 18 條 #v-book 覆寫，已移除） */
/* 文法解說 (1)(2)(3)：編號懸掛縮排，折行後內容對齊編號後方 */
.bknum{display:flex;gap:3px;align-items:flex-start;margin-top:2px}
.bknum .no{flex-shrink:0;font-weight:700}
/* 課本錯誤字用正紅色 */
#v-book .wrong{color:#FF0000}
/* 課文檢視（桌機）：整頁跳出 860px 主欄放寬到 1120px——橘色區塊標題、表格、卡片同寬對齊
   有側邊欄時減去 220px，避免內容被遮擋 */
@media(min-width:920px){
  #v-book.bkopen .bkbar,#v-book.bkopen .card,#v-book.bkopen .bkq,#v-book.bkopen .bkwarn,
  #v-book.bkopen .magttl,#v-book.bkopen .bkvm,#v-book.bkopen .bksub{
    width:min(1120px,calc(100vw - 44px));position:relative;left:50%;transform:translateX(-50%)
  }
}
@media(min-width:920px) and (min-width:769px){
  #v-book.bkopen .bkbar,#v-book.bkopen .card,#v-book.bkopen .bkq,#v-book.bkopen .bkwarn,
  #v-book.bkopen .magttl,#v-book.bkopen .bkvm,#v-book.bkopen .bksub{
    width:auto;max-width:calc(100vw - var(--sb-w) - 44px);left:0;transform:none;margin-left:auto;margin-right:auto
  }
}
/* 前次已學（無例句欄）：欄寬比照上方單字表 */
#v-book table.bkrev td:nth-child(1),#v-book table.bkrev th:nth-child(1){width:24%}
#v-book table.bkrev td:nth-child(2),#v-book table.bkrev th:nth-child(2){width:36%}
#v-book table.bkrev td:nth-child(3),#v-book table.bkrev th:nth-child(3){width:10%}
/* 返回鍵（課本＋閱讀共用）：標題卡上方獨立一行，不再 absolute 定位，避免被側邊欄遮擋 */
#v-book .magttl .back,#v-read .magttl .back,#v-real .magttl .back{display:inline-flex;align-items:center;gap:6px;
  margin:0 0 10px;font-size:var(--font-secondary);line-height:1;z-index:2}
#v-book .magttl .back .back-label,#v-read .magttl .back .back-label,#v-real .magttl .back .back-label{
  font-size:var(--font-secondary);font-weight:var(--fw-emph);color:var(--ink2)}
/* 課本標題卡：右側大圖示（純裝飾）＋彩色徽章 */
#v-book .magttl h2{padding-right:84px}
#v-book .magico,#v-real .magico{position:absolute;right:20px;top:16px;font-size:58px;line-height:1;
  filter:drop-shadow(3px 3px 0 rgba(43,33,24,.22))}
#v-book .magico svg{width:96px;height:96px;display:block}
#v-real .magttl{position:relative}
#v-real .magttl h2{padding-right:84px}
@media(max-width:640px){ #v-book .magico,#v-real .magico{font-size:36px;right:12px;top:12px} #v-book .magico svg{width:56px;height:56px} #v-book .magttl h2,#v-real .magttl h2{padding-right:52px} }
#v-book .sent{cursor:pointer;border-radius:4px;transition:background .15s}
#v-book .sent.reading{background:#fff2d9;box-shadow:0 0 0 2px #fff2d9}
/* 課本文章：標題加大 3pt；段落開頭不空格（與左邊界對齊） */
#v-book .bkattl{font-size:var(--font-section-title);line-height:var(--lh-title);font-weight:var(--fw-title)}
#v-book .para .en{text-indent:0}
/* 卡片內的插圖：去掉自己的白框與內距，寬度與內文完全同寬 */
.artbox.flush{background:transparent;border:0;box-shadow:none;padding:0}
/* 閱讀檢視（桌機）：整篇放寬填滿可用空間 */
@media(min-width:920px){
  #v-read.rdopen>*{width:min(1120px,calc(100vw - 44px));position:relative;left:50%;transform:translateX(-50%)}
}
@media(min-width:920px) and (min-width:769px){
  #v-read.rdopen>*{width:auto;max-width:calc(100vw - var(--sb-w) - 44px);left:0;transform:none;margin-left:auto;margin-right:auto}
}
/* 內文視圖：main 放寬，讓閱讀/課本內頁填滿 */
@media(min-width:769px){
  main:has(.rdopen),main:has(.bkopen){max-width:calc(100vw - var(--sb-w) - 28px)}
}
/* 閱讀的單字中文（詞義＋例句中譯）跟著全站中譯開關 */
body:not(.cnall) #v-read .wpitem .zh{display:none}
body:not(.cnall) #v-read .wpitem .exs .excn{display:none}
#v-book a.magbadge{background:#3b82c4}
/* ---------- 課本頁 UX 優化（2026-08 回饋） ---------- */
/* 標題不再全大寫（壓迫感重），維持原文大小寫 */
#v-book .magttl h2{text-transform:none}
/* Topics 改為膠囊標籤，可點查字義／發音 */
.topicpill{line-height:1.4;display:inline-block;background:var(--card);border:1px solid #e2d2bd;border-radius:16px;
  padding:2px 11px;margin:3px 5px 0 0;font-size:var(--font-meta);font-weight:700;color:#8a4a12;
  cursor:pointer;font-style:normal}
.topicpill:active{background:var(--accent-soft)}
.topicpill.vb{background:#eef7f2;border-color:#bfe0cd;color:#1f6b57;font-weight:700}
/* 原始 Google 文件連結：降為次要文字連結 */
#v-book a.doclink{line-height:1.4;background:var(--card);color:var(--accent2);border:1.5px solid var(--accent2);border-radius:999px;padding:4px 12px;font-weight:700;text-decoration:none;
  text-underline-offset:3px;font-size:var(--font-meta);padding:2px 4px}
/* 課本表頭：淺橘底＋深棕字，取代高彩度橘色滿版 */
#v-book th{background:var(--accent-soft);color:#8a4a12;border:1px solid var(--line);border-bottom:2px solid #eeceaa}
/* Dictionary-style Vocabulary：所有尺寸都走同一個左對齊內容流。 */
#v-book{container-type:inline-size;container-name:book;min-width:0;max-width:100%}
#v-book .bkvd,#v-book .bkvtab,#v-book .bkvrow,#v-book .bkvmeta,#v-book .bkvcell,#v-book .bkvword,#v-book .bkvipa,#v-book .bkvpos,#v-book .bkvexample,#v-book .bkvtranslation,#v-book .bkvmeaning{min-width:0;max-width:100%}
#v-book .bkvd{display:block!important;padding:0!important;max-width:1120px;margin-inline:auto;box-shadow:none}
#v-book .bkvtab{display:block;width:100%;border:0}
#v-book .bkvrow{display:block;padding:12px 16px;background:transparent}
#v-book .bkvrow:not(:last-child){border-bottom:1px solid var(--line)}
#v-book .bkvrow:hover{background:rgba(232,129,58,.035)}
#v-book .bkvmeta{display:flex;align-items:center;flex-wrap:wrap;gap:5px 12px;min-width:0}
#v-book .bkvcell{padding:0;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;word-break:break-word;height:auto;max-height:none}
#v-book .bkvword{font-weight:var(--fw-emph);font-size:var(--font-body);line-height:var(--lh-body)}
#v-book .bkvipa{font-family:var(--font-stack);font-size:var(--font-secondary);color:var(--ink2);line-height:var(--lh-secondary)}
#v-book .bkvpos{color:var(--ink2);font-size:var(--font-secondary);font-weight:var(--fw-body);font-style:italic;line-height:var(--lh-secondary)}
#v-book .bkvexample{margin-top:5px;line-height:var(--lh-body);font-size:var(--font-body);color:#4a4238}
#v-book .bkvtranslation{margin-top:3px;color:var(--ink2);font-size:var(--font-body);line-height:var(--lh-body)}
#v-book .bkvmeaning{margin-top:3px;color:#4a4238;font-size:var(--font-body);font-weight:var(--fw-emph);line-height:var(--lh-body)}
#v-book .bkvmeaning-label{display:none}
#v-book .wln{display:flex;align-items:center;gap:4px;flex-wrap:wrap;max-width:100%;min-width:0;overflow-wrap:anywhere}
#v-book .bkvtab .wln .spk{padding:2px 6px;flex:0 0 auto}
/* 桌機：單字列表改雙欄。每列只用到左邊 1/3、右邊全空，頁面被拉得很長，
   一直往下捲本身就是疲勞來源。多欄排版可保留列與分隔線的結構。 */
@container book (min-width:900px){
  #v-book .bkvtab{column-count:2;column-gap:34px;column-rule:1px solid var(--line)}
  #v-book .bkvrow{break-inside:avoid;padding:10px 14px}
}
/* 同一結構只調整小螢幕間距；不再切換成另一套 item card。 */
@container book (max-width:519px){
  #v-book .bkvrow{padding:11px 12px}
  #v-book .bkvmeta{gap:4px 9px}
  #v-book .bkvexample{margin-top:6px}
}
/* 補充字彙表：類別20% 英文50% 中文30% */
#v-book table.bkxv th:nth-child(1),#v-book table.bkxv td:nth-child(1){width:20%;white-space:normal}
#v-book table.bkxv th:nth-child(2),#v-book table.bkxv td:nth-child(2){width:50%}
#v-book table.bkxv th:nth-child(3),#v-book table.bkxv td:nth-child(3){width:30%}
/* 快速總結：重點18% 說明82% */
#v-book table.bksm th:nth-child(1),#v-book table.bksm td:nth-child(1){width:14%}
/* ☆ 生詞本收藏鈕：未收藏淡金色空星、已收藏實心金星 */
.wbb{border:0;background:none;cursor:pointer;font:inherit;font-size:calc(17px * var(--fs));
  color:#cbb787;padding:0 3px;line-height:1;vertical-align:-1px;transition:transform .12s}
.wbb.on{color:#e8a013;text-shadow:0 1px 2px rgba(180,120,10,.3)}
.wbb:active{transform:scale(1.25)}
/* ⭐ 重點單字：標準化黃色星號膠囊，放單字前面 */
.starb{display:inline-block;background:#fff5d6;border:1px solid #eed27a;border-radius:10px;
  font-size:var(--font-meta);line-height:1.5;padding:0 5px;margin-right:4px;vertical-align:2px}
/* 沒有 ⭐ 的單字補一顆隱形星佔位，單字左緣才會對齊（2026-08-29 使用者回報左側不一致）*/
.starb.ph{visibility:hidden;pointer-events:none}
/* 作業複習：原句淡紅底＋錯字劃掉、訂正淡綠底＋改對字加粗底線，一眼看出差異 */
.bkq .bkline.hwbad{background:#fdf0ef;border:1px solid #f3d5d2;border-radius:9px;padding:7px 10px}
.bkq .bkline.hwok{background:#eefaf1;border:1px solid #cfe9df;border-radius:9px;padding:7px 10px}
.bkq .bkline.hwbad>span .wrong{text-decoration:line-through;text-decoration-color:rgba(217,83,79,.6);text-decoration-thickness:2px}
.bkq .bkline.hwok>span .right{color:#1f7a46;border-bottom:2px solid #2f9e5f;font-weight:var(--fw-emph)}
/* 題號：圓圈 Badge 強化序號感 */
.qbadge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;
  border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:var(--font-meta);
  flex-shrink:0}
/* 填空練習：英文句中的答案字改成可見的空格膠囊（答案仍在中文欄），一眼看出要填哪裡 */
.bkblank{display:inline-block;min-width:58px;text-align:center;color:#B45309;font-weight:800;
  background:#FEF3C7;border:1px dashed #F0B357;border-radius:6px;padding:0 8px;margin:0 3px;
  letter-spacing:1px;line-height:1.5;vertical-align:baseline}
/* 片語通用變數（something / someone / 人 / 事）：淺灰膠囊，凸顯固定的動詞＋介系詞骨架 */
.varb{font-size:inherit;display:inline-block;background:#f0ece5;border:1px dashed #cfc4b4;border-radius:8px;
  color:#8a7f72;font-weight:var(--fw-emph);padding:0 7px;margin:0 2px;line-height:var(--lh-body)}
/* 片語卡：中文釋義推到右側對齊，視覺邊界清楚 */
.bkq>.bkline .cnR{margin-left:auto;color:var(--ink2);font-weight:400}
/* 片語／情境例句的內嵌例句：淺綠底＋左側 3px 品牌色垂直裝飾線，引導閱讀焦點 */
.bkq .bkex{background:#f3faf6;border-color:#d5e9dd;border-left:3px solid #2b7a78}
/* 例句中的片語組成部分（含介系詞）：加粗＋淺橘底色高亮 */
#v-book .bkex .een b,#v-book table .sent b{background:#fdf0e5;border-radius:4px;padding:0 3px;font-weight:var(--fw-emph);
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
/* 句型公式卡：升級為淺橘底＋深棕字的高對比底塊（不再用淡虛線框） */
#v-book .bkfml{background:linear-gradient(135deg,#fdf0e5,#fbe3cc);border:1.5px solid #eeb87a;
  border-left:5px solid var(--accent);color:#6e3a08}
/* 故事五階段：步驟流程膠囊 */
.steps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px}
.steps .stp{background:var(--card);border:1px solid #e2d2bd;border-radius:16px;padding:3px 11px;
  font-size:var(--font-meta);line-height:1.4;font-weight:var(--fw-title);color:#8a4a12}
.steps .sarr{color:#cfa269;font-weight:800}
/* 動詞三態變化形：橘色加粗；重音音節：紅色加粗＋底線 */
.vform{color:var(--accent2);font-weight:800}
.stressy{font-weight:900;color:#c0392b;text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:2px}
/* 文法重點裡的 ✅ 正確／❌ 錯誤：淺綠／淺紅底塊對比，不只靠文字顏色 */
#v-book .bkul li .right{background:#eefaf1;border-radius:6px;padding:1px 6px;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
#v-book .bkul li .wrong{background:#fdf0ef;border-radius:6px;padding:1px 6px;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
</style>
</head>

/* ============================================================
   0. 基礎工具
   ============================================================ */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const lvCls = l => l==='B1+'?'B1P':(l==='B2'?'B2':(l==='A2'?'A2':'B1'));
/* 錯誤示範自動變紅、正確示範自動變綠：
   ✗ / X / ✘ 之後到下一個中文標點或全形括號結束為止，都算「錯的那段」。 */
function mkWrong(s){
  return esc(s)
    .replace(/([✗✘Ⅹ×]|\bX(?=\s))\s*([^（）()「」。；，、,;]*)/g,
             '<span class="wrong">$1 $2</span>')
    .replace(/(✓|✔)\s*([^（）()「」。；，、,;]*)/g,
             '<span class="right">$1 $2</span>')
    .replace(/<\/span>\s*<span class="wrong">/g,
             '</span><br><span class="wrong">');
}
/* 句號之後自動換到下一行，長段解說比較好讀 */
/* 句號斷行。但後面緊接收尾標點（）)］]」』】〉》”’"'）時不斷，
   否則那個括號會被留在下一行變孤兒（2026-08-29／30 使用者兩次回報）。
   全站共用：mkText / mkTextSpk / 快速總結 / bkNote 都走這裡，只在這一處維護。 */
function brSent(s){
  return String(s==null?'':s).replace(/。(?!\s*$)(?![）)\］\]」』】〉》”’"'])/g,'。<br>');
}
/* 解說裡「用到的英文句子」自動加粗（連續 3 個以上英文字才算句子，避免粗到單一個字）。
   只處理標籤外的純文字，不會弄壞已經上色的 ✗/✓ 片段。 */
function boldEn(html){
  return String(html).split(/(<[^>]+>)/g).map(seg=>{
    if(seg.charAt(0)==='<') return seg;
    return seg.replace(/[A-Za-z][A-Za-z0-9'’\-]*(?:[ ,]+[A-Za-z0-9'’\-]+){2,}[.!?]*/g,m=>'<b>'+m+'</b>');
  }).join('');
}
/* 三者都套用：錯的變紅 + 句號換行 + 英文例句加粗 */
const mkText = s => boldEn(brSent(mkWrong(s)));
/* 加粗＋🔊 版：文法 body/bullet 裡的英文句子也能點擊朗讀。
   「不能說 / ✗」後面的錯誤示範不給發音鈕（不該讓學習者聽錯誤的句子），改標紅 */
function boldEnSpk(html){
  return String(html).split(/(<[^>]+>)/g).map(seg=>{
    if(seg.charAt(0)==='<') return seg;
    return seg.replace(/[A-Za-z][A-Za-z0-9''\-]*(?:[ ,]+[A-Za-z0-9''\-]+){2,}[.!?]*/g,(m,off,str)=>{
      const before=str.slice(Math.max(0,off-14),off);
      if(/不能說|不說|不能寫成|不可說|不可寫|別說|[✗✘×]/.test(before)) return '<b class="wrong">'+m+'</b>';
      return '<b>'+m+'</b>'+spk(m);
    });
  }).join('');
}
const mkTextSpk = s => boldEnSpk(brSent(mkWrong(s)));
/* 陷阱解析：提到「中文…」的母語干擾提醒，統一掛上「中文思維陷阱」標籤 */

/* 清單卡片左側色條跟著程度走（A2 橘 / B1 綠 / B1+ 藍 / B2 紫） */

/* ---------- 學習者 Profile（各自獨立進度，與課堂筆記站同一套） ---------- */

if(!PROFILES[PROFILE]) PROFILE='anita';
const skey = () => 'b2lab.v1.'+PROFILE;
const blank = () => ({srs:{}, artDone:{}, gramDone:{}, newPerDay:12, dayNew:{}, streak:0, lastDay:null, rate:1, fs:null, fsSet:false, listenDone:{}, vnotes:{}, wb:{}, bkSeen:{}, rw:{}, rwDone:{}, updatedAt:0});

/* ---------- 本機儲存 ---------- */
let ST=blank();
function loadLocal(){
  ST=blank();
  try{
    let raw=localStorage.getItem(skey());
    // 從舊的單一鍵值搬家（雲端同步上線前的紀錄，一律歸給 anita）
    if(!raw && PROFILE==='anita'){
      const old=localStorage.getItem('b2lab.v1');
      if(old){ raw=old; localStorage.setItem(skey(),old); localStorage.removeItem('b2lab.v1'); }
    }
    if(raw) ST=Object.assign(ST,JSON.parse(raw));

// 用「當地日期」而不是 UTC，否則台灣早上八點前會被算成前一天
function dstr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const today = () => dstr(new Date());
// 本週一的日期（週一為一週的開始）：今日分頁「過去的每日內容」只保留本週
const weekStart = () => { const d=new Date(); d.setDate(d.getDate()-((d.getDay()+6)%7)); return dstr(d); };
function touchStreak(){
  const d=today();
  if(ST.lastDay===d) return;
  const y=dstr(new Date(Date.now()-86400000));
  ST.streak = (ST.lastDay===y) ? (ST.streak||0)+1 : 1;
  ST.lastDay=d; save();
}

/* ---------- Firebase 雲端同步 ---------- */
const FB_CONFIG={

function cloudBadge(on){ const el=$('sync-badge'); if(el) el.style.display=on?'inline-block':'none'; }
function cloudPush(){
  if(!db) return;
  if(pushTimer) clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>{
    pushTimer=null;
    const d=cloudDoc(); if(!d) return;

/* 切走 app 或關掉頁面時，還沒推上雲端的進度要馬上送出去，
   否則「做完測驗就關掉」的那一筆會留在本機，另一台裝置看不到打勾 */
function cloudFlush(){
  if(!pushTimer) return;
  clearTimeout(pushTimer); pushTimer=null;
  const d=cloudDoc(); if(d) d.set(ST,{merge:true}).catch(()=>{});
}
window.addEventListener('pagehide',cloudFlush);
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ cloudFlush(); return; }
  /* 回到前景：把雲端最新進度拉下來合併（另一台裝置剛做完的也會亮打勾） */

    if(!vQueue.length && !(TAB==='listen' && (lsOpen||myVid))) RENDER[TAB] && RENDER[TAB]();

});
/* 兩邊的單字複習紀錄逐字合併，取比較新的那一筆，避免換裝置時覆蓋掉進度 */
function mergeState(remote){
  const out=Object.assign({},ST,remote);
  out.srs=Object.assign({},ST.srs||{});
  Object.keys(remote.srs||{}).forEach(w=>{
    const a=(ST.srs||{})[w], b=remote.srs[w];
    out.srs[w] = (!a || (b.seen||'')>=(a.seen||'')) ? b : a;
  });
  out.artDone=Object.assign({},remote.artDone||{},ST.artDone||{});
  out.gramDone=Object.assign({},remote.gramDone||{},ST.gramDone||{});
  out.dayNew=Object.assign({},remote.dayNew||{},ST.dayNew||{});
  out.listenDone=Object.assign({},remote.listenDone||{},ST.listenDone||{});
  out.vnotes=Object.assign({},remote.vnotes||{},ST.vnotes||{});
  /* 課本開課紀錄（每月智慧複習判斷「讀過沒」）：同一課取較新的時間戳 */
  out.bkSeen=Object.assign({},ST.bkSeen||{});
  Object.keys(remote.bkSeen||{}).forEach(id=>{
    out.bkSeen[id]=Math.max(Number((ST.bkSeen||{})[id])||0, Number(remote.bkSeen[id])||0);
  });
  /* 生詞本逐字合併：取時間戳較新的那筆（含「移除」的墓碑紀錄，跨裝置移除才不會又跑回來） */
  out.wb=Object.assign({},ST.wb||{});
  Object.keys(remote.wb||{}).forEach(w=>{
    const a=(ST.wb||{})[w], b=remote.wb[w];
    out.wb[w] = (!a || (b.t||0)>=(a.t||0)) ? b : a;
  });
  /* 實景教材與其進度：同一筆取時間戳較新的（含刪除墓碑，跨裝置刪除不會又跑回來） */
  out.rw=Object.assign({},ST.rw||{});
  Object.keys(remote.rw||{}).forEach(id=>{
    const a=(ST.rw||{})[id], b=remote.rw[id];
    out.rw[id] = (!a || (b.t||0)>=(a.t||0)) ? b : a;
  });
  out.rwDone=Object.assign({},ST.rwDone||{});
  Object.keys(remote.rwDone||{}).forEach(id=>{
    const a=(ST.rwDone||{})[id], b=remote.rwDone[id];
    out.rwDone[id] = (!a || (b.t||0)>=(a.t||0)) ? b : a;
  });
  out.streak=Math.max(ST.streak||0,remote.streak||0);
  return out;
}
function cloudPull(done){
  const d=cloudDoc(); if(!d){ done&&done(); return; }
  d.get().then(s=>{
    if(s.exists){ ST=mergeState(s.data()||{}); saveLocal(); cloudBadge(true); }
    else cloudBadge(true);
    done&&done();
  }).catch(()=>{ cloudBadge(false); done&&done(); });
}
function cloudSubscribe(){
  if(!db) return;
  if(cloudUnsub){ cloudUnsub(); cloudUnsub=null; }
  const d=cloudDoc(); if(!d) return;
  const mine=PROFILE;
  cloudUnsub=d.onSnapshot(s=>{
    if(PROFILE!==mine || !s.exists) return;
    const r=s.data()||{};
    if((r.updatedAt||0)<=(ST.updatedAt||0)) return;   // 自己剛推上去的不用理
    ST=mergeState(r); saveLocal(); cloudBadge(true);
    if(!vQueue.length && !(TAB==='listen' && (lsOpen||myVid))) RENDER[TAB] && RENDER[TAB]();   // 單字卡複習中不打斷
  },()=>cloudBadge(false));
}
function setProfile(p){

  RENDER[TAB] && RENDER[TAB]();

function updateProfileUI(){

/* ---------- 語音朗讀 (TTS) ---------- */
let VOICE=null, VOICE2=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices().filter(v=>/^en(-|_)/i.test(v.lang));
  if(!vs.length) return;
  const score=v=>{
    const n=(v.name||'').toLowerCase();
    let s=0;
    if(/en[-_]us/i.test(v.lang)) s+=4;
    if(!v.localService) s+=6;
    if(/premium/.test(n)) s+=14;
    if(/enhanced/.test(n)) s+=12;
    if(/\bnatural\b/.test(n)) s+=11;
    if(/\bneural\b/.test(n)) s+=11;
    if(/\bonline\b/.test(n)) s+=10;
    if(/siri/.test(n)) s+=7;
    if(/ava|zoe|samantha|joelle|flo|grandma|reed|rocko|sandy/.test(n)) s+=5;
    if(/allison|nicky|aria|jenny|evan|nathan|guy/.test(n)) s+=3;
    if(/google us english/.test(n)) s+=3;
    if(/compact|legacy/.test(n)) s-=8;
    if(n.length<10 && !/siri|ava|zoe|flo|guy/.test(n)) s-=2;
    return s;
  };
  const ranked=vs.slice().sort((a,b)=>score(b)-score(a));
  VOICE=ranked[0];
  VOICE2=ranked.length>1?ranked[1]:null;
}
pickVoice();
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged=function(){ pickVoice(); if(typeof auApplyVoices==='function'&&auLines.length){ auApplyVoices(); auFillVoices(); } };
/* Chrome 的語音清單更新後，舊的 voice 物件會「無聲失敗」（不報錯、直接沒聲音）。
   朗讀前先確認選到的語音還在清單裡；不在就重挑，再不行就交給瀏覽器預設語音。 */
function voiceAlive(v){
  if(!v) return null;
  const vs=speechSynthesis.getVoices();
  return vs.indexOf(v)>=0 ? v : (vs.find(x=>x.name===v.name&&x.lang===v.lang)||null);
}
function say(text,rate,onend,voice){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const t=String(text).replace(/\s+/g,' ').trim();
  const base=rate||ST.rate||1;
  const isQ=/\?\s*$/.test(t), isEx=/!\s*$/.test(t);
  let v=voiceAlive(voice||VOICE);
  if((voice||VOICE)&&!v){ pickVoice(); v=voiceAlive(voice)||VOICE; }
  const sents=t.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[t];
  if(sents.length<=1){
    const u=new SpeechSynthesisUtterance(t);
    u.lang='en-US';
    u.rate=isQ?base*1.02:base*0.96;
    u.pitch=isQ?1.08:isEx?1.02:0.97;
    if(v) u.voice=v;
    if(onend){u.onend=onend;u.onerror=onend;}
    speechSynthesis.speak(u);
  }else{
    sents.forEach((s,i)=>{
      const u=new SpeechSynthesisUtterance(s.trim());
      u.lang='en-US';
      const sq=/\?$/.test(s.trim()), last=i===sents.length-1;
      u.rate=last?base*0.93:sq?base*1.02:base*(0.96+i%2*0.04);
      u.pitch=sq?1.10:last?0.94:1.0+((i%3)-1)*0.05;
      if(v) u.voice=v;
      if(last&&onend){u.onend=onend;u.onerror=onend;}
      speechSynthesis.speak(u);
    });
  }
  /* 引擎有時會卡在 paused 狀態（cancel 的時機不巧就會發生），推它一下 */
  if(speechSynthesis.paused) speechSynthesis.resume();
  setTimeout(()=>{ if(speechSynthesis.paused) speechSynthesis.resume(); },150);
}
window.say=say;
/* 點整句就朗讀那一句，並在朗讀時把那一句高亮起來 */
function saySent(el){
  const sent=el&&el.closest?el.closest('.sent'):el; if(!sent) return;
  document.querySelectorAll('.sent.reading').forEach(x=>x.classList.remove('reading'));
  sent.classList.add('reading');
  say(sent.dataset.t, null, ()=>{ sent.classList.remove('reading'); });
}
window.saySent=saySent;
/* 所有 🔊 按鈕共用：朗讀該句，並把「喇叭前的那段文字」反黃（唸完自動恢復）。
   反黃只貼著文字、到句子最後一個字／句點為止，不是整條區塊；
   做法：第一次點擊時把喇叭鈕之前的節點包進行內 span.spktxt，之後反黃這個 span。 */
function spkGo(btn){
  const box=btn.closest('.exs,.wpline,.u2,.good,.een,.qt,.opt,.kl,.ycd,.trans-line,.gline,li')||btn.parentElement;
  let t=null;
  if(box){
    t=box.querySelector(':scope > .spktxt');
    if(!t && box.contains(btn)){
      t=document.createElement('span'); t.className='spktxt';
      while(box.firstChild && box.firstChild!==btn) t.appendChild(box.firstChild);
      box.insertBefore(t,btn);
    }
  }
  const hl=t||box;
  document.querySelectorAll('.spkon').forEach(x=>x.classList.remove('spkon'));
  if(hl) hl.classList.add('spkon');
  const spv=(btn.dataset.sp&&typeof auSpMap!=='undefined')?auSpMap[btn.dataset.sp]:null;
  say(btn.dataset.t, null, ()=>{ if(hl) hl.classList.remove('spkon'); }, spv||undefined);
}
window.spkGo=spkGo;
function spk(text,label){
  return '<button class="spk" onclick="spkGo(this);event.stopPropagation()" data-t="'+esc(text)+'">🔊'+(label?' '+label:'')+'</button>';
}
/* 把一段文字切成一句一句（保留句尾標點）。
   縮寫（a. m. / p.m. / Mr. / U.S. 等）後面的句點不能當斷句，
   否則朗讀會把一句唸成好幾段，跟畫面上的內容對不起來。 */
const ABBR_END=/(?:^|[\s(（"'“‘])(?:[A-Za-z]|Mr|Mrs|Ms|Dr|St|vs|etc|e\.g|i\.e|a\.m|p\.m|U\.S|U\.K)\.["'”’)\]]*$/;
function splitSentences(text){
  const s=String(text||'').trim();
  const m=s.match(/[^.!?]+[.!?]+["'”’)\]]*\s*|[^.!?]+$/g);
  if(!m) return s?[s]:[];
  const out=[];
  m.map(x=>x.trim()).filter(Boolean).forEach(x=>{
    const prev=out[out.length-1];
    const startsLower=/^[a-z]/.test(x);
    const tiny=/^[A-Za-z]\.["'”’)\]]*$/.test(x);
    if(prev && ABBR_END.test(prev) && (startsLower||tiny)) out[out.length-1]=prev+' '+x;
    else out.push(x);
  });
  return out;
}

// 簡易還原詞形，讓 studies / studied / studying 都查得到
function lookup(raw){
  // 空格要保留，weather bureau 這類片語才查得到（片語在字庫裡就是含空格的 key）
  const w=String(raw).toLowerCase().replace(/[^a-z'\- ]/g,'').replace(/\s+/g,' ').trim();
  if(!w) return null;
  const tries=[w];
  if(w.endsWith("'s")) tries.push(w.slice(0,-2));
  if(w.endsWith('ies')) tries.push(w.slice(0,-3)+'y');
  if(w.endsWith('es')) tries.push(w.slice(0,-2),w.slice(0,-1));
  if(w.endsWith('s')) tries.push(w.slice(0,-1));
  if(w.endsWith('ed')) tries.push(w.slice(0,-2),w.slice(0,-1),w.slice(0,-2)+'e');
  if(w.endsWith('ing')) tries.push(w.slice(0,-3),w.slice(0,-3)+'e');
  if(w.endsWith('ily')) tries.push(w.slice(0,-3)+'y');
  if(w.endsWith('ly')) tries.push(w.slice(0,-2));
  if(w.endsWith('er')) tries.push(w.slice(0,-2),w.slice(0,-1));
  if(w.endsWith('est')) tries.push(w.slice(0,-3));
  if(/(.)\1(ed|ing)$/.test(w)) tries.push(w.replace(/(.)\1(ed|ing)$/,'$1'));
  for(const t of tries) if(GLOSS[t]) return GLOSS[t];
  return null;
}

// 把英文段落切成可點擊的單字
function tokenize(text,hiSet){
  return String(text).replace(/[A-Za-z][A-Za-z'’\-]*/g, m=>{
    const bare=m.toLowerCase().replace(/[^a-z'’-]/g,'');
    const hi = hiSet && (hiSet.has(bare) || hiSet.has(bare.replace(/s$/,''))) ? ' class="hi"' : '';

    return '<w'+hi+' onclick="showGloss(this.textContent);event.stopPropagation()">'+esc(m)+'</w>';
  });
}

const reEsc = s => String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

/* 文章插圖／圖表（來自 data-art.js，全部是本站自己畫的 SVG）。
   圖說若是「A=… → B=… → C=…」的圖示對照鏈，改成編號步驟膠囊，比擠成一段好讀 */
/* 每日文章「五圓圖示帶」：在五個圓之間補順序箭頭（配色維持各圖原本的調色盤，
   箭頭自動取該圖裡最鮮豔的主色）。只處理「800×200 且恰好五個圓」的模板圖，
   其他圖表（長條圖等）不動 */
function artNormSVG(svg){
  const s=String(svg||'');
  if(!/viewBox="0 0 800 200"/.test(s)) return s;
  if((s.match(/translate\(\d+,52\) scale\(1\.5\)/g)||[]).length!==5) return s;
  /* 箭頭顏色＝圖裡「最常用的鮮豔主色」（飽和度×出現次數加權），跟該圖調色盤一致 */
  let acc='#8a7a66', best=0;
  const cnt={};
  (s.match(/#[0-9a-fA-F]{6}\b/g)||[]).forEach(hex=>{ cnt[hex]=(cnt[hex]||0)+1; });
  Object.keys(cnt).forEach(hex=>{
    const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
    const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
    const lum=(0.299*r+0.587*g+0.114*b)/255, sat=mx?(mx-mn)/mx:0;
    const score=(lum>0.2&&lum<0.75&&sat>0.3)?sat*cnt[hex]:0;
    if(score>best){ best=score; acc=hex; }
  });
  const arrows=[140,294,448,602].map(x0=>{
    const x1=x0+12, x2=x0+46;
    return '<path d="M'+x1+' 100 H'+x2+' M'+x2+' 100 l-9 -7 M'+x2+' 100 l-9 7"/>';
  }).join('');
  return s.replace('</svg>','<g fill="none" stroke="'+acc+'" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".8">'+arrows+'</g></svg>');
}

/* 升級句 vs 原句：把 B2 句裡「B1 句沒有的字」上底色，一眼看出升級了哪裡。
   兩句幾乎整句不同時（差異字超過七成）就不標，整句都是底色反而沒有重點 */
function upDiff(b1,b2){
  const has=new Set(String(b1||'').toLowerCase().match(/[a-z'’]+/g)||[]);
  const words=String(b2||'').match(/[A-Za-z][A-Za-z'’]*/g)||[];
  const nDiff=words.filter(w=>!has.has(w.toLowerCase())).length;
  if(!words.length || nDiff/words.length>0.7) return esc(b2);
  return String(b2||'').split(/([A-Za-z][A-Za-z'’]*)/g).map((t,i)=>
    i%2 ? (has.has(t.toLowerCase())?esc(t):'<mark class="udiff">'+esc(t)+'</mark>') : esc(t)
  ).join('');
}

/* 內文重點字：橘色加粗＋上標編號（只標第一次出現），其餘字照樣可點查 */
function magTokenize(text,tmap,used){
  if(!tmap||!tmap.keys.length) return tokenize(text,null);
  const re=new RegExp('\\b('+tmap.keys.map(reEsc).join('|')+')(s|es|ed|ing|d)?\\b','ig');
  let out='',last=0,m;
  while((m=re.exec(text))){
    const key=m[1].toLowerCase();
    const n=tmap.num[key];
    if(!n||used.has(key)) continue;
    used.add(key);
    out+=tokenize(text.slice(last,m.index),null);
    out+='<b>'+tokenize(m[0],null).replace(/<w/g,'<w class="tgt"')+'<sup class="tno">'+n+'</sup></b>';
    last=m.index+m[0].length;
  }
  return out+tokenize(text.slice(last),null);
}
/* 閱讀內文專用：一般字只當純文字（點了不跳字卡，交給整句朗讀）；
   只有橘色重點字保留點擊查詢＋單獨發音，並擋掉冒泡避免同時朗讀整句 */
function magTokenizeRead(text,tmap,used){
  if(!tmap||!tmap.keys.length) return esc(text);
  const re=new RegExp('\\b('+tmap.keys.map(reEsc).join('|')+')(s|es|ed|ing|d)?\\b','ig');
  let out='',last=0,m;
  while((m=re.exec(text))){
    const key=m[1].toLowerCase();
    const n=tmap.num[key];
    if(!n||used.has(key)) continue;
    used.add(key);
    out+=esc(text.slice(last,m.index));
    out+='<b><w class="tgt" onclick="showGloss(this.textContent);wpFlash('+n+');event.stopPropagation()">'+esc(m[0])+'</w><sup class="tno">'+n+'</sup></b>';
    last=m.index+m[0].length;
  }
  return out+esc(text.slice(last));
}

/* 補充詞彙：文章裡出現、又在課堂字庫裡、但不是本篇重點字的字 */
function extraWords(a,tgtSet){
  const seen=new Set(), out=[];
  const text=a.paras.map(p=>p.en).join(' ');
  (text.match(/[A-Za-z][A-Za-z'-]*/g)||[]).forEach(raw=>{
    if(out.length>=10) return;
    const g=lookup(raw); if(!g) return;
    const k=g.w.toLowerCase();
    if(seen.has(k)||tgtSet.has(k)) return;
    if(g.w.length<5) return;             // 太簡單的字不列
    seen.add(k); out.push(g);
  });
  return out;
}

/* 把字尾變化套到干擾選項上：句子挖的是 prepares，選項就全部給三單形，
   不讓學員光靠「有沒有加 -s」就用文法排除掉干擾項 */
function applySuf(w,suf){
  if(!suf) return w;
  if(suf==='s'||suf==='es'){
    if(/[^aeiou]y$/.test(w)) return w.slice(0,-1)+'ies';
    if(/(s|sh|ch|x|o)$/.test(w)) return w+'es';
    return w+'s';
  }
  if(suf==='d'||suf==='ed'){
    if(/e$/.test(w)) return w+'d';
    if(/[^aeiou]y$/.test(w)) return w.slice(0,-1)+'ied';
    return w+'ed';
  }
  if(suf==='ing'){
    if(/ie$/.test(w)) return w.slice(0,-2)+'ying';
    if(/e$/.test(w)&&!/ee$/.test(w)) return w.slice(0,-1)+'ing';
    return w+'ing';
  }
  return w+suf;
}

/* You Can Do This：用文章自己的句子挖空，選項取自本篇其他重點字 */
function buildYCD(a,tgIn){
  const tg=(tgIn||a.target||[]).filter(t=>/^[A-Za-z][A-Za-z' -]*$/.test(t.w));
  if(tg.length<3) return [];
  const sents=[];
  a.paras.forEach(p=>String(p.en).split(/(?<=[.!?])\s+/).forEach(s=>{ if(s.trim()) sents.push(s.trim()); }));
  const out=[], usedSent=new Set();
  for(const t of tg){
    if(out.length>=3) break;
    const re=new RegExp('\\b'+reEsc(t.w)+'(s|es|ed|ing|d)?\\b','i');
    // 每一題用不同的句子，同一句不出兩次
    const s=sents.find(x=>re.test(x)&&!usedSent.has(x));
    if(!s) continue;
    usedSent.add(s);
    const mm=s.match(re); if(!mm) continue;
    const form=mm[0], suf=mm[1]||'';
    const others=tg.filter(x=>x.w!==t.w && x.pos===t.pos);
    const cand=(others.length>=2?others:tg.filter(x=>x.w!==t.w));
    if(cand.length<2) continue;
    /* 干擾項每題輪換起點，避免三題都是同一組選項、寫到第三題只剩消去法；
       選項套用跟挖空處相同的字尾變化，不讓「有沒有加 -s」洩題 */
    const rot=out.length%cand.length;
    const pool=cand.slice(rot).concat(cand.slice(0,rot)).slice(0,2);
    /* 詞性相同（或名詞的複數 -s）才套字尾，避免造出 quiets 這種怪字；
       全部轉小寫再排序：挖空字在句首時大寫會直接洩題 */
    const inf=x=>(x.pos===t.pos||(suf==='s'&&/^n/.test(x.pos||'')))?applySuf(x.w,suf):x.w;
    const opts=[form,inf(pool[0]),inf(pool[1])].map(w=>w.toLowerCase()).sort();
    out.push({sent:s.replace(re,'\u0000'), form:form, ans:form.toLowerCase(), opts:opts, cn:t.cn, i:out.length});
  }
  return out;
}

function readerHTML(a){
  // 課堂筆記文章沒有 target，就用它的 highlightWords 去字庫組出單字片語欄
  let tg=a.target||[];
  if(!tg.length&&(a.hi||[]).length){
    const seen=new Set();
    tg=(a.hi||[]).map(w=>{
      const g=lookup(w); if(!g) return null;
      const k=g.w.toLowerCase(); if(seen.has(k)) return null; seen.add(k);
      return {w:g.w,ipa:g.ipa||'',pos:g.pos||'',cn:g.cn||'',def:g.def||'',ex:g.exEn||''};
    }).filter(Boolean);
  }
  // 編號照內文出現的順序排（跟雜誌一樣 1、2、3…），沒出現在內文的排到後面
  const tmap={keys:tg.map(t=>t.w).sort((x,y)=>y.length-x.length), num:{}};
  if(tg.length){
    const full=a.paras.map(p=>p.en).join('\n');
    const re=new RegExp('\\b('+tmap.keys.map(reEsc).join('|')+')(s|es|ed|ing|d)?\\b','ig');
    const order=[], seenK=new Set(); let mm;
    while((mm=re.exec(full))){
      const k=mm[1].toLowerCase();
      if(!seenK.has(k)){ seenK.add(k); order.push(k); }
    }
    tg=tg.slice().sort((x,y)=>{
      const ix=order.indexOf(x.w.toLowerCase()), iy=order.indexOf(y.w.toLowerCase());
      return (ix<0?9999:ix)-(iy<0?9999:iy);
    });
  }
  tg.forEach((t,i)=>{ tmap.num[t.w.toLowerCase()]=i+1; });
  const tgtSet=new Set(tg.map(t=>t.w.toLowerCase()));
  const used=new Set();
  YCD=buildYCD(a,tg);
  const extras=extraWords(a,tgtSet);

  /* 標題卡只留標題＋基本標籤；導讀與文法重點收進可展開的提示區，資訊不再擠成一團 */
  let h='<div class="magttl"><button class="back" onclick="rdClose()"><span class="back-label">返回閱讀</span></button>'
   +'<h2>'+esc(a.title)+'</h2>'
   +'<div class="cn">'+esc(a.titleCn)+'</div>'
   +'<div class="bar"><span class="lv '+lvCls(a.level)+'">'+esc(a.level)+'</span>'
   +'<span class="magbadge">🏷 '+esc(a.topic)+'</span>'
   +'<span class="magbadge">'+wordsMeta(a.words)+'</span>'
   +(a.date?'<span class="magbadge">📅 '+esc(a.date)+'</span>':'')
   +'</div>'
   +(a.source?'<div class="set" style="font-style:normal;font-size:var(--font-meta)">'+esc(a.source)
      +(a.sourceUrl?' · <a href="'+esc(a.sourceUrl)+'" target="_blank" rel="noopener">↗ 看新聞原文</a>':'')+'</div>':'')
   +'</div>';
  if(a.intro||a.focus){
    h+='<details class="hint-toggle"><summary class="hint-sum">📌 導讀與文法重點</summary><div class="hint">'
     +(a.intro?'<div>'+esc(a.intro)+'</div>':'')
     +(a.focus?'<div'+(a.intro?' style="margin-top:7px"':'')+'>📐 <b>文法重點：</b>'+esc(a.focus)+'</div>':'')
     +'</div></details>';
  }

  h+='<div class="mag">';

  /* 左欄：內文 */
  h+='<div><div class="card">'
   +'<div class="row" style="margin-bottom:11px;align-items:center">'
   +'<button class="btn ghost sm" id="btn-cn-show" onclick="cnAll(1)">顯示全部中譯</button>'
   +'<button class="btn gray sm" id="btn-cn-hide" onclick="cnAll(0)">隱藏中譯</button>'
   +'<button class="btn ghost sm" id="btn-readall" onclick="readAll()">🔊 朗讀全文</button>'
   +'<button class="btn ghost sm" id="btn-rate" onclick="cycleRate()" title="切換朗讀語速">⏱ '+(Number(ST.rate)||1)+'x</button>'
   +'<button class="spk" style="margin-left:auto" onclick="togHintBox(this)">💡 說明 ▼</button></div>'
   +'<div class="hint" style="display:none">💡 點<b>任何一句</b>就會<b>朗讀那一句</b>（那句會亮起來）；<b style="color:#c0561a">橘色加粗＋編號</b>的字對應右邊的單字片語；整段一起唸用各段下方「🔊 整段」。</div>'
   + artHTML(a.id)
   +'<div id="paras">'+a.paras.map((p,i)=>{
      const enHtml=splitSentences(p.en).map(s=>
        '<span class="sent" title="點這句朗讀" onclick="saySent(this)" data-t="'+esc(s)+'">'+magTokenizeRead(s,tmap,used)+'</span>'
      ).join(' ');
      return '<div class="para" id="p'+i+'"><div class="en">'+enHtml+'</div>'
     +'<div class="pbar"><button class="spk" id="pab'+i+'" onclick="readPara('+i+')">🔊 整段</button><button class="spk" id="cnb'+i+'" onclick="togCn('+i+')">中譯</button></div>'
     +'<div class="cn">'+esc(p.cn)+'</div></div>';
    }).join('')
   +'</div>'
   +'</div></div>';

  /* 右欄：Words & Phrases + 補充詞彙 + You Can Do This */

/* 朗讀全文：一句一句唸，唸到哪一句就把那一句反黃並捲進畫面 */
let readSeq=null;
function readAll(){
  if(!rdOpen) return;
  if(readSeq){ stopReadAll(); return; }          // 再按一次＝停止
  const sents=[].slice.call(document.querySelectorAll('#paras .sent'));
  if(!sents.length){ say(rdOpen.paras.map(p=>p.en).join(' ')); return; }
  const btn=$('btn-readall'); if(btn){ btn.textContent='⏹ 停止朗讀'; btn.classList.add('on','stopbtn'); }
  readSeq={i:0, list:sents};
  stepRead();
}
function stepRead(){
  if(!readSeq) return;
  document.querySelectorAll('#paras .sent.reading').forEach(x=>x.classList.remove('reading'));
  if(readSeq.i>=readSeq.list.length){ stopReadAll(); return; }
  const el=readSeq.list[readSeq.i];
  el.classList.add('reading');
  el.scrollIntoView({block:'center',behavior:'smooth'});
  /* cancel 之後馬上 speak 在 iOS 會偶爾掉句（音訊跟畫面對不上），隔一小拍再唸 */
  const seq=readSeq; let moved=false;
  const next=function(){ if(moved||readSeq!==seq) return; moved=true; if(seq.wd) clearTimeout(seq.wd); seq.i++; stepRead(); };
  const words=String(el.dataset.t||'').split(/\s+/).filter(Boolean).length;
  setTimeout(function(){
    if(readSeq!==seq) return;
    say(el.dataset.t, null, next);
    seq.wd=setTimeout(next, Math.max(1800, words*430/(ST.rate||1))+2600);
  },80);
}
/* 整段朗讀：跟朗讀全文一樣逐句唸、唸到哪句反黃到哪句，只是範圍限定在這一段 */

  readSeq={i:0, list:sents, p:i};

}

let QSTATE={};

/* 三種測驗共用：art=文章、gram=文法單元、listen=聽力課 */
function qsOf(ns){ return ns==='art' ? (rdOpen&&rdOpen.questions)||[] : ns==='listen' ? (lsOpen&&lsOpen.questions)||[] : (CURG&&CURG.quiz)||[]; }
function scoreBoxId(ns){ return ns==='art'?'quizScore':ns==='listen'?'lsquizScore':'gquizScore'; }
function pick(ns,i,j,ans){
  const key=ns+'-'+i;
  if(QSTATE[key]!=null) return;
  QSTATE[key]=(j===ans);
  const q=qsOf(ns)[i];
  const nOpts=q.opts.length;
  for(let k=0;k<nOpts;k++){
    const b=$('o-'+ns+'-'+i+'-'+k); if(!b) continue;
    if(k===ans) b.classList.add('right');
    else if(k===j) b.classList.add('wrong');
    b.disabled=true;
  }
  const eb=$('e-'+ns+'-'+i);
  /* 選錯且該選項有針對性提示：把「為什麼這個選項錯」放在解析最前面 */
  if(j!==ans && q.optExpl && q.optExpl[j] && !eb.dataset.hinted){
    eb.dataset.hinted='1';
    eb.innerHTML='<div class="ohint">'+esc(q.optExpl[j])+'</div>'+eb.innerHTML;
  }
  eb.classList.add('on');
  const qs=qsOf(ns);
  const done=qs.filter((_,x)=>QSTATE[ns+'-'+x]!=null).length;
  if(done===qs.length){
    const c=qs.filter((_,x)=>QSTATE[ns+'-'+x]===true).length;
    const box=$(scoreBoxId(ns));
    if(box) box.innerHTML='<div class="score">'+(c===qs.length?'🎉 全對！':'成績')+' '+c+' / '+qs.length+'（'+Math.round(c/qs.length*100)+'%）</div>';
    if(ns==='art'&&rdOpen){ ST.artDone[rdOpen.id]={correct:c,total:qs.length,date:today()}; save(); }
    if(ns==='gram'&&CURG){ ST.gramDone[CURG.id]={correct:c,total:qs.length,date:today()}; save(); }
    if(ns==='listen'&&lsOpen){ if(!ST.listenDone)ST.listenDone={}; ST.listenDone[lsOpen.id]={correct:c,total:qs.length,date:today()}; save(); }
    showToast(c===qs.length?'🎉 全對！太棒了！':'完成測驗 '+c+'/'+qs.length,
      ns==='art'?'閱讀理解完成':ns==='listen'?'聽力測驗完成':'文法練習完成',
      ns==='art'?[{label:'複習單字卡 ›',fn:'goReview()'}]
        :ns==='listen'?[{label:'回列表 ›',fn:'lsClose()'}]
        :[]);
  }
}

/* ============================================================
   5. 單字卡 + 間隔複習 (SM-2 簡化版)
   ============================================================ */
const CATS={daily:'日常生活',workplace:'職場',health:'健康身體',learning:'學習',food:'食物'};
/* 同一個字在不同課的筆記裡可能重複出現，單字卡要去重，
   否則同一輪複習會一直跳出同一個字（保留欄位最完整的那一筆）。 */
const VOCAB=(function(){
  const score=v=>['ipa','pos','cn','def','exEn','exCn','src'].reduce((n,k)=>n+(v[k]?1:0),0);
  const best={};
  (NOTES.vocab||[]).filter(v=>v&&v.w).forEach(v=>{
    const k=String(v.w).toLowerCase().trim();
    if(!best[k] || score(v)>score(best[k])) best[k]=v;
  });
  return Object.values(best);
})();
function srs(w){ return ST.srs[w] || null; }
function isDue(w){ const s=srs(w); return s && s.due<=today(); }
function isNew(w){ return !srs(w); }
function buildQueue(cat){
  const pool=VOCAB.filter(v=>cat==='all'||v.cat===cat);
  const due=pool.filter(v=>isDue(v.w));
  const fresh=pool.filter(v=>isNew(v.w));
  const d=today();
  const usedNew=(ST.dayNew[d]||0);
  const allow=Math.max(0,(ST.newPerDay||12)-usedNew);
  return {due, fresh:fresh.slice(0,allow), freshTotal:fresh.length, allow};
}
function grade(w,g){
  // g: 1 忘記 / 2 有點難 / 3 記得 / 4 很簡單
  let s=srs(w)||{ease:2.5,int:0,reps:0,lapse:0};
  const wasNew=!srs(w);
  if(g===1){ s.lapse++; s.reps=0; s.int=0; s.ease=Math.max(1.3,s.ease-0.2); }
  else{
    s.reps++;
    if(g===2){ s.ease=Math.max(1.3,s.ease-0.15); s.int = s.reps===1?1:Math.max(1,Math.round(s.int*1.2)); }
    else if(g===3){ s.int = s.reps===1?1:(s.reps===2?3:Math.round(s.int*s.ease)); }
    else { s.ease=Math.min(3.0,s.ease+0.1); s.int = s.reps===1?3:(s.reps===2?6:Math.round(s.int*s.ease*1.25)); }
  }
  s.int=Math.min(s.int,365);
  const days = g===1 ? 0 : s.int;
  s.due=dstr(new Date(Date.now()+days*86400000));
  s.seen=today();
  ST.srs[w]=s;
  if(wasNew){ const d=today(); ST.dayNew[d]=(ST.dayNew[d]||0)+1; }
  save();
}

let vCat='all', vQueue=[], vIdx=0, vFlip=false, vSession={done:0,again:0};
RENDER.vocab=function(){
  const v=$('v-vocab');

      +'<div class="stats"><div class="stat"><b>'+VOCAB.length+'</b><span>課堂總單字</span></div>'
      +'<div class="stat"><b>'+learned+'</b><span>已開始學</span></div>'

      +'<div class="stat"><b>'+(ST.streak||1)+'</b><span>連續天數</span></div></div>'
      +'<div class="chips" style="margin-top:14px"><button class="chip'+(vCat==='all'?' on':'')+'" onclick="vSet(\'all\')">全部 '+VOCAB.length+'</button>'
      + Object.keys(CATS).map(c=>'<button class="chip'+(vCat===c?' on':'')+'" onclick="vSet(\''+c+'\')">'+CATS[c]+' '+counts[c]+'</button>').join('')+'</div>'
      +'<div class="muted">這一輪：該複習 '+q.due.length+' 個 · 新字 '+q.fresh.length+' 個'
      +(q.freshTotal>q.fresh.length?'（今日新字額度剩 '+q.allow+'，尚有 '+q.freshTotal+' 個未學）':'')+'</div>'
      +'<div style="margin-top:12px" class="row"><button class="btn" onclick="vStart()"'+((q.due.length+q.fresh.length)?'':' disabled')+'>開始複習 '+(q.due.length+q.fresh.length)+' 張</button>'
      +'<button class="btn ghost" onclick="vBrowse()">瀏覽全部單字</button></div>'
      +((q.due.length+q.fresh.length)?'':'<div class="muted" style="margin-top:9px">✅ 這個分類今天沒有要複習的字了。可以調整每日新字上限：'
        +'<button class="chip" onclick="vNewLimit(12)">12</button><button class="chip" onclick="vNewLimit(20)">20</button><button class="chip" onclick="vNewLimit(30)">30</button></div>')
      +'</div>'
      + wbCard()
      + (vBrowseOn?browseHTML():'');
    return;
  }
  // 卡片模式
  const item=vQueue[vIdx];
  const w=item.w, s=srs(w);
  const pct=Math.round(vIdx/vQueue.length*100);
  v.innerHTML='<div class="card">'
    +'<div class="row" style="justify-content:space-between"><span class="muted">'+(vIdx+1)+' / '+vQueue.length+(isNew(w)?' · 🆕 新字':(s?' · 第 '+(s.reps+1)+' 次':''))+'</span>'
    +'<button class="spk" onclick="vQuit()" style="font-size:var(--font-meta)">結束</button></div>'
    +'<div class="pbwrap"><div class="pbfill" style="width:'+pct+'%"></div></div>'
    +'<div class="fc" onclick="vDoFlip()">'
    +'<div class="fw">'+esc(w)+'</div>'
    +'<div class="fi">'+esc(item.ipa||'')+'</div>'
    +'<div class="fp">'+esc(item.pos||'')+'</div>'
    +'<div style="margin-top:8px">'+spk(w,'發音')+'</div>'
    +(vFlip?
       '<div class="fcn">'+esc(item.cn||'')+'</div>'
       +(item.def?'<div class="fd">'+esc(item.def)+'</div>':'')
       +(item.exEn?'<div class="fx"><b>'+esc(item.exEn)+'</b> '+spk(item.exEn)+'<div class="cn">'+esc(item.exCn||'')+'</div></div>':'')
       +'<div class="fsrc">📓 '+esc((NOTES.sources||{})[w]||'課堂筆記')+'</div>'
      : '<div class="muted" style="margin-top:16px">先想一下中文意思，再點卡片翻開 👆</div>')
    +'</div>'
    +(vFlip?
      '<div class="grade">'
      +'<button class="g1" onclick="vGrade(1)">忘記<small>今天再看</small></button>'
      +'<button class="g2" onclick="vGrade(2)">有點難<small>明天</small></button>'
      +'<button class="g3" onclick="vGrade(3)">記得<small>幾天後</small></button>'
      +'<button class="g4" onclick="vGrade(4)">很簡單<small>更久</small></button>'
      +'</div>'
      : '<div class="flipbar"><button class="btn" onclick="vDoFlip()">翻開答案</button></div>')
    +'</div>';
};
let vBrowseOn=false;
function vSet(c){ vCat=c; RENDER.vocab(); }
function vNewLimit(n){ ST.newPerDay=n; save(); RENDER.vocab(); }
function vStart(){
  const q=buildQueue(vCat);
  vQueue=q.due.concat(q.fresh);
  // 洗牌（不使用固定順序，避免每次都同一批先出現）
  for(let i=vQueue.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=vQueue[i]; vQueue[i]=vQueue[j]; vQueue[j]=t; }
  vIdx=0; vFlip=false; vSession={done:0,again:0}; RENDER.vocab();
}
function vDoFlip(){ vFlip=true; RENDER.vocab(); }
function vGrade(g){
  const item=vQueue[vIdx];
  grade(item.w,g);
  vSession.done++;
  if(g===1){ vSession.again++; vQueue.push(item); }   // 忘記的字這輪結束前再出現一次
  vIdx++; vFlip=false;
  if(vIdx>=vQueue.length){
    const done=vSession.done, again=vSession.again;

  const k=wbKey(w); if(!k) return;

  const on=!(wb[k]&&wb[k].on);
  wb[k]={on:on?1:0, t:Date.now(), src:src||((wb[k]||{}).src||'')};
  save();
  /* 同一個字的所有星號一起換狀態（表格、彈窗、生詞本清單可能同時各有一顆） */
  document.querySelectorAll('.wbb').forEach(b=>{
    if(wbKey(b.dataset.w)!==k) return;
    b.classList.toggle('on',on);

    b.title=on?'已在生詞本，點一下移除':'加入生詞本';

/* Grammar Meaning Map：WHEN → WHY → FORM，最上方先看這個 */
function gvMap(m){

/* 時間線：span 連到 NOW／point 過去一個結束的點／range 未完成的區間 */
function gvTimeline(t){
  if(!t||!(t.rows||[]).length) return '';
  const rows=t.rows, RH=86, top=34, W=640, H=top+rows.length*RH+16;
  const X0=150, X1=600, NOW=506;
  let s='<svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Noto Sans TC,PingFang TC,sans-serif">';
  s+='<rect width="'+W+'" height="'+H+'" rx="12" fill="#fdf9f4"/>';
  s+='<text x="'+X0+'" y="20" font-size="12" font-weight="700" fill="#9a8b7a">PAST</text>';
  s+='<text x="'+NOW+'" y="20" font-size="12" font-weight="800" fill="#c9631f" text-anchor="middle">NOW</text>';
  s+='<line x1="'+NOW+'" y1="26" x2="'+NOW+'" y2="'+(H-10)+'" stroke="#e8813a" stroke-width="2" stroke-dasharray="5 4"/>';
  rows.forEach(function(r,i){
    const y=top+i*RH+26, col=r.tone==='accent'?'#e8813a':'#8a7d6d';
    s+='<text x="12" y="'+(y+4)+'" font-size="13" font-weight="800" fill="#3d332a">'+esc(r.label||'')+'</text>';
    s+='<line x1="'+X0+'" y1="'+y+'" x2="'+X1+'" y2="'+y+'" stroke="#e6dccf" stroke-width="2"/>';
    if(r.kind==='span'){
      s+='<line x1="190" y1="'+y+'" x2="'+NOW+'" y2="'+y+'" stroke="'+col+'" stroke-width="6" stroke-linecap="round"/>'
       + '<circle cx="190" cy="'+y+'" r="7" fill="#fff" stroke="'+col+'" stroke-width="4"/>'
       + '<path d="M'+(NOW-2)+' '+(y-8)+' l10 8 -10 8" fill="none" stroke="'+col+'" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>';
      s+='<text x="190" y="'+(y+22)+'" font-size="11.5" fill="#8a7d6d" text-anchor="middle">'+esc(r.from||'')+'</text>';
    } else if(r.kind==='range'){
      s+='<rect x="300" y="'+(y-13)+'" width="'+(NOW-300)+'" height="26" rx="7" fill="#fdead9" stroke="'+col+'" stroke-width="3"/>'
       + '<text x="'+((300+NOW)/2)+'" y="'+(y+5)+'" font-size="12" font-weight="700" fill="#c9631f" text-anchor="middle">'+esc((r.from||'')+' → '+(r.to||'NOW'))+'</text>';
    } else {
      s+='<circle cx="270" cy="'+y+'" r="9" fill="'+col+'" stroke="#fff" stroke-width="3"/>'
       + '<text x="270" y="'+(y+24)+'" font-size="11.5" fill="#8a7d6d" text-anchor="middle">'+esc(r.at||'')+'</text>';
    }
    if(r.sub) s+='<text x="'+X0+'" y="'+(y+44)+'" font-size="13" font-weight="700" fill="#1f2937">'+esc(r.sub)+'</text>';
    if(r.subCn) s+='<text x="'+X0+'" y="'+(y+62)+'" font-size="12" fill="#8a7d6d">'+esc(r.subCn)+'</text>';
  });
  s+='</svg>';
  /* 手機版：不縮那張 640 寬的圖（文字會小到 5px 讀不了），改成逐列堆疊——
     每列一條小軸線（圖裡不放文字）＋句子用 HTML 排版，字級跟著全站 --fs 走、也會自動換行。 */
  const NB=(function(){
    const bw=280, bx0=12, bx1=268, bnow=228;
    return rows.map(function(r){
      const col=r.tone==='accent'?'#e8813a':'#8a7d6d';
      let b='<svg class="bar" viewBox="0 0 '+bw+' 34" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">';
      b+='<line x1="'+bx0+'" y1="17" x2="'+bx1+'" y2="17" stroke="#e6dccf" stroke-width="2"/>';
      b+='<line x1="'+bnow+'" y1="2" x2="'+bnow+'" y2="32" stroke="#e8813a" stroke-width="2" stroke-dasharray="4 3"/>';
      if(r.kind==='span'){
        b+='<line x1="46" y1="17" x2="'+bnow+'" y2="17" stroke="'+col+'" stroke-width="6" stroke-linecap="round"/>'
         + '<circle cx="46" cy="17" r="6" fill="#fff" stroke="'+col+'" stroke-width="3.5"/>'
         + '<path d="M'+(bnow-2)+' 10 l8 7 -8 7" fill="none" stroke="'+col+'" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>';
      } else if(r.kind==='range'){
        b+='<rect x="132" y="6" width="'+(bnow-132)+'" height="22" rx="6" fill="#fdead9" stroke="'+col+'" stroke-width="2.5"/>';
      } else {
        b+='<circle cx="112" cy="17" r="7.5" fill="'+col+'" stroke="#fff" stroke-width="2.5"/>';
      }
      b+='</svg>';
      const axl=r.kind==='point' ? esc(r.at||'') : esc((r.from||'')+(r.kind==='range'?' → ':' ')+'');
      return '<div class="gvtlrow">'
        +'<div class="lb">'+esc(r.label||'')+'</div>'+b
        +'<div class="axl"><span>'+axl+'</span><span class="now">NOW</span></div>'
        +(r.sub?'<div class="en"><span class="sent" data-t="'+esc(r.sub)+'" onclick="saySent(this)">'+esc(r.sub)+'</span> '+spk(r.sub)+'</div>':'')
        +(r.subCn?'<div class="cn cnx">'+esc(r.subCn)+'</div>':'')
        +'</div>';
    }).join('');
  })();
  return '<figure class="artbox gvtl">'
    +'<div class="gvtl-wide">'+s+'</div>'
    +'<div class="gvtl-narrow">'+NB+'</div>'
    +(t.cap?'<figcaption>'+esc(t.cap)+'</figcaption>':'')+'</figure>';
}
/* 情境卡：圖 → 意義 → 例句；「為什麼？」點了才展開（漸進揭露） */
function gvScenario(s,i){
  return '<div class="gvcard" id="gvc'+i+'">'
   +'<div class="ill">'+gvIcon(s.icon)+'</div>'
   +(s.ask?'<div class="ask">❓ '+esc(s.ask)+'</div>':'')

   +'<div class="en"><span class="sent" data-t="'+esc(s.en)+'" onclick="saySent(this)">'+esc(s.en)+'</span> '+spk(s.en)+'</div>'

function gvWhy(btn){

  const on=c.classList.toggle('open');

window.gvWhy=gvWhy;
/* 左右對照：A ❌ / B ✅ 或兩種都對但意思不同 */
function gvComparison(c){

    +'<div class="row" style="align-items:center;gap:8px;margin-bottom:4px">'+gvIcon(o.icon,30)+'<div class="tag">'+esc(o.tag||'')+'</div></div>'

/* 錯誤視覺化：❌ 錯句劃掉不給發音（不讓學員聽錯誤說法）、✅ 正確句可朗讀 */

/* 一步一步理解：預設只顯示第 1 步，按「下一步」逐格揭露 */
function gvSteps(steps){

   + steps.map((s,i)=>'<div class="st'+(i===0?' on':'')+'"><div class="n">'+(i+1)+'</div><div>'
       +'<div class="lb">'+esc(s.label||('Step '+(i+1)))+'</div>'

function gvNextStep(btn){
  const box=btn.closest('.gvsteps'); if(!box) return;
  let n=+box.dataset.n+1; const total=+box.dataset.total;
  const st=box.querySelectorAll('.st');
  if(n<=total){ st[n-1].classList.add('on'); box.dataset.n=n; }
  if(n>=total){ btn.parentNode.remove(); }

/* ============================================================
   Step 1 · SEE 的視覺化型別（2026-09-03）
   ------------------------------------------------------------
   時間線只適用於時態；關係子句、被動、比較級這些沒有時間軸，
   所以改成「一個文法點配一種型別」。資料寫在單元的 visual 欄位：

     visual:{ type:'…', cap:'圖說', …型別各自的欄位 }

   ⚠ 硬規則：這些元件全部用 HTML + CSS 排版，文字絕不畫進 SVG
     （SVG 只畫箭頭與軸線）。這樣才吃 --fs 字級、會自動換行，
     也不會重演「SVG 內文字被圖形擋住」的問題。

   型別與欄位
   ---------------------------------------------------------------
   matrix  座標表（時間 × 狀態）
           {cols:['簡單式',…], rows:[{h:'現在', cells:[{en,cn,hi}]}]}
   swap    主詞 ↔ 受詞交換（被動語態）
           {crossLabel, lanes:[{tag,tone,sub,parts:[{t,role}],cn}]}
             role: subj / verb / obj / glue / plain / mute
   merge   兩句合併成一句（關係子句、分詞構句、連接詞、間接問句）
           {a:{n,en,cn}, b:{n,en,cn}, glue, glueCn, out:{n,parts:[…],cn}}
   scale   程度刻度（比較級、情態動詞推測、頻率副詞）
           {lo,hi, stops:[{at:0–100,label,labelCn,en,cn}]}
   branch  條件分支（假設語氣）
           {cond:{en,cn}, fan:[{tag,tone:'real|unreal|impossible',prob,en,cn}]}
   shift   往回退一格（轉述句時態後移、used to）
           {rows:[{a,b,nt}]}
   cols    2～3 欄對照（狀態/動作動詞、-ed/-ing、對比/因果/讓步）
           {cols:[{tag,tagCn,tone:1|2|3,items:[{en,cn,nt}]}]}
   chain   結構鏈（使役動詞、被動的 be + Vpp）
           {links:[{t,c,role}], eg:{en,cn}, variants:[{k,en,cn}]}
   ============================================================ */
/* 英文句：可點整句朗讀，與情境卡、時間線一致 */
function gvEn(x){
  if(!x) return '';

}
/* 純圖形箭頭（無文字，縮放不會壞） */
const GVARROW={
  down:'<svg class="gvarr down" viewBox="0 0 26 20" fill="none" aria-hidden="true"><path d="M13 2 V13" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M7 12 l6 6 6 -6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  right:'<svg viewBox="0 0 18 13" fill="none" aria-hidden="true"><path d="M1 6.5 H12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M10 2 l5 4.5 -5 4.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  cross:'<svg viewBox="0 0 118 44" fill="none" aria-hidden="true">'+'<path d="M10 8 C50 8 68 36 108 36" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>'+'<path d="M102 31 l6 5 -6 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>'+'<path d="M108 8 C68 8 50 36 10 36" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 4"/>'+'<path d="M16 31 l-6 5 6 5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};
/* parts:[{t,role}] → 上了語法角色顏色的句子 */
function gvParts(parts){

    '<span class="gvchip '+(p.role||'plain')+'">'+esc(p.t)+'</span>').join('')+'</div>';
}
function gvvCap(c){ return c?'<div class="gvvcap">'+mkText(c)+'</div>':''; }

function gvMatrix(v){
  const cols=v.cols||[], rows=v.rows||[];
  let w='<div class="gvmx"><table><tr><th class="rh"></th>'
    +cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>'
    +rows.map(r=>'<tr><th class="rh">'+esc(r.h)+'</th>'
      +(r.cells||[]).map(c=>'<td'+(c.hi?' class="hi"':'')+'><div class="en">'+esc(c.en||'')+'</div>'
        +(c.cn?'<div class="cn">'+esc(c.cn)+'</div>':'')+'</td>').join('')+'</tr>').join('')
    +'</table></div>';
  /* 手機：不橫捲，改成「現在／過去／未來」各一組 */
  let n='<div class="gvmxs">'+rows.map(r=>'<div class="grp"><div class="h">'+esc(r.h)+'</div>'
    +(r.cells||[]).map((c,i)=>'<div class="mxr"><span class="k">'+esc(cols[i]||'')+'</span>'
      +'<span class="en">'+gvEn(c.en||'')+'</span></div>').join('')+'</div>').join('')+'</div>';

function gvSwap(v){
  const lane=(l)=>'<div class="lane"><div class="hd"><span class="gvtag'+(l.tone?' '+l.tone:'')+'">'+esc(l.tag||'')+'</span>'

  const lanes=v.lanes||[];
  let h='<div class="gvv gvsw">'+lane(lanes[0]||{});
  if(lanes[1]) h+='<div class="cross">'+GVARROW.cross
    +(v.crossLabel?'<span class="lbl">'+esc(v.crossLabel)+'</span>':'')+'</div>'+lane(lanes[1]);
  return h+'</div>'+gvvCap(v.cap);
}

function gvMerge(v){
  const bx=(o)=>'<div class="bx"><div class="n">'+esc(o.n||'')+'</div>'
    +'<div class="en">'+gvEn(o.en||'')+'</div>'+(o.cn?'<div class="gvcn">'+esc(o.cn)+'</div>':'')+'</div>';

function gvScale(v){

function gvBranch(v){

function gvShift(v){
  return '<div class="gvv gvsh">'+(v.rows||[]).map(r=>'<div class="r">'

    +'<div class="b">'+esc(r.b||'')+'</div>'

function gvCols(v){

    +'</div>').join('')+'</div></div>'+gvvCap(v.cap);

function gvChain(v){

const GVVIS={timeline:gvTimeline,matrix:gvMatrix,swap:gvSwap,merge:gvMerge,scale:gvScale,
             branch:gvBranch,shift:gvShift,cols:gvCols,chain:gvChain};
/* Step 1 的總入口：visual 型別 → 時間線 → 舊的兩格對照卡，取第一個有內容的 */
function gvVisual(g){
  const v=g.visual;
  if(v&&GVVIS[v.type]) return GVVIS[v.type](v);
  if(g.timeline) return gvTimeline(g.timeline);
  return gvizHTML(g.id);
}
/* Step 1 的標題跟著型別走，讀者才知道自己在看什麼 */
const GVVTTL={timeline:'時間線：這個時態站在哪裡',matrix:'座標表：時間 × 動作狀態',swap:'主詞與受詞換位置',merge:'兩句合併成一句',
  scale:'程度刻度：從弱到強',branch:'條件分支：這個 if 有多真',shift:'往回退一格',
  cols:'分邊看：各自負責什麼',chain:'句型結構鏈'};
function gvVisualTitle(g){
  const t=g.visual&&GVVTTL[g.visual.type];
  return t||(g.timeline?'時間線：這個時態站在哪裡':'圖解：先看懂整體關係');
}
/* 視覺化文法內頁：SEE → UNDERSTAND → READ → COMPARE → PRACTICE */
function gvHTML(g){
  let h='<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start">'
   +'<div class="row" style="align-items:center;gap:10px;flex:1"><button class="back" onclick="gClose()" style="margin:0;flex-shrink:0"></button><h2 class="sec" style="margin:0">'+esc(g.titleCn)+'</h2></div><span class="lv '+lvCls(g.level)+'">'+esc(g.level)+'</span></div>'
   +'<div class="muted">'+esc(g.title)+'</div></div>';

  h+='<div class="gvlead"><div class="l1">💡 '+mkText(g.oneLine||g.summary||'')+'</div>'+gvMap(g.map)+'</div>';

  /* 一段一張卡，沒有內容就整段跳過（步驟編號固定不重排） */
  const card=(step,title,body,sub)=>body?'<div class="card"><div class="gvh"><span class="step">'+step+'</span><h3>'+title+'</h3></div>'
    +(sub?'<div class="gvsub">'+sub+'</div>':'')+body+'</div>':'';

  h+=card('Step 1 · SEE',gvVisualTitle(g),gvVisual(g));

  /* Step 2：情境卡 + 原有的 sections 規則（表格／條列不丟掉，2026-09-03 使用者指定） */
  h+=card('Step 2 · UNDERSTAND',
    (g.scenarios||[]).length?'什麼時候用？'+g.scenarios.length+' 個情境':'核心規則',
    ((g.scenarios||[]).length?'<div class="gvgrid">'+g.scenarios.map(gvScenario).join('')+'</div>':'')
    +gSecPart(g.sections,'rule'),
    (g.scenarios||[]).length?'每張卡只回答一個問題。先看圖和例句，想不通再點「為什麼？」。':'');

  h+=card('Step 3 · READ','例句與逐步理解',
    ((g.steps||[]).length?gvSteps(g.steps):'')+gSecPart(g.sections,'ex'),
    (g.steps||[]).length?'從情境出發，最後才看到文法規則——不要一開始就背規則。':'');

  h+=card('Step 4 · COMPARE',(g.comparison&&g.comparison.title)||'對照',
    (g.comparison?gvComparison(g.comparison):'')+gSecPart(g.sections,'table'));

  /* mistakes 是視覺化格式的欄位，traps 是舊格式的；兩種都收，一起排在 Step 5 */
  const mis=(g.mistakes||[]).map(gvMistake).join('')
    +(g.traps||[]).map(t=>'<div class="trap"><div class="bad">✗ '+esc(t.bad)+'</div>'
      +'<div class="good">✓ '+esc(t.good)+' '+spk(t.good)+'</div><div class="why">'+trapWhy(t.why)+'</div></div>').join('');
  h+=card('Step 5 · CHECK','⚠️ 最容易錯的地方',mis?'<div class="gvcols">'+mis+'</div>':'');

  if((g.quiz||[]).length) h+='<div class="card"><div class="row" style="align-items:center;margin-bottom:8px">'
    +'<div class="gvh" style="margin:0;flex:1"><span class="step">Step 6 · PRACTICE</span><h3>✏️ Mini Practice</h3></div>'+qzBtnHTML('gram',g.quiz)+'</div>'
    +'<div>'+quizHTML(g.quiz,'gram')+'</div><div id="gquizScore"></div></div>';

  h+='<div class="card" style="text-align:center"><button class="btn" onclick="gClose()">完成，回列表</button></div>';
  return h;
}

/* section 拆解：舊版 15 課、每日文法與視覺化單元共用。
   body / bullets → 規則（UNDERSTAND）；examples → 例句（READ）；table → 對照表（COMPARE）。
   每日文法的資料有時把 body/bullets 寫成單一字串而不是陣列，這裡都收：
   之前遇過字串直接 .map 拋錯，整個單元打不開。 */
function gSecPart(sections,want){
  const arr=v=>Array.isArray(v)?v:[v];
  return (sections||[]).map(s=>{
    let x='';
    if(want==='rule'){
      if(s.body) x+= arr(s.body).map(b=>'<div class="gline" style="font-size:var(--font-body);margin-bottom:5px">'+mkTextSpk(b)+'</div>').join('');
      if(s.bullets) x+='<ul>'+arr(s.bullets).map(b=>'<li class="gline">'+mkTextSpk(b)+'</li>').join('')+'</ul>';
    } else if(want==='table' && s.table){
      x+='<div class="tw"><table><tr>'+s.table.head.map(t=>'<th>'+esc(t)+'</th>').join('')+'</tr>'
       + s.table.rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')+'</table></div>';
    } else if(want==='ex' && s.examples){
      x+='<div class="gvcols">'+ s.examples.map(e=>'<div class="ex"><div class="een">'+esc(e.en)+' '+spk(e.en)+'</div>'
       +'<div class="ecn">'+esc(e.cn)+'</div>'+(e.note?'<div class="enote">→ '+mkText(e.note)+'</div>':'')+'</div>').join('')+'</div>';
    }
    return x?'<div class="gsec"><h3>'+esc(s.h)+'</h3>'+x+'</div>':'';
  }).join('');
}
function gramHTML(g){
  if(g&&g.vis) return gvHTML(g);   /* 視覺化文法走新版面 */
  let h='<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start">'
   +'<div class="row" style="align-items:center;gap:10px;flex:1"><button class="back" onclick="gClose()" style="margin:0;flex-shrink:0"></button><h2 class="sec" style="margin:0">'+esc(g.titleCn)+'</h2></div><span class="lv '+lvCls(g.level)+'">'+esc(g.level)+'</span></div>'
   +'<div class="muted">'+esc(g.title)+((g.srcDays||[]).length?' · 課堂 '+g.srcDays.join(' / '):'')+'</div>'
   +'<div class="ex" style="margin-top:10px"><div class="enote" style="font-size:var(--font-secondary)">💡 '+esc(g.summary)+'</div></div></div>'
   +'</div>';

  /* 舊版 15 課與每日文法也照 SEE → UNDERSTAND → READ → COMPARE → PRACTICE 分段
     （2026-08-30 使用者指定）。做法是把每個 section 的組成拆開重新分組：
       body / bullets → 規則（UNDERSTAND）
       examples       → 例句（READ）
       table          → 對照表（COMPARE）
     section 標題會跟著各自的內容重複出現，讀者不會失去上下文；資料本身完全沒動。
     某一步沒有內容就整段跳過，步驟標籤固定不重新編號。 */
  const part=(want)=>gSecPart(g.sections,want);
  const stepCard=(step,title,body,sub)=>body?'<div class="card"><div class="gvh"><span class="step">'+step+'</span><h3>'+title+'</h3></div>'
    +(sub?'<div class="gvsub">'+sub+'</div>':'')+body+'</div>':'';

  const viz=gvizHTML(g.id);
  h+=stepCard('Step 1 · SEE','圖解：先看懂整體關係',viz);
  h+=stepCard('Step 2 · UNDERSTAND','核心規則',part('rule'));
  h+=stepCard('Step 3 · READ','例句',part('ex'));
  h+=stepCard('Step 4 · COMPARE','對照表',part('table'));

  if((g.traps||[]).length){
    h+=stepCard('Step 5 · CHECK','⚠️ 最容易錯的地方',
      '<div class="gvcols">'+g.traps.map(t=>'<div class="trap"><div class="bad">✗ '+esc(t.bad)+'</div><div class="good">✓ '+esc(t.good)+' '+spk(t.good)+'</div><div class="why">'+trapWhy(t.why)+'</div></div>').join('')+'</div>');
  }
  if((g.quiz||[]).length){
    h+='<div class="card"><div class="row" style="align-items:center;margin-bottom:8px">'
     +'<div class="gvh" style="margin:0;flex:1"><span class="step">Step 6 · PRACTICE</span><h3>✏️ 練習題</h3></div>'+qzBtnHTML('gram',g.quiz)+'</div>'
     +'<div>'+quizHTML(g.quiz,'gram')+'</div><div id="gquizScore"></div></div>';
  }
  h+='<div class="card" style="text-align:center"><button class="btn" onclick="gClose()">完成，回列表</button></div>';
  return h;
}

RENDER.daily=function(){
  const t=today();

  artsToday.forEach(a=>{

    h+='<div class="item'+(isToday(a)?' new':finCls(d))+'"'+finTitle(d)+' style="'+lvBar(a.level)+'" onclick="dailyArt(\''+a.id+'\')">'

function calendarCard(){
  const now=new Date();
  const cy=calYM?calYM.y:now.getFullYear();
  const cm=calYM?calYM.m:now.getMonth();
  const set=studyDaySet();
  const t=today();
  const pad2=n=>String(n).padStart(2,'0');
  const key=dn=>cy+'-'+pad2(cm+1)+'-'+pad2(dn);
  const startWd=new Date(cy,cm,1).getDay();      // 0=週日
  const days=new Date(cy,cm+1,0).getDate();
  const wd=['日','一','二','三','四','五','六'];
  let studied=0;
  for(let i=1;i<=days;i++){ const ds=key(i); if(set.has(ds)&&ds<=t) studied++; }
  const atCurrent=(cy>now.getFullYear())||(cy===now.getFullYear()&&cm>=now.getMonth());
  let h='<div class="card"><h2 class="sec">🗓 每日打卡</h2>'
   +'<div class="hint">完成當天的文章、文法或單字複習，那一天就會亮起來。目前連續打卡 <b>'+(ST.streak||1)+'</b> 天。</div>'
   +'<div class="calhd"><button class="calnav" onclick="calShift(-1)">‹</button>'
   +'<div class="m">'+cy+' 年 '+(cm+1)+' 月 · 本月打卡 '+studied+' 天</div>'
   +'<button class="calnav" onclick="calShift(1)"'+(atCurrent?' disabled':'')+'>›</button></div>'
   +'<div class="calgrid">'+wd.map(w=>'<div class="wd">'+w+'</div>').join('');
  for(let i=0;i<startWd;i++) h+='<div class="cell empty"></div>';
  for(let i=1;i<=days;i++){
    const ds=key(i); let cls='cell'; const done=set.has(ds);
    if(done) cls+=' done';
    if(ds===t) cls+=' today'; else if(ds>t) cls+=' future';
    h+='<div class="'+cls+'">'+i+(done?'<span class="dot">✓</span>':'')+'</div>';
  }
  h+='</div>'
   +'<div class="callegend">'
   +'<span><i style="background:linear-gradient(135deg,#f7bd76,#ef9a4f)"></i>有完成</span>'
   +'<span><i style="background:var(--card);border:1px solid var(--line)"></i>沒打卡</span>'
   +'<span><i style="background:var(--card);border:2px solid var(--accent2)"></i>今天</span>'
   +'</div></div>';
  return h;
}
function calShift(delta){
  const now=new Date();
  const cy=calYM?calYM.y:now.getFullYear();
  const cm=calYM?calYM.m:now.getMonth();
  const d=new Date(cy,cm+delta,1);
  calYM={y:d.getFullYear(),m:d.getMonth()};
  go('prog');
}
window.calShift=calShift;

/* ---------- 進度分頁的文法清單：程度/狀態篩選 ＋ 主題分組折疊 ＋ 明確行動按鈕 ---------- */
let pgLv='all', pgSt='all', pgGrpOpen=null;
/* 依標題把單元歸進四大主題（順序即顯示順序） */
const PG_GROUPS=['時態總覽','語態與語氣','子句與句構','其他重點'];
function pgCat(g){
  const t=(g.titleCn||'')+(g.title||'');
  if(/時態|進行式|完成式|未來|過去簡單|現在簡單|簡單式|過去式/.test(t)) return '時態總覽';
  if(/被動|假設|語氣|情態|使役/.test(t)) return '語態與語氣';
  if(/子句|關係|間接|分詞|倒裝|連接/.test(t)) return '子句與句構';
  return '其他重點';
}
/* 實戰價值標籤：職場信件/報告/排程確認最常用到的單元 */
function pgHot(g){
  const t=(g.titleCn||'')+(g.title||'');
  if(/被動|未來|情態|間接|使役/.test(t)) return '💼 職場高頻';
  if(/現在完成|關係/.test(t)) return '⭐ 必修重點';
  return '';
}
function pgStatus(g){
  const d=ST.gramDone[g.id];
  return !d?'todo':(d.correct>=d.total?'done':'part');
}
/* 小號進度圓環（練到一半的單元用） */
function ringMini(pct){
  const r=10, c=2*Math.PI*r, off=c*(1-Math.min(100,pct)/100);
  return '<svg width="26" height="26" viewBox="0 0 26 26" style="vertical-align:-7px">'
   +'<circle cx="13" cy="13" r="'+r+'" fill="none" stroke="#f0e4d4" stroke-width="4"/>'
   +'<circle cx="13" cy="13" r="'+r+'" fill="none" stroke="#e0731f" stroke-width="4" stroke-linecap="round" '
   +'stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 13 13)"/></svg>';
}
function pgGramHTML(){
  const pool=ALL_GRAM.filter(g=>inBand(g.level));
  const stCnt={todo:0,part:0,done:0};
  pool.forEach(g=>stCnt[pgStatus(g)]++);
  if(pgLv!=='all'&&!inBand(pgLv)) pgLv='all';
  const list=pool.filter(g=>(pgLv==='all'||g.level===pgLv)&&(pgSt==='all'||pgStatus(g)===pgSt));
  /* 第一次進來：有「進行中」的主題先展開，其他先收合，頁面短一點 */
  if(!pgGrpOpen){
    pgGrpOpen={};
    PG_GROUPS.forEach(n=>pgGrpOpen[n]=pool.some(g=>pgCat(g)===n&&pgStatus(g)==='part'));
    if(!Object.values(pgGrpOpen).some(Boolean)) pgGrpOpen[PG_GROUPS[0]]=true;
  }
  const lvChips=[['all','全部程度']].concat(band().map(l=>[l,l]))
    .map(([k,t])=>'<button class="chip'+(pgLv===k?' on':'')+'" onclick="pgSet(\'lv\',\''+k+'\')">'+t+'</button>').join('');
  const stChips=[['all','全部'],['todo','未開始 '+stCnt.todo],['part','進行中 '+stCnt.part],['done','已完成 '+stCnt.done]]
    .map(([k,t])=>'<button class="chip'+(pgSt===k?' on':'')+'" onclick="pgSet(\'st\',\''+k+'\')">'+t+'</button>').join('');
  const order={part:0,todo:1,done:2};
  let h='<div class="chips" style="margin-top:12px">'+lvChips+'</div><div class="chips">'+stChips+'</div>';
  PG_GROUPS.forEach(name=>{
    const items=list.filter(g=>pgCat(g)===name).sort((a,b)=>order[pgStatus(a)]-order[pgStatus(b)]);
    if(!items.length) return;
    const dn=items.filter(g=>pgStatus(g)==='done').length;
    /* 篩選「未開始/進行中/已完成」時全部展開，收合的組才不會藏住符合的單元 */
    const open=pgSt!=='all'||!!pgGrpOpen[name];
    h+='<button class="pggrp" onclick="pgGrpTog(\''+name+'\')">'+(open?'▾':'▸')+' '+name
      +'<span class="muted" style="margin-left:auto;font-size:var(--font-meta)">'+dn+' / '+items.length+' 完成</span></button>';
    if(open) h+=items.map(g=>{
      const st=pgStatus(g), d=ST.gramDone[g.id], hot=pgHot(g);
      const act= st==='todo' ? '<button class="pgo">開始練習</button>'
        : st==='part' ? ringMini(Math.round(d.correct*100/d.total))+'<button class="pgo cont">繼續 '+d.correct+'/'+d.total+'</button>'
        : '<span class="pgok">✓ '+d.correct+'/'+d.total+'</span>';
      return '<div class="pgrow" onclick="goUnit(\''+g.id+'\')">'
        +'<span class="lv '+lvCls(g.level)+'">'+g.level+'</span>'
        +'<span class="pgt">'+esc(g.titleCn)+'</span>'
        +(hot?'<span class="pgtag">'+hot+'</span>':'')
        +'<span class="pgact">'+act+'</span></div>';
    }).join('');
  });
  if(!list.length) h+='<div class="muted" style="margin-top:10px">這個組合下沒有單元，換個篩選試試。</div>';
  return h;
}
/* 只更新文法區塊，不重畫整頁（畫面不會跳回頂端） */
function pgRefresh(){ const e=$('pg-gram'); if(e) e.innerHTML=pgGramHTML(); else go('prog'); }
function pgSet(k,v){ if(k==='lv')pgLv=v; else pgSt=v; pgRefresh(); }
function pgGrpTog(n){ pgGrpOpen[n]=!pgGrpOpen[n]; pgRefresh(); }
window.pgSet=pgSet; window.pgGrpTog=pgGrpTog;

/* SVG 進度圓環：pct 0-100 */
function ringSVG(pct,color){
  const r=26, c=2*Math.PI*r, off=c*(1-Math.min(100,pct)/100);
  return '<svg width="64" height="64" viewBox="0 0 64 64">'
   +'<circle cx="32" cy="32" r="'+r+'" fill="none" stroke="#f0e4d4" stroke-width="7"/>'
   +'<circle cx="32" cy="32" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="7" stroke-linecap="round" '
   +'stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 32 32)"/>'
   +'<text x="32" y="37" text-anchor="middle" font-size="14" font-weight="800" fill="#4a3b2a">'+Math.round(pct)+'%</text></svg>';
}

   1.15 會讓每一行都變得又大又長，反而累。使用者自己調過就以他的選擇為準。 */

function applyFs(){
  const fs=Number((ST.fsSet && ST.fs) || DEFAULT_FS);
  document.documentElement.style.setProperty('--fs', String(fs));
  document.documentElement.classList.toggle('fs-large',fs>=1.15&&fs<1.3);
  document.documentElement.classList.toggle('fs-larger',fs>=1.3&&fs<1.45);
  document.documentElement.classList.toggle('fs-max',fs>=1.45);
}

   以及每分鐘檢查一次（手機把網頁擺著過夜也會更新）。 */

  const t=today();
  if(t===dayIconStamp) return;

  if(TAB==='daily') RENDER.daily && RENDER.daily();   // 今日新內容跟著新日期重算

/* 例句裡用到該單字／片語就加粗（compensate 也會對到 compensated；片語去掉 something/someone 佔位字再比對） */
function bkHi(sent,w){
  let s=esc(sent);
  const core=String(w||'').replace(/\b(something|someone)\b/gi,' ').replace(/\s+/g,' ').trim();
  if(!core) return s;
  const q=core.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  let re=new RegExp('\\b('+q+'[a-z]*)','gi');
  if(re.test(s)) return s.replace(re,'<b>$1</b>');
  /* 整個片語比不到（如 report something to someone）：片語的每個組成字（含介系詞 to/for）
     都各自加粗，句型對映才完整 */
  core.split(' ').filter(Boolean).forEach(p=>{
    const pq=p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    s=s.replace(new RegExp('\\b('+pq+'[a-z]*)\\b','i'),'<b>$1</b>');
  });
  return s;
}
/* 日期顯示：2026-08-13 → 2026/8/13 */
function bkDate(d){
  const m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? m[1]+'/'+(+m[2])+'/'+(+m[3]) : String(d||'');
}
/* 作業複習：把 a 句裡「跟 b 句不同的整段結構」上色（原句→紅、訂正→綠）。
   用頭尾共同字修剪出中間差異區塊，整段標色比逐字散標更能看出「錯在哪個結構」 */
function bkDiff(a,b,cls){
  const norm=w=>String(w).toLowerCase().replace(/[^a-z']/g,'');
  const A=String(a).split(/\s+/), B=String(b).split(/\s+/);
  const An=A.map(norm), Bn=B.map(norm);
  let p=0; while(p<An.length&&p<Bn.length&&An[p]===Bn[p]) p++;
  let s=0; while(s<An.length-p&&s<Bn.length-p&&An[An.length-1-s]===Bn[Bn.length-1-s]) s++;
  if(p+s>=An.length) return esc(A.join(' '));
  return A.map((w,i)=> (i>=p&&i<A.length-s)?'<span class="'+cls+'">'+esc(w)+'</span>':esc(w)).join(' ');
}
/* 文法解說排版：句號後換行；(1)(2)(3) 各自成段、編號懸掛縮排（折行後內容對齊） */
function bkNote(s){
  /* 斷句規則統一走 brSent（含「收尾標點不斷行」），這裡只多做去重與去頭尾 */
  const brk=x=>brSent(esc(x)).replace(/(<br>\s*)+/g,'<br>').replace(/^<br>|<br>$/g,'');
  const parts=String(s).split(/(?=[（(]\d+[)）])/);
  if(parts.length<2) return '<div>'+brk(s)+'</div>';
  return parts.map(p=>{
    const m=p.match(/^[（(](\d+)[)）]\s*([\s\S]*)$/);
    if(m) return '<div class="bknum"><span class="no">（'+m[1]+'）</span><div>'+brk(m[2])+'</div></div>';
    return p.trim()?'<div>'+brk(p)+'</div>':'';
  }).join('');
}
