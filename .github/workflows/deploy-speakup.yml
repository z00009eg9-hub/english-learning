name: Deploy Speak Up to Firebase Hosting

# push 到 main 且 Speak Up 的檔案有變動時，自動部署 learning-english-notes.web.app。
# 也可在 GitHub（含手機版）Actions 頁面手動按 Run workflow。
# 需要一個 repo secret：FIREBASE_SERVICE_ACCOUNT_LEARNING_ENGLISH_NOTES
#   Firebase Console → 專案設定 → 服務帳戶 → 產生新的私密金鑰 → 下載的 JSON 全文
#   貼到 GitHub → Settings → Secrets and variables → Actions → New repository secret
# 備案：本機仍可用
#   cp index.html speakup-data.js public/ && npx firebase-tools deploy --only hosting --project learning-english-notes
#   （備案不會換版號：speakup-data.js?v=dev，瀏覽器最多快取 1 小時）
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'speakup-data.js'
      - 'manifest.json'
      - 'icons/**'
      - '.github/workflows/deploy-speakup.yml'
  workflow_dispatch:

concurrency:
  group: deploy-speakup
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build public/ (same as the local cp step)
        run: |
          mkdir -p public
          cp index.html speakup-data.js manifest.json public/
          cp -r icons public/icons
          # 課程資料換成內容雜湊版號，資料一變瀏覽器就抓新版
          h=$(sha256sum speakup-data.js | cut -c1-10)
          sed -i "s/speakup-data\.js?v=dev/speakup-data.js?v=$h/" public/index.html
          grep -q "speakup-data.js?v=$h" public/index.html || { echo "index.html 找不到 speakup-data.js?v=dev，停止部署"; exit 1; }

      - name: Sanity check
        run: |
          size=$(wc -c < public/index.html)
          echo "index.html: $size bytes"
          if [ "$size" -lt 250000 ]; then
            echo "index.html 看起來不完整（小於 250KB），停止部署"; exit 1
          fi
          grep -q "Speak Up" public/index.html || { echo "找不到 Speak Up 標記，停止部署"; exit 1; }
          dsize=$(wc -c < public/speakup-data.js)
          echo "speakup-data.js: $dsize bytes"
          if [ "$dsize" -lt 600000 ]; then
            echo "speakup-data.js 看起來不完整（小於 600KB），停止部署"; exit 1
          fi
          for m in VOCAB_END TRANS_END KW_END ARTICLES_END DAYQUIZ_END DAYTALK_END; do
            grep -q "===SYNC:$m===" public/speakup-data.js || { echo "speakup-data.js 缺 SYNC:$m（可能被截斷），停止部署"; exit 1; }
          done

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEARNING_ENGLISH_NOTES }}
          projectId: learning-english-notes
          channelId: live
