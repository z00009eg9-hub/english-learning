name: Deploy Speak Up to Firebase Hosting

# push index.html 就自動部署主站，不用再手動跑 firebase deploy。
# 需要一個 repo secret：FIREBASE_SERVICE_ACCOUNT_LEARNING_ENGLISH_NOTES
#   Firebase Console → 專案設定 → 服務帳戶 → 產生新的私密金鑰 → 下載的 JSON 全文
#   貼到 GitHub → Settings → Secrets and variables → Actions → New repository secret
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'firebase.json'
      - '.github/workflows/deploy-speakup.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync index.html to public/
        run: cp index.html public/index.html

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LEARNING_ENGLISH_NOTES }}
          projectId: learning-english-notes
          channelId: live
