<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英文筆記考題練習 Quiz</title>
<style>
  :root{
    --orange:#FFA726; --orange-d:#F57C00; --hdr:#FFE0B2; --strip:#FFD54F;
    --callout:#FFFDE7; --ok:#2e7d32; --bad:#C0392B; --grey:#555; --line:#eee;
  }
  *{box-sizing:border-box}
  body{font-family:"Google Sans","Noto Sans TC",-apple-system,"Segoe UI",sans-serif;
    margin:0; background:#FAFAFA; color:#222; line-height:1.6;}
  .wrap{max-width:760px; margin:0 auto; padding:20px 16px 80px;}
  h1{font-size:22px; margin:8px 0 4px;}
  .sub{color:var(--grey); font-size:14px; margin-bottom:20px;}
  .panel{background:#fff; border-radius:14px; padding:20px; box-shadow:0 1px 6px rgba(0,0,0,.06); margin-bottom:16px;}
  label.field{display:block; font-weight:700; margin-bottom:8px; font-size:15px;}
  select, .btn{font-family:inherit; font-size:15px;}
  select{width:100%; padding:12px; border:2px solid var(--hdr); border-radius:10px; background:#fff;}
  .btn{background:var(--orange); color:#fff; border:none; border-radius:10px; padding:12px 22px;
    font-weight:700; cursor:pointer; transition:.15s;}
  .btn:hover{background:var(--orange-d);}
  .btn.ghost{background:#fff; color:var(--orange-d); border:2px solid var(--orange);}
  .row{display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;}
  .qcard{background:#fff; border-radius:14px; padding:18px 18px 8px; box-shadow:0 1px 6px rgba(0,0,0,.06); margin-bottom:14px;}
  .qnum{display:inline-block; background:var(--strip); color:#7a4b00; font-weight:700;
    padding:2px 10px; border-radius:20px; font-size:13px; margin-bottom:8px;}
  .qtype{color:var(--grey); font-size:12px; margin-left:6px;}
  .qtext{font-size:16px; font-weight:600; margin:6px 0 12px;}
  .qtext .cn{display:block; color:var(--grey); font-weight:400; font-size:14px; margin-top:2px;}
  .opts{display:flex; flex-direction:column; gap:8px;}
  .opt{display:flex; align-items:flex-start; gap:10px; padding:11px 14px; border:2px solid var(--line);
    border-radius:10px; cursor:pointer; transition:.12s;}
  .opt:hover{border-color:var(--orange);}
  .opt input{margin-top:3px;}
  .opt.correct{border-color:var(--ok); background:#EDF7ED;}
  .opt.wrong{border-color:var(--bad); background:#FDECEA;}
  .fill input[type=text]{width:100%; padding:11px 14px; border:2px solid var(--line);
    border-radius:10px; font-size:15px; font-family:inherit;}
  .fill input.correct{border-color:var(--ok); background:#EDF7ED;}
  .fill input.wrong{border-color:var(--bad); background:#FDECEA;}
  .fb{margin:10px 0 4px; padding:10px 14px; border-radius:10px; font-size:14px; display:none;}
  .fb.show{display:block;}
  .fb.ok{background:#EDF7ED; color:var(--ok);}
  .fb.no{background:#FDECEA; color:var(--bad);}
  .fb b{color:#111;}
  .scorebar{position:sticky; bottom:0; background:#fff; border-top:2px solid var(--hdr);
    padding:14px 16px; text-align:center; margin:0 -16px;}
  .result{text-align:center; padding:26px 20px;}
  .result .big{font-size:44px; font-weight:800; color:var(--orange-d);}
  .result .pct{color:var(--grey); margin-top:4px;}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>📝 英文筆記考題練習</h1>
  <div class="sub">選一天的筆記，系統自動出題。作答後即時對答案並算分。</div>

  <!-- 選單 -->
  <div class="panel" id="startPanel">
    <label class="field" for="dateSel">選擇日期 Select a lesson</label>
    <select id="dateSel"></select>
    <div class="row">
      <button class="btn" id="startBtn">開始測驗 Start</button>
      <button class="btn ghost" id="shuffleBtn">隨機抽題 Shuffle</button>
    </div>
    <div class="sub" id="metaLine" style="margin-top:12px;"></div>
  </div>

  <!-- 題目 -->
  <div id="quizArea" class="hidden"></div>

  <!-- 送出 / 分數 -->
  <div id="submitArea" class="hidden">
    <div class="scorebar">
      <button class="btn" id="submitBtn">交卷對答案 Submit</button>
    </div>
  </div>

  <!-- 結果 -->
  <div id="resultArea" class="panel result hidden"></div>
</div>

<script src="quiz-data.js"></script>
<script>
/* ===== 題庫由外部 quiz-data.js 提供（window.QUIZZES）===== */
const QUIZZES = window.QUIZZES || {};

/* ===== 邏輯 ===== */
const $ = s => document.querySelector(s);
const dateSel = $("#dateSel"), quizArea = $("#quizArea");
let current = null, order = [], shuffled = false;

// 沒有任何題組時提示
if (!Object.keys(QUIZZES).length) {
  $("#metaLine").textContent = "⚠ 尚無題庫。請確認 quiz-data.js 是否與本頁放在同一資料夾。";
  $("#startBtn").disabled = $("#shuffleBtn").disabled = true;
}

// 填入日期選單
Object.keys(QUIZZES).sort().reverse().forEach(d=>{
  const o = document.createElement("option");
  o.value = d; o.textContent = `${d} — ${QUIZZES[d].title}`;
  dateSel.appendChild(o);
});
function updateMeta(){
  const q = QUIZZES[dateSel.value];
  $("#metaLine").textContent = q ? `${q.subtitle} ・共 ${q.questions.length} 題` : "";
}
dateSel.addEventListener("change", updateMeta); updateMeta();

function shuffle(arr){ // Fisher–Yates
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function startQuiz(doShuffle){
  current = QUIZZES[dateSel.value];
  shuffled = doShuffle;
  order = current.questions.map((_,i)=>i);
  if(doShuffle) order = shuffle(order);
  renderQuiz();
  $("#startPanel").classList.add("hidden");
  quizArea.classList.remove("hidden");
  $("#submitArea").classList.remove("hidden");
  $("#resultArea").classList.add("hidden");
  window.scrollTo(0,0);
}

function renderQuiz(){
  quizArea.innerHTML = "";
  order.forEach((qi, idx)=>{
    const q = current.questions[qi];
    const card = document.createElement("div");
    card.className = "qcard"; card.dataset.qi = qi;
    let html = `<span class="qnum">第 ${idx+1} 題</span><span class="qtype">${q.tag}</span>
      <div class="qtext">${q.q}${q.cn?`<span class="cn">${q.cn}</span>`:""}</div>`;
    if(q.type==="mc"){
      html += `<div class="opts">` + q.options.map((op,i)=>
        `<label class="opt"><input type="radio" name="q${qi}" value="${i}"><span>${op}</span></label>`
      ).join("") + `</div>`;
    } else {
      html += `<div class="fill"><input type="text" name="q${qi}" autocomplete="off" placeholder="輸入答案…"></div>`;
    }
    html += `<div class="fb" id="fb${qi}"></div>`;
    card.innerHTML = html;
    quizArea.appendChild(card);
  });
}

function norm(s){ return (s||"").trim().toLowerCase().replace(/\s+/g," ").replace(/[.。]$/,""); }

function grade(){
  let correct = 0;
  order.forEach(qi=>{
    const q = current.questions[qi];
    const fb = $("#fb"+qi);
    let isRight = false, chosen = null;
    if(q.type==="mc"){
      const sel = document.querySelector(`input[name=q${qi}]:checked`);
      chosen = sel ? parseInt(sel.value) : null;
      isRight = chosen === q.answer;
      // 標記選項
      document.querySelectorAll(`input[name=q${qi}]`).forEach(inp=>{
        const lab = inp.closest(".opt"); const v = parseInt(inp.value);
        if(v===q.answer) lab.classList.add("correct");
        else if(v===chosen) lab.classList.add("wrong");
        inp.disabled = true;
      });
    } else {
      const inp = document.querySelector(`input[name=q${qi}]`);
      const val = norm(inp.value);
      isRight = q.answer.some(a=>norm(a)===val);
      inp.classList.add(isRight?"correct":"wrong"); inp.disabled = true;
    }
    if(isRight) correct++;
    const right = q.type==="mc" ? q.options[q.answer] : q.answer[0];
    fb.className = "fb show " + (isRight?"ok":"no");
    fb.innerHTML = (isRight?"✅ 答對！":`❌ 答錯。正確答案：<b>${right}</b>`) +
      (q.explain?`　💡 ${q.explain}`:"");
  });
  showResult(correct, order.length);
}

function showResult(correct, total){
  $("#submitArea").classList.add("hidden");
  const pct = Math.round(correct/total*100);
  const msg = pct>=90?"太厲害了！🏆":pct>=70?"不錯，繼續加油！💪":pct>=50?"再複習一下就更好！📖":"別灰心，多練幾次！🌱";
  const r = $("#resultArea");
  r.classList.remove("hidden");
  r.innerHTML = `<div class="big">${correct} / ${total}</div>
    <div class="pct">正確率 ${pct}%　${msg}</div>
    <div class="row" style="justify-content:center;margin-top:18px;">
      <button class="btn" onclick="location.reload()">重新選日期</button>
      <button class="btn ghost" id="retryBtn">再考一次</button>
    </div>`;
  $("#retryBtn").onclick = ()=> startQuiz(shuffled);
  r.scrollIntoView({behavior:"smooth"});
}

$("#startBtn").onclick = ()=> startQuiz(false);
$("#shuffleBtn").onclick = ()=> startQuiz(true);
$("#submitBtn").onclick = grade;
</script>
</body>
</html>
